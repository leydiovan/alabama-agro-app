<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nó do Poço</title>
<!-- 16/10/2026 — página DEDICADA do nó do poço (padrão do projeto: uma página por público, como o mobile/).
     Pedido do dono: "temos agora que criar a parte de dados para a telemetria, fazer a minha página de
     configuração online". Lê o que o nó envia ao Supabase (migração 174) e muda a config (no_poco_config):
     o nó busca a cada 2 min, aplica e devolve versao_aplicada — esta página mostra se ele JÁ PEGOU.
     UI = reflexo do banco: nada é guardado aqui. Regras de atualização do projeto: recarrega ao voltar a
     ficar visível (focus/visibilitychange/online), não só por relógio, e falha de rede NÃO apaga o que já
     está na tela — pinta "PARADO há X". -->
<style>
:root{--fundo:#0f1115;--cartao:#181b22;--linha:#2a2f3a;--txt:#e8eaf0;--sub:#9aa3b2;--ok:#4ade80;--av:#fbbf24;--ru:#f87171;--az:#7cc4ff}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:#12151b;border-bottom:1px solid var(--linha);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:150px}
.pilula{border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px}
.p-ok{background:#163a24;color:var(--ok)}.p-av{background:#3d3112;color:var(--av)}.p-ru{background:#3d1717;color:var(--ru)}
main{max-width:1100px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:12px 14px}
.cartao h2{font-size:14px;margin:0 0 8px;color:var(--az);text-transform:uppercase;letter-spacing:.04em}
.largo{grid-column:1/-1}
table{width:100%;border-collapse:collapse}
td{padding:5px 2px;border-bottom:1px solid var(--linha);vertical-align:top}
td:first-child{color:var(--sub);width:42%}
.ok{color:var(--ok)}.av{color:var(--av)}.ru{color:var(--ru)}.sub{color:var(--sub);font-size:13px}
.grande{font-size:22px;font-weight:700}
label{display:block;color:var(--sub);font-size:13px;margin:8px 0 3px}
input[type=time],input[type=email],input[type=password]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--linha);background:#0f1218;color:var(--txt);font-size:16px}
.lin{display:flex;gap:10px}.lin>div{flex:1}
.chave{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px}
.chave input{width:22px;height:22px}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
button.sec{background:#2a2f3a;font-size:14px;padding:8px;width:auto;margin:0}
.msg{margin-top:8px;font-size:14px;min-height:18px}
.diario{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.45;max-height:340px;overflow:auto}
.diario div{padding:2px 0;border-bottom:1px dashed #232833}
.diario .ru{color:var(--ru)}.diario .av{color:var(--av)}
svg{width:100%;height:170px;display:block}
.login{max-width:380px;margin:80px auto;padding:20px}
</style>
</head>
<body>
<div id="app"><div class="login sub">Carregando…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://ngdidjtfgmtkdkvqwfjf.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nZGlkanRmZ210a2RrdnF3ZmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTU5MDYsImV4cCI6MjA5NjUzMTkwNn0.OW9hGEFTvSYx_THv3DR9pt8xIVC0B9Pw2bTDGD6TBLk';   // chave ANON (pública, a mesma do mobile/); as tabelas do nó exigem login (RLS, migração 174)
const POCO=parseInt(new URLSearchParams(location.search).get('poco')||'3',10);
const STATUS_SGV={0:'desligado',1:'em operação',2:'modo de espera',3:'proteção de baixa frequência',4:'proteção contra funcionamento A SECO',5:'proteção de sobrecorrente',6:'proteção de potência mínima'};
let SB, DADOS={}, ultimaOk=0, editando=false, _TIMERS=false;
const el=id=>document.getElementById(id);
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const min=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const quando=iso=>{if(!iso)return '—';const d=new Date(iso);return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})};
const ha=iso=>{if(!iso)return '—';const s=Math.round((Date.now()-new Date(iso))/1000);if(s<90)return s+' s';if(s<5400)return Math.round(s/60)+' min';return (s/3600).toFixed(1)+' h'};
const f1=v=>v==null?'—':Number(v).toFixed(1);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function telaLogin(msg){
  el('app').innerHTML=`<div class="login cartao"><h2>Nó do poço ${String(POCO).padStart(2,'0')}</h2>
    <label>E-mail</label><input id="em" type="email" autocomplete="username" inputmode="email">
    <label>Senha</label><input id="pw" type="password" autocomplete="current-password">
    <button id="btn">Entrar</button><div class="msg ru">${msg||''}</div></div>`;
  const entrar=async()=>{
    const e=el('em').value.trim(), s=el('pw').value;
    if(!e||!s) return telaLogin('Preencha e-mail e senha.');
    el('btn').textContent='Entrando…'; el('btn').disabled=true;
    const {error}=await SB.auth.signInWithPassword({email:e,password:s});
    if(error) return telaLogin(error.message);
    iniciar();
  };
  el('btn').onclick=entrar; el('pw').onkeydown=ev=>{if(ev.key==='Enter')entrar()};
}

function esqueleto(){
  el('app').innerHTML=`
  <header><h1>Nó do poço ${String(POCO).padStart(2,'0')}</h1><span id="vivo" class="pilula p-av">…</span>
    <button class="sec" id="sair">Sair</button></header>
  <main>
    <section class="cartao"><h2>Agora</h2><table id="agora"></table></section>
    <section class="cartao"><h2>Configuração</h2><div id="cfg"></div></section>
    <section class="cartao"><h2>Gerador (DEIF)</h2><table id="deif"></table></section>
    <section class="cartao"><h2>Bomba na solar (SGV)</h2><table id="sgv"></table></section>
    <section class="cartao largo"><h2>Corrente da bomba — últimas 12 h</h2><div id="graf" class="sub">…</div>
      <div class="sub"><span style="color:#fbbf24">■</span> solar (SGV, A) &nbsp; <span style="color:#7cc4ff">■</span> gerador (DEIF L1, A) &nbsp; <span style="color:#f87171">■</span> combustível (%)</div></section>
    <section class="cartao largo"><h2>Diário da automação</h2><div id="diario" class="diario sub">…</div></section>
  </main>`;
  el('sair').onclick=async()=>{await SB.auth.signOut(); telaLogin()};
}

async function carregar(){
  try{
    const [est,cfg,am,ev,ser]=await Promise.all([
      SB.from('no_poco_estado').select('*').eq('poco',POCO).maybeSingle(),
      SB.from('no_poco_config').select('*').eq('poco',POCO).maybeSingle(),
      SB.from('no_poco_amostra').select('*').eq('poco',POCO).order('ts',{ascending:false}).limit(1),
      SB.from('no_poco_evento').select('ts,texto').eq('poco',POCO).order('ts',{ascending:false}).limit(60),
      SB.from('no_poco_amostra').select('ts,sgv_a,i1,comb_pct').eq('poco',POCO)
        .gte('ts',new Date(Date.now()-12*3600e3).toISOString()).order('ts',{ascending:true}).limit(2000)]);
    for(const r of [est,cfg,am,ev,ser]) if(r.error) throw r.error;
    DADOS={est:est.data,cfg:cfg.data,am:(am.data||[])[0],ev:ev.data||[],ser:ser.data||[]};
    ultimaOk=Date.now();
    desenhar();
  }catch(e){ console.warn(e); vigia(); }        // falha de rede NÃO apaga o que está na tela
}

function vigia(){                                // "PARADO há X": congelamento visível, não silencioso
  const p=el('vivo'); if(!p) return;
  const e=DADOS.est, s=e?Math.round((Date.now()-new Date(e.atualizado_em))/1000):null;
  const paginaParada=ultimaOk&&Date.now()-ultimaOk>150e3;
  if(paginaParada){p.className='pilula p-ru';p.textContent='página sem atualizar há '+ha(new Date(ultimaOk).toISOString());return}
  if(s==null){p.className='pilula p-av';p.textContent='sem dados do nó ainda';return}
  if(s>600){p.className='pilula p-ru';p.textContent='NÓ MUDO há '+ha(e.atualizado_em);return}
  p.className='pilula p-ok';p.textContent='nó online · '+ha(e.atualizado_em);
}

function desenhar(){
  const {est:e,cfg:c,am:a,ev,ser}=DADOS;
  vigia();
  // AGORA
  const bomba=e?(e.k3?'<span class="ok">na SOLAR (K3)</span>':e.k4?'<span class="az" style="color:#7cc4ff">no GERADOR (K4)</span>':'<span class="av">parada (K3 e K4 abertos)</span>'):'—';
  el('agora').innerHTML=!e?'<tr><td colspan=2 class="sub">O nó ainda não mandou estado (firmware com telemetria ainda não gravado?).</td></tr>':`
    <tr><td>chave GLOQ4</td><td class="grande">${esc(e.posicao||'—')}</td></tr>
    <tr><td>bomba</td><td>${bomba}</td></tr>
    <tr><td>automação</td><td class="${e.auto_lig?'ok':'av'}">${e.auto_lig?'LIGADA':'desligada'} · solar ${hm(e.sol_ini)}–${hm(e.sol_fim)}</td></tr>
    <tr><td>combustível</td><td class="${e.comb_bloq?'ru':''}">${a?a.comb_pct+' %':'—'}${e.comb_bloq?' · BLOQUEADO (volta acima de 15 %)':''}</td></tr>
    <tr><td>relógio do nó</td><td class="${e.relogio==='NTP'?'ok':'av'}">${esc(e.relogio||'—')}</td></tr>
    <tr><td>último contato</td><td>${quando(e.atualizado_em)} (há ${ha(e.atualizado_em)})</td></tr>
    <tr><td>nó</td><td class="sub">boots ${e.boots} · no ar há ${ha(new Date(Date.now()-e.uptime_s*1000).toISOString())} · Wi-Fi ${e.wifi_dbm} dBm<br>${esc(e.firmware||'')}</td></tr>`;
  // CONFIG (não redesenha enquanto o dono edita)
  if(!editando){
    if(!c){el('cfg').innerHTML='<div class="sub">Sem configuração para este poço.</div>'}
    else{
      const pend=c.versao_aplicada==null||c.versao_aplicada<c.versao;
      el('cfg').innerHTML=`
        <div class="lin"><div><label>Solar de</label><input type="time" id="ini" value="${hm(c.sol_ini)}"></div>
        <div><label>até</label><input type="time" id="fim" value="${hm(c.sol_fim)}"></div></div>
        <div class="sub" style="margin-top:6px">Fora dessa janela a bomba vai para o gerador.</div>
        <label class="chave"><input type="checkbox" id="lig" ${c.auto_lig?'checked':''}> automação ligada</label>
        <button id="grava">Gravar</button>
        <div class="msg" id="cfgmsg"></div>
        <div class="sub" style="margin-top:8px">versão ${c.versao} · ${pend?'<span class="av">aguardando o nó aplicar (ele busca a cada 2 min)</span>':'<span class="ok">aplicada pelo nó'+(c.aplicada_em?' em '+quando(c.aplicada_em):'')+'</span>'}<br>
        última mudança: ${quando(c.alterado_em)} por ${esc(c.alterado_por||'—')}</div>`;
      for(const id of ['ini','fim','lig']) el(id).addEventListener('focus',()=>editando=true);
      el('grava').onclick=gravar;
    }
  }
  // DEIF
  el('deif').innerHTML=!a?'<tr><td colspan=2 class="sub">sem amostra</td></tr>':!a.deif_ok?'<tr><td colspan=2 class="ru">sem leitura do DEIF</td></tr>':`
    <tr><td>tensão · frequência</td><td>${f1(a.ger_v)} V · ${f1(a.ger_hz)} Hz</td></tr>
    <tr><td>correntes · potência</td><td>${f1(a.i1)} / ${f1(a.i2)} / ${f1(a.i3)} A · ${f1(a.kw)} kW</td></tr>
    <tr><td>motor</td><td>${a.rpm} rpm${a.rpm>0?' · óleo '+f1(a.oleo_bar)+' bar · água '+f1(a.agua_c)+' °C':' <span class="sub">(parado: óleo/água/horas vêm zerados do DEIF)</span>'}</td></tr>
    <tr><td>bateria · combustível</td><td>${f1(a.bat_v)} V · ${a.comb_pct} %</td></tr>
    <tr><td>estado (reg 91)</td><td>0x${(a.reg91||0).toString(16).padStart(4,'0')} ${(a.reg91&0x100)?'<span class="ok">RODANDO</span>':'parado'}${(a.reg91&0x10)?' · disponível':''}</td></tr>
    <tr><td>Fail to stop</td><td class="${((a.reg73||0)&0xF)>=2?'ru':'ok'}">${((a.reg73||0)&0xF)>=2?'ATIVO':'inativo'}</td></tr>
    <tr><td>amostra</td><td class="sub">${quando(a.ts)}</td></tr>`;
  // SGV
  el('sgv').innerHTML=!a?'<tr><td colspan=2 class="sub">sem amostra</td></tr>':!a.sgv_ok?'<tr><td colspan=2 class="ru">sem leitura do SGV</td></tr>':`
    <tr><td>saída</td><td class="grande">${f1(a.sgv_hz)} Hz · ${f1(a.sgv_a)} A</td></tr>
    <tr><td>tensão · potência</td><td>${f1(a.sgv_v)} V · ${f1(a.sgv_kw)} kW</td></tr>
    <tr><td>status</td><td class="${a.sgv_status===4||a.sgv_status===5?'ru':''}">${a.sgv_status==null?'—':a.sgv_status+' — '+(STATUS_SGV[a.sgv_status]||'?')}</td></tr>`;
  // DIÁRIO
  el('diario').innerHTML=!ev.length?'sem eventos':ev.map(x=>{
    const t=x.texto, cls=/ABORT|SEM DIESEL|SECO|COMBUSTIVEL|WATCHDOG|panic|SELETORA|RECUSADA/i.test(t)?'ru':/AVISO|ESPERANDO|nao confirmad/i.test(t)?'av':'';
    return `<div class="${cls}">${quando(x.ts)} &nbsp;${esc(t)}</div>`}).join('');
  grafico(ser);
}

function grafico(s){
  if(!s.length){el('graf').innerHTML='sem amostras nas últimas 12 h';return}
  const W=1000,H=170,t0=new Date(s[0].ts).getTime(),t1=Math.max(new Date(s[s.length-1].ts).getTime(),t0+1);
  const amax=Math.max(160,...s.map(x=>Math.max(x.sgv_a||0,x.i1||0)));
  const X=t=>((new Date(t).getTime()-t0)/(t1-t0)*(W-40)+30).toFixed(1), Y=(v,m)=>(H-18-(v||0)/m*(H-30)).toFixed(1);
  const linha=(k,m,cor)=>`<polyline fill="none" stroke="${cor}" stroke-width="2" points="${s.map(x=>X(x.ts)+','+Y(x[k],m)).join(' ')}"/>`;
  const marcas=[0,.25,.5,.75,1].map(f=>{const t=t0+f*(t1-t0);return `<text x="${(f*(W-40)+30).toFixed(0)}" y="${H-3}" fill="#9aa3b2" font-size="11" text-anchor="middle">${new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</text>`}).join('');
  el('graf').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="30" y1="${H-18}" x2="${W-10}" y2="${H-18}" stroke="#2a2f3a"/>
    <text x="2" y="14" fill="#9aa3b2" font-size="11">${amax.toFixed(0)} A</text>
    ${linha('comb_pct',100,'#f87171')}${linha('i1',amax,'#7cc4ff')}${linha('sgv_a',amax,'#fbbf24')}${marcas}</svg>`;
}

async function gravar(){
  const ini=min(el('ini').value), fim=min(el('fim').value), lig=el('lig').checked, m=el('cfgmsg');
  if(isNaN(ini)||isNaN(fim)||ini===fim){m.className='msg ru';m.textContent='Horário inválido (início e fim diferentes).';return}
  el('grava').disabled=true; m.className='msg sub'; m.textContent='Gravando…';
  const {error}=await SB.from('no_poco_config').update({sol_ini:ini,sol_fim:fim,auto_lig:lig}).eq('poco',POCO);
  el('grava').disabled=false;
  if(error){m.className='msg ru';m.textContent='Não gravou: '+error.message;return}
  editando=false; m.className='msg ok'; m.textContent='Gravado. O nó aplica em até 2 min.';
  await carregar();
}

async function iniciar(){
  esqueleto(); await carregar();
  if(_TIMERS) return; _TIMERS=true;
  setInterval(()=>{ if(document.visibilityState==='visible') carregar(); },30000);
  setInterval(vigia,10000);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') carregar(); });
  window.addEventListener('focus',()=>carregar());
  window.addEventListener('online',()=>carregar());
}
(async function(){
  if(!window.supabase){ el('app').innerHTML='<div class="login ru">Sem internet</div>'; return; }
  SB=window.supabase.createClient(SB_URL,SB_KEY);
  const {data}=await SB.auth.getSession();
  if(data&&data.session) iniciar(); else telaLogin();
})();
</script>
</body>
</html>
