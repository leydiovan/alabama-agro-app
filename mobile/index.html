<title>Alabama Agro</title>
<!--
  LINHA MOBILE — app de CONSULTA para escritório e proprietários.

  PRINCÍPIOS (valem para todas as telas desta linha)
    · SOMENTE LEITURA. Nada aqui altera dado. Quem opera usa o tablet de campo;
      quem administra usa os módulos do hub.
    · A TELA É DO CONTEÚDO. Celular não tem espaço para moldura: o mapa ocupa
      tudo e a navegação flutua por cima, em dois botões ao alcance do polegar.
    · ESQUERDA = seção (Clima · Relatórios · Telemetria · Safra).
      DIREITA  = submenu da seção atual (no Clima: Mapa · Agora · Histórico).
      Duas listas curtas em vez de uma longa e carregada.
    · Estados honestos: "sem dado" e "em construção" aparecem como tal.

  MAPA — DECISÃO DELIBERADA (não é descuido)
    Esta linha NÃO usa o mapa_ferramenta_geral.js. A regra "MAPA = FERRAMENTA
    ÚNICA" do CLAUDE.md existe para impedir CÓPIAS divergentes entre módulos de
    DESKTOP, e continua valendo lá. As ferramentas gerais (buscar imagem por
    data, corrigir cores, medir, tela cheia) são de ANÁLISE em tela grande; num
    celular não cabem nem servem. O mapa daqui é mínimo de propósito.
    Decidido com o dono em 01/08/2026.

  DADO: Supabase (clima_atual, clima_horario, clima_estacoes).
  Origem física: estação -> LoRa -> gateway -> Pi -> sync.
-->
<style>
:root{
  --bg:#080d18; --bg2:#0d1526; --bg3:#111e35; --bg4:#162540;
  --border:#1f3354; --border2:#2c4a78;
  --text:#e8edf5; --muted:#7796bb; --muted2:#3d5a80;
  --ok:#00c896; --warn:#ffb300; --err:#ff4444; --gold:#ffc107;
  --vidro:rgba(11,18,33,.82);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif}
svg{display:block}

/* ---------- palco: ocupa a tela inteira ---------- */
#palco{position:fixed;inset:0}
/* z-index:1 aqui é essencial: cria um CONTEXTO DE EMPILHAMENTO e prende os
   z-index internos do Leaflet (painéis vão até 800) dentro do mapa. Sem isso
   eles competem direto com a barra do topo, os chips e a legenda — que somem
   por baixo dos tiles. */
#mapa{position:absolute;inset:0;background:var(--bg3);z-index:1}
#folha{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg);padding:calc(env(safe-area-inset-top) + 58px) 16px
  calc(env(safe-area-inset-bottom) + 96px)}

/* ---------- barra flutuante do topo ---------- */
.topo{position:absolute;left:0;right:0;top:0;z-index:30;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 0;
  display:flex;align-items:center;gap:8px;pointer-events:none}
.topo>*{pointer-events:auto}
.marca{font-size:14px;font-weight:800;background:var(--vidro);backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:20px;padding:7px 13px;white-space:nowrap}
.marca .l{color:var(--gold)}
.tag{font-size:11px;font-weight:700;padding:7px 12px;border-radius:20px;white-space:nowrap;
  backdrop-filter:blur(10px);margin-left:auto}
.tag.ok{background:rgba(5,46,34,.9);color:#3fe0b0} .tag.old{background:rgba(58,42,0,.9);color:var(--gold)}
.tag.err{background:rgba(58,15,15,.9);color:#ff8080} .tag.wait{background:var(--vidro);color:var(--muted)}

/* ---------- chips (período / variável) sobre o mapa ---------- */
.faixa{position:absolute;left:0;right:0;z-index:25;display:flex;gap:7px;
  overflow-x:auto;padding:0 12px;-webkit-overflow-scrolling:touch;pointer-events:none}
.faixa::-webkit-scrollbar{display:none}
.faixa>*{pointer-events:auto}
.faixa.p1{top:calc(env(safe-area-inset-top) + 56px)}
.chip.sel{font-weight:700}
/* gaveta: a lista só aparece ao tocar no seletor — antes as 5 variáveis e os
   4 períodos ficavam sempre na tela, comendo espaço do mapa */
.gaveta{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 100px);z-index:40;
  background:var(--vidro);backdrop-filter:blur(14px);border:1px solid var(--border2);
  border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:150px;
  box-shadow:0 10px 28px rgba(0,0,0,.5);animation:sobe .14s ease both}
.gaveta button{background:none;border:0;color:var(--text);text-align:left;
  padding:11px 14px;border-radius:10px;font:600 14px inherit;cursor:pointer;min-height:44px}
.gaveta button.on{background:var(--gold);color:#1a1100}
.chip{flex:none;background:var(--vidro);backdrop-filter:blur(10px);border:1px solid var(--border);
  color:var(--muted);border-radius:20px;padding:8px 14px;font:600 12px inherit;cursor:pointer;
  min-height:36px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1100}
.chip svg{width:15px;height:15px}

/* ---------- legenda do mapa ---------- */
/* legenda enxuta: uma linha só — valor + barra com marcador da posição */
.legenda{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 90px);
  z-index:25;background:var(--vidro);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:11px}
.legenda .vl{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.legenda .vl .u{font-size:10px;font-weight:500;color:var(--muted);margin-left:2px}
.legenda .esc{flex:1;position:relative}
.legenda .barra{height:7px;border-radius:4px}
.legenda .mk{position:absolute;top:-3px;width:3px;height:13px;border-radius:2px;
  background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.55)}
.legenda .mm{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:2px}

/* card da estação — sobe acima da legenda ao tocar o marcador */
.cartao{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 148px);
  z-index:26;background:var(--vidro);backdrop-filter:blur(14px);border:1px solid var(--border2);
  border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:sobe .16s ease both}
.cartao .ch{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:4px;
  border-bottom:1px solid var(--border)}
.cartao .ch b{font-size:15px}
.cartao .ch button{margin-left:auto;background:none;border:0;color:var(--muted);
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cartao .ch button svg{width:16px;height:16px}
.cartao .cl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0}
.cartao .cl span{font-size:12px;color:var(--muted)}
.cartao .cl b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- botões flutuantes ---------- */
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:60;
  width:56px;height:56px;border-radius:50%;border:1px solid var(--border2);
  background:var(--vidro);backdrop-filter:blur(14px);color:var(--gold);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab.esq{left:18px} .fab.dir{right:18px}
.fab svg{width:26px;height:26px}
.fab.aberto{background:var(--gold);color:#1a1100;border-color:var(--gold)}

.menu{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:60;
  display:flex;flex-direction:column;gap:9px}
.menu.esq{left:18px;align-items:flex-start} .menu.dir{right:18px;align-items:flex-end}
.menu button{display:flex;align-items:center;gap:10px;background:var(--vidro);
  backdrop-filter:blur(14px);border:1px solid var(--border);color:var(--text);
  border-radius:26px;padding:10px 16px;font:600 14px inherit;cursor:pointer;min-height:48px;
  box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap;
  animation:sobe .16s ease both}
.menu.dir button{flex-direction:row-reverse}
.menu button.on{border-color:var(--gold);color:var(--gold)}
.menu button svg{width:22px;height:22px;flex:none}
.menu button small{font-size:11px;color:var(--muted2);font-weight:500}
@keyframes sobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.veu{position:fixed;inset:0;z-index:55;background:rgba(4,8,16,.5);backdrop-filter:blur(2px)}

/* ---------- conteúdo das folhas (Agora / Histórico) ---------- */
.sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
  font-weight:700;margin:22px 0 10px}
.sec:first-child{margin-top:0}
.hero{background:linear-gradient(160deg,var(--bg3),var(--bg2));border:1px solid var(--border);
  border-radius:20px;padding:20px}
.hero .t{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .t .u{font-size:20px;font-weight:600;color:var(--muted);margin-left:3px}
.hero .lin{display:flex;align-items:flex-start}
.hero .ic{margin-left:auto}
.hero .quem{font-size:13px;color:var(--muted);margin-top:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px}
.card.w{grid-column:1/-1}
.card .lb{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.card .vl{font-size:26px;font-weight:800;margin-top:6px;line-height:1.05;font-variant-numeric:tabular-nums}
.card .vl .u{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.card .ex{font-size:12px;color:var(--muted);margin-top:4px}
.seta{font-size:28px;line-height:1;vertical-align:-3px}
.item{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:14px;margin-bottom:9px;min-height:60px}
.item.off{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .nm{font-weight:600;font-size:14px}
.item .sb{font-size:12px;color:var(--muted);margin-top:2px}
.item .vr{margin-left:auto;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 6px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
th:first-child,td:first-child{text-align:left}
.vazio{text-align:center;color:var(--muted);padding:70px 24px}
.vazio svg{width:52px;height:52px;margin:0 auto 14px;opacity:.35}
.muted{color:var(--muted)}

/* ---------- login ---------- */
.login{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;
  justify-content:center;padding:28px 22px}
.login h1{font-size:25px;font-weight:800;margin-bottom:4px}
.login p{color:var(--muted);font-size:13px;margin-bottom:26px}
.login label{display:block;font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.login input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:14px;color:var(--text);font-size:16px;min-height:50px}
.login input:focus{outline:none;border-color:var(--gold)}
.login button{width:100%;margin-top:22px;background:var(--gold);color:#1a1100;border:0;
  border-radius:12px;padding:15px;font:800 15px inherit;min-height:52px;cursor:pointer}
.login .msg{margin-top:14px;font-size:13px;text-align:center;min-height:20px;color:var(--err)}
</style>
</head>

<script>

/* ============================================================

const IC={

  camadas:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"

  hist:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"

  obra:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"

    <path d="M9 20v-6h6v6"/></svg>`
};

const SECOES=[['clima','Clima',IC.clima],['rel','Relatórios',IC.rel],
              ['tel','Telemetria',IC.tel],['safra','Safra',IC.safra]];
const SUBS={ clima:[['mapa','Mapa',IC.mapa],['agora','Agora',IC.agora],['hist','Histórico',IC.hist]] };

let SB=null, SECAO='clima', SUB='mapa', MENU=null;   // MENU: null | 'esq' | 'dir'
let SELETOR=null;
let ESTSEL=null;                                     // estacao com card aberto                                    // gaveta aberta: null | 'var' | 'per'
let PERIODO='agora', VARMAPA='chuva';   // abre na chuva (o que mais se consulta)
let ESTACOES=[], ATUAL=[], HORAS=[], LOTES=[];
let _map=null,_heat=null,_lotesL=null,_estL=null;
let _cv=null,_anim=null,_part=[];   // partículas de vento
const el=id=>document.getElementById(id);

/* ---------- utilidades ---------- */
const num=v=>(v===null||v===undefined||v==='')?null:(isNaN(+v)?null:+v);
const f=(v,c)=>v===null||v===undefined?'—':(+v).toFixed(c===undefined?1:c);
const dirNome=g=>g===null?'':['N','NE','L','SE','S','SO','O','NO'][Math.round(g/45)%8];
const dirSeta=g=>g===null?'':['↓','↙','←','↖','↑','↗','→','↘'][Math.round(g/45)%8];
function idade(s){ if(s===null) return '—'; if(s<90) return 'agora';
  if(s<3600) return Math.floor(s/60)+' min'; const h=Math.floor(s/3600);
  return h<24?h+' h':Math.floor(h/24)+' d'; }
function hhmm(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—';
  const hm=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return d.toDateString()===new Date().toDateString()?hm
    :String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+hm; }

const PERIODOS={agora:{lbl:'Agora',h:0},'24h':{lbl:'24 h',h:24},
                '7d':{lbl:'7 dias',h:168},'30d':{lbl:'30 dias',h:720}};
/* `esc` = escala ABSOLUTA da cor. Antes a escala era o próprio valor ±1, o que
   fazia qualquer leitura cair no meio do gradiente: 24,9 °C e 29,2 °C pintavam
   igual e trocar de período parecia não mudar nada. Com escala fixa a cor passa
   a significar alguma coisa por si — quente é quente em qualquer período. */
const VARS={
  temp: {lbl:'Temp',un:'°C',c:'temp',ch:'temp',dec:1,esc:[5,45],
         grad:[[59,130,246],[56,189,248],[34,197,94],[250,204,21],[249,115,22],[239,68,68]]},
  umid: {lbl:'Umidade',un:'%',c:'umidade',ch:'umidade',dec:0,esc:[0,100],
         grad:[[249,115,22],[250,204,21],[34,197,94],[56,189,248],[59,130,246]]},
  // vento é mostrado por PARTÍCULAS, não por mancha: a mesma informação em
  // duas camadas atrapalhava a leitura (mesma decisão do módulo do desktop)
  vento:{lbl:'Vento',un:'km/h',c:'vento_kmh',ch:'vento_kmh',dec:1,esc:[0,30],sopro:true,
         grad:[[56,189,248],[52,211,153],[250,204,21],[249,115,22],[239,68,68]]},
  // chuva depende da janela: 30 mm em 24 h é muito, em 30 dias é pouco
  chuva:{lbl:'Chuva',un:'mm',c:'chuva_24h',ch:'chuva_mm',dec:1,acum:true,
         escPer:{agora:30,'24h':30,'7d':80,'30d':200},
         grad:[[148,163,184],[125,211,252],[56,189,248],[59,130,246],[37,99,235]]},
  pres: {lbl:'Pressão',un:'hPa',c:'pressao',ch:'pressao',dec:1,conv:v=>v/100,esc:[905,955],
         grad:[[124,58,237],[59,130,246],[34,197,94],[250,204,21],[249,115,22]]}
};
function escalaDe(k){
  const c=VARS[k];
  if(c.escPer) return [0, c.escPer[PERIODO]||30];
  return c.esc;
}
function est(id){ return ESTACOES.find(x=>x.id===id)||{}; }

/* direção que ventou por MAIS TEMPO — média de ângulo devolveria direção que
   nunca ocorreu (4 h de NE + 3 h de NO dariam norte) */
function dirMedia(ds){ const v=ds.filter(d=>d!==null&&!isNaN(d)); if(!v.length) return null;
  const x=v.reduce((s,d)=>s+Math.cos(d*Math.PI/180),0), y=v.reduce((s,d)=>s+Math.sin(d*Math.PI/180),0);
  return (Math.atan2(y,x)*180/Math.PI+360)%360; }
function dirPredominante(rows){
  const p=new Array(8).fill(0), a=Array.from({length:8},()=>[]);
  rows.forEach(r=>{ const d=num(r.vento_dir); if(d===null) return;
    const i=Math.round(((d%360)+360)%360/45)%8; p[i]+=(num(r.amostras)||1); a[i].push(d); });
  let im=-1,mx=0; p.forEach((v,i)=>{ if(v>mx){mx=v;im=i;} });
  if(im<0) return null;
  const tot=p.reduce((s,v)=>s+v,0);
  return {dir:dirMedia(a[im]), fatia:tot?mx/tot:0};
}
function valores(k){
  const cfg=VARS[k];
  if(PERIODO==='agora')
    return ATUAL.map(x=>{ let v=num(x[cfg.c]); if(v!==null&&cfg.conv) v=cfg.conv(v);
      return {id:x.estacao_id,v,dir:num(x.vento_dir),e:est(x.estacao_id)}; })
      .filter(x=>x.v!==null&&num(x.e.lat)!==null);
  const lim=Date.now()-PERIODOS[PERIODO].h*3600e3, por={};
  HORAS.forEach(r=>{ const t=new Date(r.hora).getTime();
    if(isNaN(t)||t<lim) return; (por[r.estacao_id]=por[r.estacao_id]||[]).push(r); });
  return Object.keys(por).map(id=>{
    const rows=por[id], vs=rows.map(r=>num(r[cfg.ch])).filter(v=>v!==null);
    if(!vs.length) return null;
    let v=cfg.acum?vs.reduce((a,b)=>a+b,0):vs.reduce((a,b)=>a+b,0)/vs.length;  // chuva SOMA
    if(cfg.conv) v=cfg.conv(v);
    const pd=dirPredominante(rows);
    return {id:+id,v,dir:pd?pd.dir:null,fatia:pd?pd.fatia:null,e:est(+id)};
  }).filter(x=>x&&num(x.e.lat)!==null);
}
function media(k){ const p=valores(k);
  return p.length?{v:p.reduce((s,x)=>s+x.v,0)/p.length,dir:p[0].dir,fatia:p[0].fatia,n:p.length}:null; }

/* ---------- dados ---------- */
function utm2ll(E,N){
  const a=6378137,fl=1/298.257223563,e2=fl*(2-fl),ep2=e2/(1-e2),k0=.9996;
  const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const x=E-5e5,y=N-1e7,M=y/k0,mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2**3/256));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu);
  const C1=ep2*Math.cos(p1)**2,T1=Math.tan(p1)**2,N1=a/Math.sqrt(1-e2*Math.sin(p1)**2),
        R1=a*(1-e2)/Math.pow(1-e2*Math.sin(p1)**2,1.5),D=x/(N1*k0);
  const lat=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const l0=(23*6-183)*Math.PI/180;
  const lon=l0+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(p1);
  return [lat*180/Math.PI,lon*180/Math.PI];
}
async function carregar(){
  try{
    const [e,a,h,l]=await Promise.all([
      SB.from('clima_estacoes').select('*').order('id'),
      SB.from('clima_atual').select('*'),
      SB.from('clima_horario').select('*').gte('hora',new Date(Date.now()-31*864e5).toISOString()).order('hora'),
      LOTES.length?Promise.resolve({data:null}):SB.from('lotes').select('nome,geom').not('referencia','is',true)
    ]);
    ESTACOES=e.data||[]; ATUAL=a.data||[]; HORAS=h.data||[];
    if(l&&l.data) LOTES=(l.data||[]).map(x=>{ const g=x.geom;
      if(!g||!Array.isArray(g.ring)||g.ring.length<3) return null;
      return {nome:x.nome,ring:g.ring.map(p=>utm2ll(+p[0],+p[1]))}; }).filter(Boolean);
    pinta();
  }catch(err){ el('app').innerHTML=`<div class="vazio">${err.message}</div>`; }
}

/* ---------- mapa (mínimo, de toque) ---------- */
let _lf=false;
/* NAO chamar de `leaflet`: o bundle UMD do Leaflet 1.9 faz factory(global.leaflet = {})
   e SOBRESCREVE uma funcao global com esse nome assim que carrega. O sintoma era
   "leaflet is not a function" na segunda vez que se abria o mapa, com tela preta. */
function garantirLeaflet(cb){
  if(window.L) return cb();
  if(_lf){ const t=setInterval(()=>{ if(window.L){ clearInterval(t); cb(); } },120); return; }
  _lf=true;
  const c=document.createElement('link'); c.rel='stylesheet';
  c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(c);
  const j=document.createElement('script'); j.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  j.onload=()=>cb(); j.onerror=()=>{ const m=el('mapa');
    if(m) m.innerHTML='<div class="vazio">mapa indisponível (sem internet)</div>'; };
  document.head.appendChild(j);
}
function bbox(){ let a=90,b=-90,c=180,d=-180,ok=false;
  LOTES.forEach(l=>l.ring.forEach(p=>{ ok=true;a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);d=Math.max(d,p[1]); }));
  return ok?{minLat:a,maxLat:b,minLon:c,maxLon:d}:null; }
function corDe(v,mn,mx,g){ if(v===null||mx===mn) return [120,130,150];
  const t=Math.max(0,Math.min(1,(v-mn)/(mx-mn))),p=t*(g.length-1),
        i=Math.min(g.length-2,Math.floor(p)),k=p-i;
  return [0,1,2].map(c=>Math.round(g[i][c]*(1-k)+g[i+1][c]*k)); }
function idw(lat,lon,pts){ let n=0,d=0;
  for(const p of pts){ const q=(lat-+p.e.lat)**2+(lon-+p.e.lon)**2;
    if(q<1e-10) return p.v; const w=1/q; n+=w*p.v; d+=w; } return d?n/d:null; }
/* ---- vento: partículas em vez de mancha ----
   A direção medida é de ONDE o vento vem, então o deslocamento vai para o lado
   OPOSTO: u = -sin(dir) na longitude, v = -cos(dir) na latitude. */
function dentroDaFazenda(lat,lon){
  if(!LOTES.length) return true;
  for(const l of LOTES){ const r=l.ring; let d=false;
    for(let i=0,j=r.length-1;i<r.length;j=i++){
      if(((r[i][0]>lat)!==(r[j][0]>lat)) &&
         (lon<(r[j][1]-r[i][1])*(lat-r[i][0])/(r[j][0]-r[i][0])+r[i][1])) d=!d; }
    if(d) return true; }
  return false;
}
function ventoEm(lat,lon,pts){
  let u=0,v=0,w=0;
  for(const p of pts){
    if(p.dir===null||p.v===null) continue;
    const d2=(lat-+p.e.lat)**2+(lon-+p.e.lon)**2; if(d2<1e-10) continue;
    const q=1/d2, r=p.dir*Math.PI/180;
    u+=q*(-Math.sin(r))*p.v; v+=q*(-Math.cos(r))*p.v; w+=q;
  }
  return w?{u:u/w,v:v/w}:null;
}
function pararVento(){
  if(_anim){ cancelAnimationFrame(_anim); _anim=null; }
  if(_cv&&_cv.parentNode) _cv.parentNode.removeChild(_cv);
  _cv=null; _part=[];
}
function iniciarVento(){
  pararVento();
  if(!_map) return;
  const pts=valores('vento').filter(p=>p.dir!==null), bb=bbox();
  if(!pts.length||!bb) return;
  _cv=document.createElement('canvas');
  _cv.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:400';
  _map.getPanes().overlayPane.appendChild(_cv);
  // nasce SÓ dentro dos lotes: nascendo na caixa inteira sobravam traços soltos
  // fora da fazenda (a partícula desenhava 1 segmento antes de ser descartada)
  const nova=()=>{ for(let t=0;t<60;t++){
      const lat=bb.minLat+Math.random()*(bb.maxLat-bb.minLat);
      const lon=bb.minLon+Math.random()*(bb.maxLon-bb.minLon);
      if(dentroDaFazenda(lat,lon)) return {lat,lon,i:Math.floor(Math.random()*70),vida:70+Math.floor(Math.random()*70)};
    } return null; };
  _part=Array.from({length:160},nova).filter(Boolean);
  if(!_part.length){ pararVento(); return; }
  const cx=_cv.getContext('2d');
  (function passo(){
    if(!_cv||!_map) return;
    const sz=_map.getSize();
    if(_cv.width!==sz.x||_cv.height!==sz.y){ _cv.width=sz.x; _cv.height=sz.y; }
    L.DomUtil.setPosition(_cv,_map.containerPointToLayerPoint([0,0]));
    cx.globalCompositeOperation='destination-out'; cx.fillStyle='rgba(0,0,0,.11)';
    cx.fillRect(0,0,_cv.width,_cv.height);
    cx.globalCompositeOperation='source-over'; cx.lineWidth=1.7; cx.lineCap='round';
    for(let i=0;i<_part.length;i++){
      const p=_part[i]; if(!p) continue;
      const w=ventoEm(p.lat,p.lon,pts); if(!w){ _part[i]=nova(); continue; }
      const la=p.lat+w.v*0.00016, lo=p.lon+w.u*0.00016;
      if(!dentroDaFazenda(la,lo)){ _part[i]=nova(); continue; }
      const a=_map.latLngToContainerPoint([p.lat,p.lon]), b=_map.latLngToContainerPoint([la,lo]);
      const vel=Math.hypot(w.u,w.v);
      cx.strokeStyle = vel<5?'rgba(56,189,248,.85)' : vel<10?'rgba(52,211,153,.9)'
                     : vel<15?'rgba(250,204,21,.92)' : 'rgba(249,115,22,.95)';
      cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke();
      p.lat=la; p.lon=lo; p.i++;
      if(p.i>p.vida) _part[i]=nova();
    }
    _anim=requestAnimationFrame(passo);
  })();
}
function mascara(bb,W,H){
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  if(!LOTES.length){ x.fillStyle='#fff'; x.fillRect(0,0,W,H); return cv; }
  x.fillStyle='#fff';
  LOTES.forEach(l=>{ x.beginPath();
    l.ring.forEach((p,i)=>{ const px=((p[1]-bb.minLon)/(bb.maxLon-bb.minLon))*W,
                                  py=((bb.maxLat-p[0])/(bb.maxLat-bb.minLat))*H;
      i?x.lineTo(px,py):x.moveTo(px,py); }); x.closePath(); x.fill(); });
  return cv;
}
/* Destrói o mapa de verdade ao trocar de tela. Antes bastava _map=null, mas a
   instância antiga ficava viva presa a um DOM já substituído — daí o erro de
   inicialização e a tela preta ao voltar para o Clima. */
function destruirMapa(){
  pararVento();
  if(_map){ try{ _map.remove(); }catch(e){} }
  _map=null; _heat=null; _lotesL=null; _estL=null;
}
function desenhaMapa(){
  const m=el('mapa'); if(!m||!window.L) return;
  if(!_map){
    // o container acabou de entrar no DOM e pode estar com altura 0; criar o
    // mapa aqui deixava os tiles sem desenhar (tela preta) até algum clique
    // disparar um invalidateSize. Espera o layout antes de montar.
    if(!m.clientHeight){ requestAnimationFrame(()=>desenhaMapa()); return; }
    _map=L.map(m,{zoomControl:false,attributionControl:false});
    L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
      {subdomains:['mt0','mt1','mt2','mt3'],maxZoom:20}).addTo(_map);
    const bb=bbox();
    if(bb) _map.fitBounds([[bb.minLat,bb.minLon],[bb.maxLat,bb.maxLon]],{padding:[16,16]});
    else _map.setView([-12.62,-44.72],11);
    _map.whenReady(()=>{ try{ _map.invalidateSize(); }catch(e){} });
  }
  if(_lotesL) _map.removeLayer(_lotesL);
  _lotesL=L.layerGroup(LOTES.map(l=>L.polygon(l.ring,
    {color:'#ff4444',weight:1.1,opacity:.8,fill:false,interactive:false}))).addTo(_map);
  if(_heat){ _map.removeLayer(_heat); _heat=null; }
  const cfg=VARS[VARMAPA], pts=valores(VARMAPA), bb=bbox();
  const lg=el('legenda');
  if(cfg.sopro){                    // VENTO: só partículas, sem mancha por baixo
    pararVento(); iniciarVento(); legendaVento();
    if(_estL) _map.removeLayer(_estL);
    _estL=marcadores(); _estL.addTo(_map);
    setTimeout(()=>{ try{ _map.invalidateSize(); }catch(e){} },100);
    return;
  }
  pararVento();
  if(pts.length&&bb){
    const [mn,mx]=escalaDe(VARMAPA);   // escala ABSOLUTA — ver comentário em VARS
    const CW=180,CH=180,cv=document.createElement('canvas'); cv.width=CW; cv.height=CH;
    const cx=cv.getContext('2d'),img=cx.createImageData(CW,CH);
    for(let i=0;i<CH;i++){ const lat=bb.maxLat-(i/(CH-1))*(bb.maxLat-bb.minLat);
      for(let j=0;j<CW;j++){ const lon=bb.minLon+(j/(CW-1))*(bb.maxLon-bb.minLon),k=(i*CW+j)*4;
        const v=idw(lat,lon,pts); if(v===null){ img.data[k+3]=0; continue; }
        const c=corDe(v,mn,mx,cfg.grad);
        img.data[k]=c[0];img.data[k+1]=c[1];img.data[k+2]=c[2];img.data[k+3]=255; } }
    cx.putImageData(img,0,0);
    const OW=760,OH=Math.round(OW*CH/CW);
    const out=document.createElement('canvas'); out.width=OW; out.height=OH;
    const ox=out.getContext('2d'); ox.imageSmoothingEnabled=true; ox.imageSmoothingQuality='high';
    ox.drawImage(cv,0,0,OW,OH);
    ox.globalCompositeOperation='destination-in'; ox.drawImage(mascara(bb,OW,OH),0,0);
    _heat=L.imageOverlay(out.toDataURL(),[[bb.minLat,bb.minLon],[bb.maxLat,bb.maxLon]],{opacity:.72}).addTo(_map);
    if(lg){
      const md=media(VARMAPA);
      const g=cfg.grad.map((c,i)=>`rgb(${c[0]},${c[1]},${c[2]}) ${(i/(cfg.grad.length-1))*100}%`).join(',');
      const pos = md&&md.v!==null ? Math.max(0,Math.min(100,((md.v-mn)/(mx-mn))*100)) : null;
      lg.innerHTML=`<span class="vl">${f(md&&md.v,cfg.dec)}<span class="u">${cfg.un}</span></span>
        <span class="esc">
          <span class="barra" style="display:block;background:linear-gradient(90deg,${g})"></span>
          ${pos!==null?`<span class="mk" style="left:calc(${pos}% - 1.5px)"></span>`:''}
          <span class="mm"><span>${f(mn,0)}</span><span>${f(mx,0)}</span></span>
        </span>`;
      lg.style.display='';
    }
  } else if(lg) lg.style.display='none';
  if(_estL) _map.removeLayer(_estL);
  _estL=marcadores(); _estL.addTo(_map);
  setTimeout(()=>{ try{ _map.invalidateSize(); }catch(e){} },100);
}

      <td>${num(h.chuva_mm)>0?'<b>'+f(h.chuva_mm,1)+'</b>':'—'}</td></tr>`).join('')}</tbody>
  </table></div>`;
}
function grafico(s){
  const v=s.map(h=>+h.temp); if(v.length<2) return `<div class="muted" style="text-align:center;padding:30px 0">
    ${v.length?'só 1 leitura':'sem dado'}</div>`;
  const W=340,H=130,mn=Math.min(...v),mx=Math.max(...v),amp=(mx-mn)||1;
  const pts=v.map((x,i)=>[(i/(v.length-1))*W,H-((x-mn)/amp)*(H-26)-13]);
  const ln='M '+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:130px">
    <defs><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a45" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#ff7a45" stop-opacity="0"/></linearGradient></defs>
    <path d="${ln} L ${W} ${H} L 0 ${H} Z" fill="url(#gt)"/>
    <path d="${ln}" fill="none" stroke="#ff7a45" stroke-width="2.4" stroke-linejoin="round"/></svg>
  <div class="ex" style="display:flex;justify-content:space-between;margin-top:6px">
    <span>mín ${f(mn,1)}°</span><span>${v.length} h</span><span>máx ${f(mx,1)}°</span></div>`;
}
const semDado=(t)=>`<div class="vazio">${IC.clima}${t||'Nenhuma estação enviou leitura ainda.'}</div>`;
const emObra=(n)=>`<div class="vazio">${IC.obra}<b style="color:var(--text);font-size:16px">${n}</b><br>
  <span style="font-size:13px">Em construção.</span></div>`;

/* ---------- render ---------- */
/* No topo à direita vai a DATA E HORA da última leitura — não o período.
   Repetir "Agora" ali não dizia nada (e continuava "Agora" mesmo com 7 dias
   selecionado). O que interessa saber de relance é quão fresco é o dado. */
function selo(){
  const v=ATUAL.filter(x=>x.temp!==null);
  if(!v.length) return '<span class="tag wait">sem leitura</span>';
  const n=Math.min(...v.map(x=>x.idade_s===null?9e9:x.idade_s));
  let ms=null; v.forEach(x=>{ const t=new Date(x.medido_em).getTime();
    if(!isNaN(t)&&(ms===null||t>ms)) ms=t; });
  const d=ms?new Date(ms):null;
  const hoje=d&&d.toDateString()===new Date().toDateString();
  const txt=d?(hoje?d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
                   :d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}))
            :'—';
  return `<span class="tag ${n<600?'ok':'old'}">${n<600?'●':'⚠'} ${txt}</span>`;
}
let _modo=null;   // 'mapa' | 'folha' — só remonta a estrutura quando o modo muda

function pinta(){
  const noMapa = SECAO==='clima' && SUB==='mapa';
  const modo = noMapa?'mapa':'folha';
  let corpo='';
  if(SECAO!=='clima') corpo=emObra(SECOES.find(s=>s[0]===SECAO)[1]);
  else if(SUB==='agora') corpo=folhaAgora();
  else if(SUB==='hist') corpo=folhaHist();

  /* O #mapa é criado UMA vez e sobrevive às repinturas. Trocar variável ou
     período refaz só a moldura (#chrome) — se o innerHTML inteiro fosse
     reescrito, o Leaflet seria destruído e remontado a cada toque, perdendo
     posição e zoom. */
  if(_modo!==modo || !el('palco')){
    _modo=modo;
    el('app').innerHTML=`<div id="palco">
        ${noMapa?'<div id="mapa"></div>':'<div id="folha"></div>'}
        <div id="chrome"></div></div>
      <div id="flutua"></div>`;
  }
  if(!noMapa) el('folha').innerHTML=corpo;

  el('chrome').innerHTML=`
    <div class="topo"><div class="marca"><span class="l">🌿</span> Alabama</div>${selo()}</div>
    ${noMapa?`
      <div class="faixa p1">
        <button class="chip sel ${SELETOR==='var'?'on':''}" data-abrir="var">${VARS[VARMAPA].lbl} ▾</button>
        <button class="chip sel ${SELETOR==='per'?'on':''}" data-abrir="per">${PERIODOS[PERIODO].lbl} ▾</button>
      </div>
      ${SELETOR?`<div class="gaveta">${
        (SELETOR==='var'
          ? Object.keys(VARS).map(k=>[k,VARS[k].lbl,VARMAPA===k,'vm'])
          : Object.keys(PERIODOS).map(k=>[k,PERIODOS[k].lbl,PERIODO===k,'per'])
        ).map(([k,n,on,tipo])=>`<button data-${tipo}="${k}" class="${on?'on':''}">${n}</button>`).join('')
      }</div>`:''}
      <div class="legenda" id="legenda"></div>
      <div class="cartao" id="cartao" style="display:none"></div>`:''}`;

  el('flutua').innerHTML=`
    ${MENU?'<div class="veu" id="veu"></div>':''}
    ${MENU==='esq'?`<div class="menu esq">${SECOES.map(([k,n,i])=>
      `<button data-sec="${k}" class="${SECAO===k?'on':''}">${i}<span>${n}</span></button>`).join('')}</div>`:''}
    ${MENU==='dir'?`<div class="menu dir">${(SUBS[SECAO]||[]).length
      ?SUBS[SECAO].map(([k,n,i])=>`<button data-sub="${k}" class="${SUB===k?'on':''}">${i}<span>${n}</span></button>`).join('')
      :`<button disabled style="opacity:.6">${IC.obra}<span>sem submenu</span></button>`}</div>`:''}
    <button class="fab esq ${MENU==='esq'?'aberto':''}" id="fesq">${MENU==='esq'?IC.fechar:iconeSecao()}</button>
    <button class="fab dir ${MENU==='dir'?'aberto':''}" id="fdir">${MENU==='dir'?IC.fechar:iconeSub()}</button>`;

  el('fesq').onclick=()=>{ MENU=MENU==='esq'?null:'esq'; pinta(); };
  el('fdir').onclick=()=>{ MENU=MENU==='dir'?null:'dir'; pinta(); };
  if(el('veu')) el('veu').onclick=()=>{ MENU=null; pinta(); };
  document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{
    SECAO=b.dataset.sec; SUB=(SUBS[SECAO]||[['mapa']])[0][0]; MENU=null; SELETOR=null; ESTSEL=null; trocarTela(pinta); });
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{
    SUB=b.dataset.sub; MENU=null; SELETOR=null; ESTSEL=null; trocarTela(pinta); });
  document.querySelectorAll('[data-abrir]').forEach(b=>b.onclick=()=>{
    SELETOR = SELETOR===b.dataset.abrir ? null : b.dataset.abrir; pinta(); });
  document.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{
    PERIODO=b.dataset.per; SELETOR=null; pinta(); });
  document.querySelectorAll('[data-vm]').forEach(b=>b.onclick=()=>{
    VARMAPA=b.dataset.vm; SELETOR=null; pinta(); });

  if(noMapa && ATUAL.some(x=>x.temp!==null)) garantirLeaflet(desenhaMapa);
}
/* trocar de seção/submenu muda o modo -> aí sim o mapa é destruído de verdade */
function trocarTela(fn){ destruirMapa(); _modo=null; fn(); }

/* ---------- login ---------- */
function telaLogin(msg){
  el('app').innerHTML=`<div class="login">
    <h1><span style="color:var(--gold)">🌿</span> Alabama Agro</h1>
    <p>Consulta — escritório e proprietários</p>
    <label>E-mail</label><input id="em" type="email" autocomplete="username" inputmode="email">
    <label>Senha</label><input id="pw" type="password" autocomplete="current-password">
    <button id="btn">Entrar</button><div class="msg">${msg||''}</div></div>`;
  const entrar=async()=>{
    const e=el('em').value.trim(), s=el('pw').value;
    if(!e||!s) return telaLogin('Preencha e-mail e senha.');
    el('btn').textContent='Entrando…'; el('btn').disabled=true;
    const {error}=await SB.auth.signInWithPassword({email:e,password:s});
    if(error) return telaLogin(error.message);
    iniciar();
  };
  el('btn').onclick=entrar;
  el('pw').onkeydown=ev=>{ if(ev.key==='Enter') entrar(); };
}
async function iniciar(){
  el('app').innerHTML='<div class="vazio" style="padding-top:140px">Carregando…</div>';
  await carregar();
  setInterval(()=>{ if(document.visibilityState==='visible') carregar(); },120000);
}
(async function(){
  if(!window.supabase){ el('app').innerHTML='<div class="vazio">Sem internet</div>'; return; }
  SB=window.supabase.createClient(SB_URL,SB_KEY);
  const {data}=await SB.auth.getSession();
  if(data&&data.session) iniciar(); else telaLogin();
})();
</script>
</body>
