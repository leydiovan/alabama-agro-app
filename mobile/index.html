<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Alabama Agro</title>
<!--
  LINHA MOBILE — app de CONSULTA para escritório e proprietários.

  PRINCÍPIOS (valem para todas as telas desta linha)
    · SOMENTE LEITURA. Nada aqui altera dado. Quem opera usa o tablet de campo;
      quem administra usa os módulos do hub.
    · A TELA É DO CONTEÚDO. Celular não tem espaço para moldura: o mapa ocupa
      tudo e a navegação flutua por cima, em dois botões ao alcance do polegar.
    · ESQUERDA = seção (Clima · Relatórios · Telemetria · Safra).
      DIREITA  = submenu da seção atual (no Clima: Mapa · Agora · Histórico).
      Duas listas curtas em vez de uma longa e carregada.
    · Estados honestos: "sem dado" e "em construção" aparecem como tal.

  MAPA — DECISÃO DELIBERADA (não é descuido)
    Esta linha NÃO usa o mapa_ferramenta_geral.js. A regra "MAPA = FERRAMENTA
    ÚNICA" do CLAUDE.md existe para impedir CÓPIAS divergentes entre módulos de
    DESKTOP, e continua valendo lá. As ferramentas gerais (buscar imagem por
    data, corrigir cores, medir, tela cheia) são de ANÁLISE em tela grande; num
    celular não cabem nem servem. O mapa daqui é mínimo de propósito.
    Decidido com o dono em 01/08/2026.

  DADO: Supabase (clima_atual, clima_horario, clima_estacoes).
  Origem física: estação -> LoRa -> gateway -> Pi -> sync.
-->
<style>
:root{
  --bg:#080d18; --bg2:#0d1526; --bg3:#111e35; --bg4:#162540;
  --border:#1f3354; --border2:#2c4a78;
  --text:#e8edf5; --muted:#7796bb; --muted2:#3d5a80;
  --ok:#00c896; --warn:#ffb300; --err:#ff4444; --gold:#ffc107;
  --vidro:rgba(11,18,33,.82);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif}
svg{display:block}

/* ---------- palco: ocupa a tela inteira ---------- */
#palco{position:fixed;inset:0}
/* z-index:1 aqui é essencial: cria um CONTEXTO DE EMPILHAMENTO e prende os
   z-index internos do Leaflet (painéis vão até 800) dentro do mapa. Sem isso
   eles competem direto com a barra do topo, os chips e a legenda — que somem
   por baixo dos tiles. */
#mapa{position:absolute;inset:0;background:var(--bg3);z-index:1}
#folha{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg);padding:calc(env(safe-area-inset-top) + 58px) 16px
  calc(env(safe-area-inset-bottom) + 96px)}
/* histórico: a faixa do período flutua no topo — abre folga para não tapar o conteúdo */
#folha.comfaixa{padding-top:calc(env(safe-area-inset-top) + 104px)}

/* ---------- barra flutuante do topo ---------- */
.topo{position:absolute;left:0;right:0;top:0;z-index:30;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 0;
  display:flex;align-items:center;gap:8px;pointer-events:none}
.topo>*{pointer-events:auto}
.marca{font-size:14px;font-weight:800;background:var(--vidro);backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:20px;padding:7px 13px;white-space:nowrap}
.marca .l{color:var(--gold)}
.tag{font-size:11px;font-weight:700;padding:7px 12px;border-radius:20px;white-space:nowrap;
  backdrop-filter:blur(10px);margin-left:auto}
.tag.ok{background:rgba(5,46,34,.9);color:#3fe0b0} .tag.old{background:rgba(58,42,0,.9);color:var(--gold)}
.tag.err{background:rgba(58,15,15,.9);color:#ff8080} .tag.wait{background:var(--vidro);color:var(--muted)}

/* ---------- chips (período / variável) sobre o mapa ---------- */
.faixa{position:absolute;left:0;right:0;z-index:25;display:flex;gap:7px;
  overflow-x:auto;padding:0 12px;-webkit-overflow-scrolling:touch;pointer-events:none}
.faixa::-webkit-scrollbar{display:none}
.faixa>*{pointer-events:auto}
.faixa.p1{top:calc(env(safe-area-inset-top) + 56px)}
.chip.sel{font-weight:700}
/* gaveta: a lista só aparece ao tocar no seletor — antes as 5 variáveis e os
   4 períodos ficavam sempre na tela, comendo espaço do mapa */
.gaveta{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 100px);z-index:40;
  background:var(--vidro);backdrop-filter:blur(14px);border:1px solid var(--border2);
  border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:150px;
  box-shadow:0 10px 28px rgba(0,0,0,.5);animation:sobe .14s ease both}
.gaveta button{background:none;border:0;color:var(--text);text-align:left;
  padding:11px 14px;border-radius:10px;font:600 14px inherit;cursor:pointer;min-height:44px}
.gaveta button.on{background:var(--gold);color:#1a1100}
/* placa da máquina no mapa: rótulo à parte, que NÃO gira junto com o ícone */
.leaflet-tooltip.placa{background:rgba(13,43,8,.92);border:1px solid #4f9e3f;color:#e8edf5;
  font:600 11px/1 system-ui;letter-spacing:.05em;padding:3px 6px;border-radius:4px;box-shadow:none}
.leaflet-tooltip.placa::before{display:none}
/* PLACA DA MÁQUINA ACOMPANHA O ZOOM (03/10/2026). Máquina é ponto, não tem polígono
   onde "caber": de longe a placa só encolhe (nunca some — é ela que diz quem é a
   máquina). O desenho da telemetria já é refeito a cada zoom; a classe sai de telPlaca(). */
.leaflet-tooltip.placa.pm{font-size:9.5px;padding:2px 5px;letter-spacing:.03em}
.leaflet-tooltip.placa.pp{font-size:8px;padding:1px 4px;letter-spacing:0;border-radius:3px}
/* RÓTULO QUE CABE NO POLÍGONO (aba Safra). `.sfl` é o conteúdo do rótulo; o
   safAjustaRotulos() mede o polígono NA TELA e aplica `transform:scale()` para o
   texto nunca passar da área. Quando encolher demais deixaria ilegível, o rótulo
   perde partes: .n1 tira a 2ª linha (.p2), .n2 tira também o ícone (.pi), .n9 some. */
.sfl{display:inline-block;transform-origin:50% 50%;white-space:nowrap}
.sfl.quebra{white-space:normal}
.sfl.n1 .p2,.sfl.n2 .p2,.sfl.n2 .pi{display:none}
.sfl.n9{visibility:hidden}
/* tooltip "nu" para o nome do lote: a caixinha verde vai no conteúdo (.sflplaca),
   porque só o conteúdo pode ser escalado — o Leaflet usa o transform do tooltip */
.leaflet-tooltip.sfnu{background:none;border:0;box-shadow:none;padding:0}
.leaflet-tooltip.sfnu::before{display:none}
.sflplaca{background:rgba(13,43,8,.92);border:1px solid #4f9e3f;color:#e8edf5;
  font:600 11px/1 system-ui;letter-spacing:.05em;padding:3px 6px;border-radius:4px}
/* rótulo do croqui (Safra > Croquis): texto direto sobre a mancha de cor, duas
   linhas, sem caixa — a cor da banda já é o fundo; a sombra garante a leitura */
.leaflet-tooltip.crqplaca{background:none;border:0;box-shadow:none;padding:0;color:#fff;
  font:700 11px/1.25 system-ui;text-align:center;white-space:normal;width:132px;   /* nome completo quebra em 2 linhas; o Leaflet centraliza pela largura medida */
  text-shadow:0 0 3px #000,0 0 6px #000,0 1px 2px #000}
.leaflet-tooltip.crqplaca::before{display:none}
.leaflet-tooltip.crqplaca small{font-weight:600;font-size:10px;opacity:.9}
.chip{flex:none;background:var(--vidro);backdrop-filter:blur(10px);border:1px solid var(--border);
  color:var(--muted);border-radius:20px;padding:8px 14px;font:600 12px inherit;cursor:pointer;
  min-height:36px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1100}
.chip svg{width:15px;height:15px}
/* botão redondo só de ícone: os chips de texto já enchem a faixa num celular de
   375 px, e um terceiro com rótulo saía da tela. Redondo cabe sempre. */
.chip.ico{width:36px;padding:0;justify-content:center}
.chip.ico svg{width:20px;height:20px}
/* leitura da medição: uma PÍLULA, não uma gaveta. A gaveta é painel de escolha
   (ocupa a largura e empurra o mapa); aqui só se lê um número e se toca em
   desfazer/limpar. Fica logo abaixo dos chips, sobre o mapa. */
.medpill{position:absolute;z-index:26;left:12px;top:calc(env(safe-area-inset-top) + 102px);
  background:var(--vidro);backdrop-filter:blur(10px);border:1px solid var(--gold);
  color:var(--gold);border-radius:20px;padding:7px 8px 7px 13px;font:700 12.5px inherit;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;pointer-events:auto}
.medpill button{background:transparent;border:0;color:var(--gold);font:700 14px inherit;
  padding:0 5px;cursor:pointer;line-height:1}
.fraco{color:var(--muted);font-weight:600}   /* usado na pílula e na legenda enxuta */
/* timelapse: relógio + trilho fino. Mesma altura da pílula de medir, e ocupa a
   largura só do que precisa — o mapa continua sendo o assunto. */
.tlpill{position:absolute;z-index:26;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 102px);
  background:var(--vidro);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:20px;padding:8px 14px;display:flex;align-items:center;gap:10px;pointer-events:auto}
.tlpill b{font:800 13px inherit;font-variant-numeric:tabular-nums;min-width:38px}
/* trilho ARRASTÁVEL: 4 px de traço, mas 22 px de altura para o dedo pegar —
   mesma ideia do vértice do medir. `touch-action:none` é obrigatório, senão o
   navegador entende o gesto como rolagem da página e o arraste nunca chega. */
.tltrilho{flex:1;position:relative;height:22px;display:flex;align-items:center;
  touch-action:none;cursor:pointer}
.tltrilho::before{content:'';position:absolute;left:0;right:0;height:4px;border-radius:3px;
  background:rgba(255,255,255,.16)}
.tlfeito{position:absolute;left:0;height:4px;width:0;background:var(--gold);border-radius:3px}
.tlpega{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--gold);
  border:2px solid #1a1100;margin-left:-7px;box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none}
.tlpill button{background:transparent;border:0;color:var(--gold);font:800 12px inherit;
  padding:0 4px;cursor:pointer;line-height:1;white-space:nowrap}
/* o play/pause e o comando mais usado da barra: circulo cheio, um pouco maior */
.tlpill button.destaque{background:var(--gold);color:#1a1100;width:30px;height:30px;
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.tlpill button.destaque svg{width:16px;height:16px}

/* ---------- legenda do mapa ---------- */
/* legenda enxuta: uma linha só — valor + barra com marcador da posição */
.legenda{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 90px);
  z-index:25;background:var(--vidro);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:11px}
.legenda .vl{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.legenda .vl .u{font-size:10px;font-weight:500;color:var(--muted);margin-left:2px}
.legenda .esc{flex:1;position:relative}
.legenda .barra{height:7px;border-radius:4px}
.legenda .mk{position:absolute;top:-3px;width:3px;height:13px;border-radius:2px;
  background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.55)}
/* MODO ENXUTO (telemetria): a legenda do clima é um painel de leitura — valor
   grande e barra de escala. A da telemetria só precisa dizer de quem é a cor e
   quantos hectares. Com o painel cheio ela quebrava em 2–3 linhas e comia o
   mapa; aqui vira uma tira baixa, encostada à esquerda, do tamanho do texto. */
.legenda.mini{right:auto;max-width:calc(100% - 24px);padding:5px 11px;gap:9px;
  font-size:11.5px;line-height:1.3;flex-wrap:nowrap;overflow-x:auto}
.legenda.mini::-webkit-scrollbar{display:none}
.legenda.mini span{display:inline-flex;align-items:center;white-space:nowrap}
.legenda.mini i{width:14px;height:3.5px}
.legenda .mm{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:2px}

/* card da estação — sobe acima da legenda ao tocar o marcador */
.cartao{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 148px);
  z-index:26;background:var(--vidro);backdrop-filter:blur(14px);border:1px solid var(--border2);
  border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:sobe .16s ease both}
.cartao .ch{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:4px;
  border-bottom:1px solid var(--border)}
.cartao .ch b{font-size:15px}
.cartao .ch button{margin-left:auto;background:none;border:0;color:var(--muted);
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cartao .ch button svg{width:16px;height:16px}
.cartao .cl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0}
.cartao .cl span{font-size:12px;color:var(--muted)}
.cartao .cl b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- safra: linha do tempo + cartão do lote ---------- */
/* a pílula fica onde a faixa de chips fica nas outras seções (a Safra não tem
   chips). O trilho é um <input range> nativo: no celular é o que melhor pega o
   dedo, e `touch-action:none` impede o navegador de achar que é rolagem. */
.sfpill{position:absolute;z-index:26;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 56px);
  background:var(--vidro);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:20px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:10px;pointer-events:auto}
.sfpill input[type=range]{flex:1;min-width:0;accent-color:var(--gold);height:24px;touch-action:none}
.sfpill b{font:800 13px inherit;font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.sfpill button{background:var(--gold);color:#1a1100;border:0;width:30px;height:30px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;padding:0}
.sfpill button svg{width:16px;height:16px}
.cartao .sfcorpo{max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sfop{display:flex;gap:9px;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--border);color:var(--text);padding:8px 2px;cursor:pointer;font:inherit}
.sfop:last-child{border-bottom:0}
.sfop.on{background:rgba(255,193,7,.09);border-radius:8px}
.sfop .sfd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.sfop .sft{flex:1;min-width:0}
.sfop b{font-size:13.5px}
.sfop em{font-style:normal;color:var(--muted);font-size:12px;float:right;margin-left:8px}
.sfop small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.sfop .sfobs{color:var(--warn)}
/* pílula do resumo dos croquis (% do plantio e % do ciclo): fica logo abaixo do
   chip do croqui, é um botão que abre a tabela por cultura e regime */
.crqres{position:absolute;z-index:26;left:12px;top:calc(env(safe-area-inset-top) + 102px);
  max-width:calc(100% - 24px);background:var(--vidro);backdrop-filter:blur(10px);
  border:1px solid var(--border);color:var(--text);border-radius:20px;padding:7px 13px;
  font:600 12.5px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  pointer-events:auto;cursor:pointer}
.crqres b{color:var(--gold);font-weight:800}

/* ---------- botões flutuantes ---------- */
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:60;
  width:56px;height:56px;border-radius:50%;border:1px solid var(--border2);
  background:var(--vidro);backdrop-filter:blur(14px);color:var(--gold);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab.esq{left:18px} .fab.dir{right:18px}
.fab svg{width:26px;height:26px}
.fab.aberto{background:var(--gold);color:#1a1100;border-color:var(--gold)}

.menu{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:60;
  display:flex;flex-direction:column;gap:9px}
.menu.esq{left:18px;align-items:flex-start} .menu.dir{right:18px;align-items:flex-end}
.menu button{display:flex;align-items:center;gap:10px;background:var(--vidro);
  backdrop-filter:blur(14px);border:1px solid var(--border);color:var(--text);
  border-radius:26px;padding:10px 16px;font:600 14px inherit;cursor:pointer;min-height:48px;
  box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap;
  animation:sobe .16s ease both}
.menu.dir button{flex-direction:row-reverse}
.menu button.on{border-color:var(--gold);color:var(--gold)}
.menu button svg{width:22px;height:22px;flex:none}
.menu button small{font-size:11px;color:var(--muted2);font-weight:500}
@keyframes sobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.veu{position:fixed;inset:0;z-index:55;background:rgba(4,8,16,.5);backdrop-filter:blur(2px)}

/* ---------- conteúdo das folhas (Agora / Histórico) ---------- */
.sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
  font-weight:700;margin:22px 0 10px}
.sec:first-child{margin-top:0}
.hero{background:linear-gradient(160deg,var(--bg3),var(--bg2));border:1px solid var(--border);
  border-radius:20px;padding:20px}
.hero .t{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .t .u{font-size:20px;font-weight:600;color:var(--muted);margin-left:3px}
.hero .lin{display:flex;align-items:flex-start}
.hero .ic{margin-left:auto}
.hero .quem{font-size:13px;color:var(--muted);margin-top:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px}
.card.w{grid-column:1/-1}
.card .lb{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.card .vl{font-size:26px;font-weight:800;margin-top:6px;line-height:1.05;font-variant-numeric:tabular-nums}
.card .vl .u{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.card .ex{font-size:12px;color:var(--muted);margin-top:4px}
.seta{font-size:28px;line-height:1;vertical-align:-3px}
.item{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:14px;margin-bottom:9px;min-height:60px}
.item.off{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .nm{font-weight:600;font-size:14px}
.item .sb{font-size:12px;color:var(--muted);margin-top:2px}
.item .vr{margin-left:auto;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 6px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
th:first-child,td:first-child{text-align:left}
.vgbtn{background:var(--bg3);border:1px solid var(--border);border-radius:9px;color:var(--muted);
  font-size:12px;font-weight:600;padding:7px 12px;cursor:pointer}
.vgbtn:active{background:var(--bg4);color:var(--text)}
.vazio{text-align:center;color:var(--muted);padding:70px 24px}
.vazio svg{width:52px;height:52px;margin:0 auto 14px;opacity:.35}
.muted{color:var(--muted)}

/* ---------- login ---------- */
.login{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;
  justify-content:center;padding:28px 22px}
.login h1{font-size:25px;font-weight:800;margin-bottom:4px}
.login p{color:var(--muted);font-size:13px;margin-bottom:26px}
.login label{display:block;font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.login input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:14px;color:var(--text);font-size:16px;min-height:50px}
.login input:focus{outline:none;border-color:var(--gold)}

/* PILOTO PINTA A FAIXA (01/10/2026). Pedido do dono, depois de o TRA-001 passar a manhã
   trabalhando no Pivô 03 sem pintar: "faz pintar pelo piloto ... e apenas dentro da poligonal".

   1 leitura por minuto. Máquina que MANDA piloto: pinta com piloto engatado, andando e dentro do
   lote. Máquina sem piloto no CAN: continua a regra de velocidade (1 a 8 km/h) dentro do lote.
   Busca SÓ as leituras engatadas (leve no celular) + 1 linha para saber se a máquina manda
   piloto. PAGINADO: o select do Supabase para em 1.000 linhas sem avisar, e um dia tem 1.440. */
async function carregarPilotos(dev, desdeMs){
  const iso=new Date(desdeMs).toISOString();      // instante absoluto: aqui o UTC é o certo
  const c=await SB.from('telemetria_motor').select('medido_em').eq('device_id',dev)
    .not('piloto','is',null).gte('medido_em',iso).limit(1);
  if(c.error) throw c.error;
  const tem=!!(c.data&&c.data.length), ts=[];
  if(tem) for(let de=0;;de+=1000){
    const {data,error}=await SB.from('telemetria_motor').select('medido_em').eq('device_id',dev)
      .eq('piloto',true).gte('medido_em',iso).order('medido_em').range(de,de+999);
    if(error) throw error;
    (data||[]).forEach(r=>ts.push(Date.parse(r.medido_em)));
    if(!data || data.length<1000) break;
  }
  return {tem, ts};
}
/* engatado no instante t = há leitura "piloto engatado" a até 60 s (a caixa manda 1 por minuto) */
function pilotoPerto(p, t){
  const ts=p.ts; let lo=0, hi=ts.length;
  while(lo<hi){ const m=(lo+hi)>>1; if(ts[m]<t) lo=m+1; else hi=m; }
  return (lo<ts.length && ts[lo]-t<=60000) || (lo>0 && t-ts[lo-1]<=60000);
}
/* RECORTE DA FAIXA NA POLIGONAL (01/10/2026). Dono, com a faixa do TRA-001 já pintando pelo
   piloto: "está pintando fora da poligonal". Testar só o MEIO do trecho deixava passar, no Pivô 03
   em 01/10, 35 trechos com uma ponta fora do lote e 59 com a faixa de 18 m vazando a divisa.
   Agora a faixa de cada trecho é RECORTADA pelo anel do lote (Sutherland–Hodgman): o quadrilátero
   da faixa (convexo) é o recorte, o anel (pode ser côncavo) é o sujeito, e sobra só o pedaço de
   DENTRO. Em graus mesmo: recorte é afim, não precisa projetar. Faixa inteira dentro (o caso comum)
   volta o próprio quadrilátero, sem custo. */
function _dentroAnel(anel, lat, lon){
  let d=false;
  for(let i=0,j=anel.length-1;i<anel.length;j=i++){
    if((anel[i][0]>lat)!==(anel[j][0]>lat) &&
       lon < (anel[j][1]-anel[i][1])*(lat-anel[i][0])/((anel[j][0]-anel[i][0])||1e-12)+anel[i][1]) d=!d;
  }
  return d;
}
function recortaFaixa(anel, quad){
  if(quad.every(p=>_dentroAnel(anel,p[0],p[1]))) return quad;     // inteira dentro
  let a2=0; for(let i=0;i<4;i++){ const p=quad[i], q=quad[(i+1)%4]; a2+=p[1]*q[0]-q[1]*p[0]; }
  const sg=a2>=0?1:-1;                                              // lado de dentro do quad
  let out=anel;
  for(let i=0;i<4 && out.length;i++){
    const A=quad[i], B=quad[(i+1)%4], inp=out;
    const lado=P=>sg*((B[1]-A[1])*(P[0]-A[0])-(B[0]-A[0])*(P[1]-A[1]));
    const cruza=(S,E,ls,le)=>{ const t=ls/(ls-le); return [S[0]+t*(E[0]-S[0]), S[1]+t*(E[1]-S[1])]; };
    out=[];
    for(let k=0;k<inp.length;k++){
      const E=inp[k], S=inp[(k+inp.length-1)%inp.length], le=lado(E), ls=lado(S);
      if(le>=0){ if(ls<0) out.push(cruza(S,E,ls,le)); out.push(E); }
      else if(ls>=0) out.push(cruza(S,E,ls,le));
    }
  }
  return out.length>=3 ? out : null;
}
/* área em m² de um polígono [lat,lon] (planta local) — os hectares da legenda saem do recortado */
function areaM2(poly){
  const la0=poly[0][0], kx=111320*Math.cos(la0*Math.PI/180), ky=111320; let s=0;
  for(let i=0;i<poly.length;i++){ const p=poly[i], q=poly[(i+1)%poly.length]; s+=(p[1]*kx)*(q[0]*ky)-(q[1]*kx)*(p[0]*ky); }
  return Math.abs(s)/2;
}
/* larg (m) é opcional: com ela, trecho cuja faixa CRUZA a divisa sai da linha grossa e vai para
   out.bordas como polígono recortado {poly, t}. Sem ela (contagem/legado), só o teste do meio. */
function soTrabalho(linhas, pil, larg){
  const out=[]; out.bordas=[]; let atual=[];
  linhas.forEach(ln=>{
    for(let i=1;i<ln.length;i++){
      const a=ln[i-1], b=ln[i], va=+a[2]||0, vb=+b[2]||0;
      /* 01/10/2026: com piloto, pelo piloto; sem piloto, pela velocidade. Sempre DENTRO da poligonal. */
      const ritmo = (pil && pil.tem) ? (vb>1 && pilotoPerto(pil, ((+a[3]||0)+(+b[3]||0))/2))
                                     : (va>1 && va<=8 && vb>1 && vb<=8);
      const lt = ritmo ? loteMob((a[0]+b[0])/2,(a[1]+b[1])/2) : null;
      let trab = !!lt;
      if(trab && larg){
        const dx=(b[1]-a[1])*111320*Math.cos(a[0]*Math.PI/180), dy=(b[0]-a[0])*111320, D=Math.hypot(dx,dy);
        if(D){
          const px=-dy/D, py=dx/D, h=larg/2;
          const g=(o,q)=>[q[0]+py*o/111320, q[1]+px*o/(111320*Math.cos(q[0]*Math.PI/180))];
          const quad=[g(h,a),g(h,b),g(-h,b),g(-h,a)];
          if(!quad.every(q=>_dentroAnel(lt.ring,q[0],q[1]))){       // cruza a divisa
            const poly=recortaFaixa(lt.ring, quad);
            if(poly) out.bordas.push({poly, t:+b[3]||0});
            trab=false;                                              // não entra na linha grossa
          }
        }
      }
      if(trab){ if(!atual.length) atual.push(a); atual.push(b); }
      else if(atual.length>1){ out.push(atual); atual=[]; } else atual=[];
    }
    if(atual.length>1) out.push(atual); atual=[];
  });
  return out;
}

  var cx=VB_W/2, Y0=VB_H/2-28.5, y=function(m){return Y0+m*10;};   // centro a 2,85 m da frente
  var VM = desligada ? '#6b7280' : '#c8102e', VE = desligada ? '#3b4048' : '#3a0a0e';
  var PR = desligada ? '#3a3f45' : '#1c1c1c', TB = desligada ? '#c9ced4' : '#efefea', TE = desligada ? '#7b828b' : '#9a9a94';
  var s='';
  function r(a){ s+='<rect '+a+'/>'; }
  function pneu(xc, ym, D, L){
    r('fill="#1b1b1b" stroke="#000" stroke-width="1" x="'+(cx+xc-L/2)+'" y="'+(y(ym)-D/2)+'" width="'+L+'" height="'+D+'" rx="2.5"');
    for(var k=1;k<5;k++) s+='<line x1="'+(cx+xc-L/2+1)+'" x2="'+(cx+xc+L/2-1)+'" y1="'+(y(ym)-D/2+k*D/5)+'" y2="'+(y(ym)-D/2+k*D/5)+'" stroke="#3a3a3a" stroke-width="1"/>'; }
  var eF=1.35, eT=eF+3.09;
  [-9.5,9.5].forEach(function(xc){ pneu(xc, eF, 15.5, 4.7); });      // frente: 18.4-26 simples
  [-11.5,11.5].forEach(function(xc){ pneu(xc, eT, 18.2, 7.8); });    // tras: 30.5-32 BALAO simples

  r('fill="'+PR+'" stroke="#000" stroke-width="1" x="'+(cx-6)+'" y="'+y(0)+'" width="12" height="4.5" rx="1.2"');
  // CAPO vermelho arredondado
  s+='<path fill="'+VM+'" stroke="'+VE+'" stroke-width="1.4" d="M'+(cx-4.8)+','+y(0.4)+' Q'+cx+','+(y(0.4)-1.5)+' '+(cx+4.8)+','+y(0.4)+' L'+(cx+5.8)+','+y(1.1)+' L'+(cx+5.8)+','+y(2.75)+' L'+(cx-5.8)+','+y(2.75)+' L'+(cx-5.8)+','+y(1.1)+' Z"/>';
  // PARA-LAMAS traseiros (cobrem o meio da roda) + corpo atras da cabine ate o engate
  [-1,1].forEach(function(l){ r('fill="'+VM+'" stroke="'+VE+'" stroke-width="1.1" x="'+(cx+l*11.5-4.6)+'" y="'+y(eT-0.55)+'" width="9.2" height="11" rx="3"'); });
  r('fill="'+VM+'" stroke="'+VE+'" stroke-width="1.1" x="'+(cx-4.5)+'" y="'+y(4.65)+'" width="9" height="'+((5.60-4.65)*10)+'" rx="2"');
  // CABINE com TETO BRANCO e vidro escuro na frente
  r('fill="'+TB+'" stroke="'+TE+'" stroke-width="1.3" x="'+(cx-9.5)+'" y="'+y(2.75)+'" width="19" height="19" rx="3"');
  r('fill="#111" opacity=".75" x="'+(cx-7.5)+'" y="'+y(3.1)+'" width="15" height="7.5" rx="2"');
  // ESCAPAMENTO alto: lado direito, na frente da cabine
  s+='<circle cx="'+(cx+5.0)+'" cy="'+y(2.55)+'" r="1.6" fill="#2a2a2a" stroke="#000" stroke-width=".6"/>';
  // engate
  s+='<circle cx="'+cx+'" cy="'+(y(5.60)+1)+'" r="2" fill="#2a2a2a" stroke="#000" stroke-width=".8"/>';
  return s;
}

/* MASSEY FERGUSON 296 (TRA-018; 1994) — trator RIGIDO 4x4, VERMELHO, plataformado com TOLDO.
   APROVADO pelo dono em 01/10/2026 ("ok"), com a concha frontal. Mesma escala e referencia dos outros (10 unidades = 1 m, frente para cima).
   Ficha: motor Perkins A6.354-4 de 6 cilindros, ~115 cv, ~4,6 t sem lastro (blog Ciencia e

   que e menor. CONFERIR COM TRENA. Pneus 4x4: 14.9-24 na frente (~1,26 x 0,38 m) e 18.4-30 atras
   (~1,55 x 0,47 m).
   Pelas fotos (videos de 296 no Brasil): plataformado com ARCO e TOLDO; capo vermelho QUADRADO com
   GRADE PRETA grande na frente; ESCAPAMENTO alto do lado DIREITO e PRE-FILTRO de ar (o "copo") do lado
   ESQUERDO, ambos sobre o capo; BLOCO DE PESOS vermelho na frente; para-lamas grandes atras.
   CONCHA HIDRAULICA FRONTAL: o TRA-018 e EQUIPADO com ela (dono, 01/10/2026: "o 296 e equipado com
   kit de concha hidraulica frontal") — IMP-054, Tatu Marchesan PCA 1100. Ficha Marchesan: concha de
   2,15 m de largura, 0,8 m3, 1.700 kg (existe a de 1,90 m). Pelas fotos (PCA 1100 num MF 299):
   2 TORRES no meio do trator, 2 BRACOS vermelhos pelos lados do capo, CILINDROS ao lado, TRAVESSA na
   frente e a CONCHA na ponta, mais larga que o trator. Desenhada BAIXADA (posicao de trabalho).
   ESTIMADO: concha de 0,85 m de fundo, de 1,20 a 0,35 m a frente do trator; bracos a 0,55 m do
   meio; torres a 2,15 m da frente.
   O centro do icone fica na FRENTE DO TOLDO (onde iria a antena da caixa de telemetria). Sem GPS.
   ESTIMADO (conferir): pesos 0,30 m; eixo dianteiro a 1,05 m da frente; toldo de 2,40 a 3,90 m;
   centro do icone a 2,50 m da frente; rodas traseiras a 0,85 m do meio, dianteiras a 0,75 m;
   engate a 4,25 m. */
/* Gerador da previa aprovada: docs/icones_telemetria/gerar_previa_mf296.mjs */
function svgMf296(desligada){
  var cx=VB_W/2, Y0=VB_H/2-25.0, y=function(m){return Y0+m*10;};   // centro a 2,50 m da frente

  var s='';

  function pneu(xc, ym, D, L){
    r('fill="#1b1b1b" stroke="#000" stroke-width="1" x="'+(cx+xc-L/2)+'" y="'+(y(ym)-D/2)+'" width="'+L+'" height="'+D+'" rx="2"');
    for(var k=1;k<5;k++) s+='<line x1="'+(cx+xc-L/2+1)+'" x2="'+(cx+xc+L/2-1)+'" y1="'+(y(ym)-D/2+k*D/5)+'" y2="'+(y(ym)-D/2+k*D/5)+'" stroke="#3a3a3a" stroke-width="1"/>'; }

  [-7.5,7.5].forEach(function(xc){ pneu(xc, eF, 12.6, 3.8); });     // frente: 14.9-24 simples
  [-8.5,8.5].forEach(function(xc){ pneu(xc, eT, 15.5, 4.7); });     // tras: 18.4-30 simples
  // BLOCO DE PESOS vermelho na frente
  r('fill="'+VM+'" stroke="'+VE+'" stroke-width="1" x="'+(cx-4.8)+'" y="'+y(0)+'" width="9.6" height="3.2" rx="1"');

  [-1,1].forEach(function(l){ r('fill="'+VM+'" stroke="'+VE+'" stroke-width="1.1" x="'+(cx+l*8.5-3.0)+'" y="'+y(eT-0.5)+'" width="6.0" height="10" rx="2.5"'); });
  r('fill="'+PR+'" x="'+(cx-5.3)+'" y="'+y(2.4)+'" width="10.6" height="'+((eT+0.55-2.4)*10)+'" rx="1.5"');
  r('fill="'+VM+'" stroke="'+VE+'" stroke-width="1" x="'+(cx-3)+'" y="'+y(eT+0.55)+'" width="6" height="'+((4.25-eT-0.55)*10)+'" rx="1.2"');
  // TOLDO sobre o banco (arco de protecao)
  r('fill="'+TL+'" stroke="'+TE+'" stroke-width="1.2" x="'+(cx-7.5)+'" y="'+y(2.4)+'" width="15" height="15" rx="2"');
  s+='<line x1="'+(cx-6.5)+'" x2="'+(cx+6.5)+'" y1="'+y(3.15)+'" y2="'+y(3.15)+'" stroke="'+TE+'" stroke-width=".6"/>';
  // engate
  s+='<circle cx="'+cx+'" cy="'+(y(4.25)+1)+'" r="1.8" fill="#2a2a2a" stroke="#000" stroke-width=".8"/>';
  // CONCHA HIDRAULICA FRONTAL (Tatu PCA 1100, IMP-054) — por cima do trator, como e de verdade
  var CO = desligada ? '#7b828b' : '#b5121b', CE = desligada ? '#3b4048' : '#3a0a0e';
  [-1,1].forEach(function(l){
    var xb=cx+l*5.5;
    // torre presa no chassi
    r('fill="'+CO+'" stroke="'+CE+'" stroke-width=".8" x="'+(xb-1.4)+'" y="'+(y(2.15)-1.2)+'" width="2.8" height="2.4" rx=".5"');
    // cilindro hidraulico (por fora do braco)
    s+='<line x1="'+(xb+l*1.4)+'" y1="'+y(1.9)+'" x2="'+(xb+l*1.2)+'" y2="'+y(-0.1)+'" stroke="#2a2a2a" stroke-width="1.1" stroke-linecap="round"/>';
    // braco
    s+='<line x1="'+xb+'" y1="'+y(2.15)+'" x2="'+xb+'" y2="'+y(-0.35)+'" stroke="'+CE+'" stroke-width="2.4" stroke-linecap="round"/>';
    s+='<line x1="'+xb+'" y1="'+y(2.15)+'" x2="'+xb+'" y2="'+y(-0.35)+'" stroke="'+CO+'" stroke-width="1.5" stroke-linecap="round"/>';
  });
  // travessa ligando os bracos na frente
  s+='<line x1="'+(cx-5.5)+'" y1="'+y(-0.05)+'" x2="'+(cx+5.5)+'" y2="'+y(-0.05)+'" stroke="'+CO+'" stroke-width="1.2"/>';
  // concha de 2,15 m: borda + o "vao" escuro por dentro
  r('fill="'+CO+'" stroke="'+CE+'" stroke-width="1.2" x="'+(cx-10.75)+'" y="'+y(-1.2)+'" width="21.5" height="8.5" rx="1"');
  r('fill="'+(desligada?'#4b5057':'#2a1517')+'" x="'+(cx-9.9)+'" y="'+(y(-1.2)+1)+'" width="19.8" height="6.0" rx=".6"');
  s+='<line x1="'+(cx-10.75)+'" y1="'+y(-1.2)+'" x2="'+(cx+10.75)+'" y2="'+y(-1.2)+'" stroke="#9aa0a6" stroke-width=".8"/>';  // lamina
  return s;
}

/* VALMET 86 (ID) (TRA-019) — trator RIGIDO 4x2, AMARELO, plataformado com TOLDO. APROVADO pelo dono em 01/10/2026 ("ok").
   Mesma escala e referencia dos outros (10 unidades = 1 m, frente para cima).
   O que se sabe: anuncio de um 86 ID de 1980 (Agrofinder): AMARELO, 4x2, SEM CABINE, 86 cv; Lexicar:
   linha 80 com motor MWM de 4 cilindros. NAO ACHEI A FICHA DE DIMENSOES DO 86. Medidas do VALMET 865,
   o mais parecido: ENTRE-EIXOS 2,39 m, comprimento 4,04 m — ESTIMATIVA, conferir com trena.
   Pelas fotos (videos de Valmet 86 ID no Brasil): tudo amarelo, GRADE AMARELA de frisos verticais;
   4x2: rodas da FRENTE PEQUENAS E ESTREITAS (~7.50-18, ~0,85 x 0,19 m) e as de tras grandes
   (~18.4-30, ~1,55 x 0,47 m); escapamento e filtro de ar sobre o capo; na maioria, ARCO COM TOLDO
   (alguns sem toldo ou com lamina na frente).
   O centro do icone fica na FRENTE DO TOLDO (onde iria a antena da caixa de telemetria). Sem GPS.
   ESTIMADO (conferir): para-choque 0,25 m; eixo dianteiro a 0,85 m da frente; toldo de 2,25 a 3,75 m;
   centro a 2,35 m da frente; rodas traseiras a 0,85 m do meio, dianteiras a 0,75 m; engate a 4,02 m. */
/* Gerador da previa aprovada: docs/icones_telemetria/gerar_previa_valmet86.mjs */
function svgValmet86(desligada){
  var cx=VB_W/2, Y0=VB_H/2-23.5, y=function(m){return Y0+m*10;};   // centro a 2,35 m da frente
  var AM = desligada ? '#8a9098' : '#f2b705', AE = desligada ? '#3b4048' : '#5c4300';

  var s='';

  function pneu(xc, ym, D, L){
    r('fill="#1b1b1b" stroke="#000" stroke-width="1" x="'+(cx+xc-L/2)+'" y="'+(y(ym)-D/2)+'" width="'+L+'" height="'+D+'" rx="'+Math.min(2,L/2)+'"');
    for(var k=1;k<5;k++) s+='<line x1="'+(cx+xc-L/2+.6)+'" x2="'+(cx+xc+L/2-.6)+'" y1="'+(y(ym)-D/2+k*D/5)+'" y2="'+(y(ym)-D/2+k*D/5)+'" stroke="#3a3a3a" stroke-width=".8"/>'; }
  var eF=0.85, eT=eF+2.39;

  r('fill="'+PR+'" x="'+(cx-7.5)+'" y="'+(y(eF)-.7)+'" width="15" height="1.4" rx=".5"');
  [-7.5,7.5].forEach(function(xc){ pneu(xc, eF, 8.5, 1.9); });      // frente: ~7.50-18, estreita
  [-8.5,8.5].forEach(function(xc){ pneu(xc, eT, 15.5, 4.7); });     // tras: ~18.4-30
  // PARA-CHOQUE na frente
  r('fill="'+PR+'" stroke="#000" stroke-width=".8" x="'+(cx-4.2)+'" y="'+y(0)+'" width="8.4" height="2.6" rx=".8"');
  // CAPO amarelo estreito, com a GRADE AMARELA de frisos verticais na ponta

  s+='<circle cx="'+(cx-2.3)+'" cy="'+y(1.6)+'" r="1.3" fill="'+PR+'" stroke="#000" stroke-width=".5"/>';
  s+='<circle cx="'+(cx+2.3)+'" cy="'+y(1.85)+'" r="1.2" fill="#2a2a2a" stroke="#000" stroke-width=".6"/>';
  // PARA-LAMAS amarelos sobre as rodas traseiras (cobrem o meio) + plataforma do operador
  [-1,1].forEach(function(l){ r('fill="'+AM+'" stroke="'+AE+'" stroke-width="1" x="'+(cx+l*8.5-3.0)+'" y="'+y(eT-0.5)+'" width="6.0" height="10" rx="2.5"'); });
  r('fill="'+PR+'" x="'+(cx-5)+'" y="'+y(2.25)+'" width="10" height="'+((eT+0.5-2.25)*10)+'" rx="1.5"');
  r('fill="'+AM+'" stroke="'+AE+'" stroke-width="1" x="'+(cx-2.8)+'" y="'+y(eT+0.5)+'" width="5.6" height="'+((4.02-eT-0.5)*10)+'" rx="1.2"');
  // TOLDO sobre o banco (arco de protecao)
  r('fill="'+TL+'" stroke="'+TE+'" stroke-width="1.2" x="'+(cx-7)+'" y="'+y(2.25)+'" width="14" height="15" rx="2"');
  s+='<line x1="'+(cx-6)+'" x2="'+(cx+6)+'" y1="'+y(3.0)+'" y2="'+y(3.0)+'" stroke="'+TE+'" stroke-width=".6"/>';
  // engate
  s+='<circle cx="'+cx+'" cy="'+(y(4.02)+1)+'" r="1.7" fill="#2a2a2a" stroke="#000" stroke-width=".8"/>';
  return s;
}

/* COLHEDORA DE GRAOS JOHN DEERE 9770 STS (COL-001) / 9670 STS (COL-002) — VERDE. APROVADO pelo dono em 01/10/2026 ("ok").
   Mesma escala e referencia dos outros (10 unidades = 1 m, frente para cima, centro do icone na
   frente do teto da cabine).
   OFICIAL (manual do operador Deere OMHXE13769, 9670/9770 STS): BITOLA TRASEIRA 3,3 m; 14,8 t sem
   plataforma; graneleiro 8.850-10.570 L. TUBO DE DESCARGA 6,55 m (Construction Equipment Guide e
   Ritchie Specs). Plataformas do cadastro: 635F de 35 pes (IMP-044, 10,67 m) e 630F de 30 pes
   (IMP-045, 9,14 m). Pneus usuais: 520/85R38 DUPLO na frente (~1,85 x 0,52 m) e 28L-26 atras
   (~1,60 x 0,71 m).
   SEM ficha confiavel de comprimento e entre-eixos (so agregadores: 3,2 m e 10,5 m). ESTIMADO pelas
   fotos: plataforma de 1,9 m de fundo; canal alimentador 1,45 m de largura; eixo dianteiro a 3,7 m da
   frente da plataforma; ENTRE-EIXOS 3,6 m; cabine de 3,0 a 5,0 m (2,1 m de largura); graneleiro de

   frente, simples atras, aros amarelos; plataforma verde com o MOLINETE.
   ANTENA: StarFire (dono, 01/10/2026), no centro da frente do teto da cabine = centro do icone. larguraPlat em metros: a 9770 usa a 635F (10,67 m = 35 pes) e a 9670
   a 630F (9,14 m = 30 pes) — dono, 01/10/2026. */
/* Gerador da previa aprovada: docs/icones_telemetria/gerar_previa_colhedora_sts.mjs */
function svgColhedoraSts(desligada, larguraPlat){
  var cx=VB_W/2, Y0=VB_H/2-32, y=function(m){return Y0+m*10;};   // centro a 3,2 m da frente da plataforma

  var meia=(larguraPlat||10.67)*10/2, s='';

  function pneu(xc, ym, D, L){
    r('fill="#1b1b1b" stroke="#000" stroke-width="1" x="'+(cx+xc-L/2)+'" y="'+(y(ym)-D/2)+'" width="'+L+'" height="'+D+'" rx="2.5"');
    for(var k=1;k<5;k++) s+='<line x1="'+(cx+xc-L/2+1)+'" x2="'+(cx+xc+L/2-1)+'" y1="'+(y(ym)-D/2+k*D/5)+'" y2="'+(y(ym)-D/2+k*D/5)+'" stroke="#3a3a3a" stroke-width="1"/>'; }
  var eF=3.7, eT=eF+3.6;

/* `ativo` = o modo timelapse está aberto (barra na tela, rastro cortado em TL.t)
   `tocando` = está correndo. São coisas diferentes: PAUSAR mantém a barra e a
   posição; FECHAR (✕) é que volta a mostrar o rastro inteiro. Antes havia só um
   estado, e por isso o botão "pausava" sumindo com tudo — o dono pegou. */
let TL={ativo:false, tocando:false, t:null, t0:0, t1:0, timer:null, vel:1};
const TLVELS=[1,2,4,8,16];   // 7 dias a 1× seriam minutos: os degraus altos existem para isso
function tlJanela(){
  let a=Infinity,b=-Infinity;
  Object.keys(TRAILS).forEach(dev=>{
    const tr=TRAILS[dev]; if(!maqVisivel(tr.maquina_id)) return;
    tr.linhas.forEach(ln=>ln.forEach(p=>{ const t=+p[3]||0; if(t>0){ if(t<a)a=t; if(t>b)b=t; } }));
  });
  TL.t0=isFinite(a)?a:0; TL.t1=isFinite(b)?b:0;
  return TL.t1>TL.t0;
}
function tlHora(t){ const d=new Date(t), p=n=>String(n).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes()); }
/* só para o relógio; NÃO fecha o modo — é isso que separa pausar de sair */
function tlParar(){ if(TL.timer){ clearInterval(TL.timer); TL.timer=null; } TL.tocando=false; }
function tlFechar(){ tlParar(); TL.ativo=false; TL.t=null; desenhaTelemetria(); pinta(); }
function tlTick(){
  tlParar(); TL.tocando=true;
  /* o dia inteiro em ~14 s no 1×: rápido para ver o padrão de trabalho, lento
     para acompanhar a máquina virando na cabeceira. A velocidade multiplica o
     PASSO, não a taxa de quadros — subir a taxa só gastaria bateria. */
  /* ⏱ VELOCIDADE ABSOLUTA, não relativa ao período. Antes o passo era uma fração
     da janela (1/200), então 7 dias corriam no mesmo tempo de tela que 1 dia —
     ou seja, 7× mais rápido, e já começavam acelerados. O dono pegou: "quando
     seleciona 7 dias ele já começa acelerado; tem que começar normal".
     Agora 1× = UMA HORA DE RASTRO POR SEGUNDO, sempre. Um dia de ~10 h leva
     ~10 s; 7 dias levam o que têm de levar — e para isso existe o acelerador. */
  const passo=3600000*TL.vel*(70/1000);
  TL.timer=setInterval(()=>{
    TL.t+=passo;
    if(TL.t>=TL.t1){ TL.t=TL.t1; desenhaTelemetria(); tlBarra(); tlParar(); pinta(); return; }
    desenhaTelemetria(); tlBarra();
  },70);   // 70 ms poupa o celular sem picotar
}
/* BOTÃO DA FAIXA = liga/desliga a FERRAMENTA, igual ao esquadro do medir: fica
   amarelo enquanto está ativa, clica de novo e desativa. O dono pediu esse
   padrão — antes esse botão era play/pause e o sair era um ✕ solto na barra,
   que ficou estranho justamente por fugir do padrão das outras ferramentas. */
function tlFerramenta(){
  if(TL.ativo){ tlFechar(); return; }
  if(!tlJanela()) return;                          // sem rastro com hora não há o que percorrer
  TL.ativo=true; TL.t=TL.t0; tlTick(); pinta();
}
/* PLAY/PAUSE mora DENTRO da barra, onde antes ficava o ✕ — é o comando que se
   usa o tempo todo, então fica junto do relógio e do trilho. */
function tlPlayPause(){
  if(!TL.ativo) return;
  if(TL.tocando){ tlParar(); pinta(); return; }    // pausa mantém barra e posição
  if(TL.t==null || TL.t>=TL.t1) TL.t=TL.t0;        // no fim, tocar de novo reinicia
  tlTick(); pinta();
}
/* troca só o ícone do play/pause, sem repintar a tela — usado no arraste, onde
   repintar destruiria o trilho debaixo do dedo (ver tlLigarArraste) */
function tlIconePlay(){ const b=el('tlpp'); if(b) b.innerHTML=TL.tocando?IC.pausa:IC.play; }
function tlVelocidade(){
  TL.vel=TLVELS[(TLVELS.indexOf(TL.vel)+1)%TLVELS.length];
  if(TL.tocando) tlTick();                         // reinicia o relógio no passo novo
  pinta();
}
/* ARRASTAR A BARRA: o dedo manda mais que o relógio, então tocar no trilho
   PAUSA e leva para o instante escolhido. Ficar tocando enquanto se arrasta
   faria o quadro fugir do dedo. */
function tlIrPara(fracao){
  if(!TL.ativo) return;
  const f=Math.max(0,Math.min(1,fracao));
  TL.t=TL.t0+f*(TL.t1-TL.t0);
  desenhaTelemetria(); tlBarra();
}
function tlLigarArraste(){
  const trilho=el('tltrilho'); if(!trilho) return;
  const frac=ev=>{ const r=trilho.getBoundingClientRect();
    const x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left; return r.width?x/r.width:0; };
  let arrastando=false;
  /* ⛔ NÃO CHAMAR `pinta()` AQUI. Era o bug do "puxa e ele zera": repintar troca
     o elemento do trilho, o `trilho` desta closure vira um nó solto do DOM, o
     `getBoundingClientRect()` dele devolve tudo zero — e a fração dá 0, ou seja,
     salta para o começo. Pausar aqui é só parar o relógio e trocar o ícone do
     botão na mão; a tela se acerta quando o dedo sair. */
  const inicio=ev=>{ arrastando=true;
                     if(TL.tocando){ tlParar(); tlIconePlay(); }
                     tlIrPara(frac(ev)); ev.preventDefault(); };
  const move=ev=>{ if(!arrastando) return; tlIrPara(frac(ev)); ev.preventDefault(); };
  const fim=()=>{ arrastando=false; };
  trilho.addEventListener('pointerdown',inicio);
  trilho.addEventListener('pointermove',move);
  window.addEventListener('pointerup',fim,{once:true});
  trilho.addEventListener('touchstart',inicio,{passive:false});
  trilho.addEventListener('touchmove',move,{passive:false});
  trilho.addEventListener('touchend',fim);
}
/* corta as linhas em TL.t. O índice 3 é a HORA DO GPS (`tempo_gps`), não a de
   chegada — o próprio flow do Node-RED grava assim e explica por quê: pacote que
   ficou na fila do rádio drena depois, fora de ordem, e a hora de chegada
   embaralharia o rastro. O atraso entre as duas fica guardado à parte. */
function tlCortar(linhas){
  if(TL.t==null) return linhas;
  const out=[];
  linhas.forEach(ln=>{ const s=[]; for(const p of ln){ if((+p[3]||0)>TL.t) break; s.push(p); }
                       if(s.length>1) out.push(s); });
  return out;
}
/* onde a máquina estava no instante TL.t — o ícone acompanha o timelapse em vez
   de ficar parado na última posição conhecida */
function tlPosicao(tr){
  let ult=null;
  tr.linhas.forEach(ln=>ln.forEach(p=>{ if((+p[3]||0)<=TL.t && (!ult || (+p[3]||0)>=(+ult[3]||0))) ult=p; }));
  return ult;
}
function tlBarra(){
  const b=el('tlbar'), h=el('tlhora'), pg=el('tlpega');
  const f=(TL.t==null||TL.t1<=TL.t0)?1:Math.max(0,Math.min(1,(TL.t-TL.t0)/(TL.t1-TL.t0)));
  if(b) b.style.width=(f*100)+'%';
  if(pg) pg.style.left=(f*100)+'%';
  if(h) h.textContent=TL.t==null?'':tlHora(TL.t);
}
function medMetros(pts){
  /* GUARDA DE LISTA VAZIA — sem ela, `pts[0][0]` estoura. E estourava no pior
     momento: ao LIGAR a medição, quando `MED.pts` acabou de ser zerado. O erro
     subia pelo medDesenhar e matava o `pinta()` que vinha logo depois, então a
     classe 'on' nunca era aplicada e o botão ficava cinza — parecia bug de CSS,
     era exceção silenciosa. Depois do 1º toque já havia ponto e tudo funcionava,
     que foi o que confundiu: "mede certo, só a cor não muda". */
  if(!pts||!pts.length) return [];
  const lat0=pts[0][0]*Math.PI/180, mLat=111320, mLon=111320*Math.cos(lat0);
  return pts.map(p=>[(p[1]-pts[0][1])*mLon, (p[0]-pts[0][0])*mLat]);
}
function medArea(pts){
  if(pts.length<3) return 0;
  const q=medMetros(pts); let s=0;
  for(let i=0,j=q.length-1;i<q.length;j=i++) s+=(q[j][0]*q[i][1]-q[i][0]*q[j][1]);
  return Math.abs(s/2)/10000;   // ha
}
function medDist(pts){
  const q=medMetros(pts); let d=0;
  for(let i=1;i<q.length;i++) d+=Math.hypot(q[i][0]-q[i-1][0], q[i][1]-q[i-1][1]);
  return d;   // metros
}
/* ALVO DO DEDO: o ponto visível tem 13 px, mas a área de toque tem 30. Num
   celular, pegar um círculo de 6 px é sorte — e arrastar, impossível. O
   `divIcon` transparente de 30 px resolve sem engordar o desenho. */
function medIcone(){ return L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],
  html:'<div style="width:30px;height:30px;display:flex;align-items:center;justify-content:center">'
      +'<div style="width:13px;height:13px;border-radius:50%;background:#f0b400;border:2px solid #1a1100;box-shadow:0 1px 3px rgba(0,0,0,.5)"></div></div>'}); }
/* só a FORMA (polígono/linha) + a leitura — usado durante o arraste, quando
   recriar os marcadores mataria o gesto no meio */
function medForma(){
  if(MED.shape){ try{ _map.removeLayer(MED.shape); }catch(e){} MED.shape=null; }
  const p=MED.pts;
  if(p.length>2) MED.shape=L.polygon(p,{color:'#f0b400',weight:2,fillOpacity:.18,dashArray:'5,4'}).addTo(_map);
  else if(p.length>1) MED.shape=L.polyline(p,{color:'#f0b400',weight:3,dashArray:'5,4'}).addTo(_map);
  medLeitura();
}
function medDesenhar(){
  if(MED.layer){ try{ _map.removeLayer(MED.layer); }catch(e){} MED.layer=null; }
  if(MED.shape){ try{ _map.removeLayer(MED.shape); }catch(e){} MED.shape=null; }
  const cx=el('medcx'); if(cx) cx.style.display=MED.on?'inline-flex':'none';
  if(!MED.on){ return; }
  medForma();
  const g=L.layerGroup(), p=MED.pts;
  p.forEach((ll,i)=>{
    const mk=L.marker(ll,{icon:medIcone(),draggable:true,autoPan:true,zIndexOffset:2000}).addTo(g);
    /* arrastar ajusta o vértice AO VIVO; só a forma se refaz. O redesenho
       completo fica para o `dragend`, senão o marcador seria destruído embaixo
       do dedo e o arraste morreria no primeiro pixel. */
    mk.on('drag', e=>{ const ll2=e.target.getLatLng(); MED.pts[i]=[ll2.lat,ll2.lng]; medForma(); });

       dispara `click` quando não houve arraste, então os dois gestos convivem. */
    mk.on('click', ev=>{ L.DomEvent.stop(ev); MED.pts.splice(i,1); medDesenhar(); });
  });

}
function medLeitura(){
  const cx=el('medcx'); const p=MED.pts;
  if(cx){
    /* SÓ O NÚMERO. O dono pediu depois de ver a gaveta: "melhor apenas aparecer
       (xxx,x ha - xxx,x m) em cima". Área e perímetro, e nada mais — no celular
       o mapa é a informação, o painel é estorvo. */
    const d=p.length?medDist(p):0, a=medArea(p);
    const m=v=>v<1000?(v.toFixed(0)+' m'):((v/1000).toFixed(2).replace('.',',')+' km');
    const perim=p.length>2 ? d+medDist([p[p.length-1],p[0]]) : d;
    cx.innerHTML = (p.length<2 ? '<span class="fraco">toque para marcar</span>'
      : (p.length===2 ? m(d)
         : `${a.toFixed(1).replace('.',',')} ha <span class="fraco">·</span> ${m(perim)}`))
      + `<button id="medundo" title="Desfazer">↶</button><button id="medlimpa" title="Limpar">✕</button>`;
    const u=el('medundo'), c=el('medlimpa');
    if(u) u.onclick=(ev)=>{ ev.stopPropagation(); MED.pts.pop(); medDesenhar(); };
    if(c) c.onclick=(ev)=>{ ev.stopPropagation(); MED.pts=[]; medDesenhar(); };
  }
}
function medToggle(){
  MED.on=!MED.on; MED.pts=[];
  if(MED.on){
    /* o clique de medir não pode disputar com o mapa: enquanto está ligado, o
       toque marca canto; desligou, volta ao normal */
    _map.on('click', medPonto);
    try{ _map.getContainer().style.cursor='crosshair'; }catch(e){}
  }else{
    _map.off('click', medPonto);
    try{ _map.getContainer().style.cursor=''; }catch(e){}
  }
  medDesenhar(); pinta();
}
function medPonto(e){ if(!MED.on) return; MED.pts.push([e.latlng.lat,e.latlng.lng]); medDesenhar(); }
/* Sair da seção com a medição ligada deixaria o clique preso no mapa: o toque
   no clima continuaria marcando canto invisível. Desliga na saída. */
function medDesligar(){ if(!MED.on) return; MED.on=false; MED.pts=[];
  try{ _map.off('click', medPonto); _map.getContainer().style.cursor=''; }catch(e){}
  [['layer'],['shape']].forEach(([k])=>{ if(MED[k]){ try{ _map.removeLayer(MED[k]); }catch(e){} MED[k]=null; } }); }
/* quantos pixels vale 1 metro no zoom atual — é o que transforma a faixa da

function pxPorMetro(lat){

}
function maqVisivel(id){ return !TMAQS.length || TMAQS.map(String).includes(String(id)); }
function rotuloTMaqs(){
  if(!TMAQS.length) return 'Todas';

const VIVO_S=180;   // sem reportar há mais de 3 min = sem sinal (a caixa manda a cada 15 s)
/* ... MAS com a chave desligada (firmware S1.3) ela manda a cada 5 min de proposito.

   'desligada', que e justamente o que o dono pediu para ver. */
const VIVO_DESLIGADA_S=900;
function maqLbl(id,dev){ const m=MAQS[id]||{}; return m.id_frota||m.nome||dev||('#'+id); }
function maqSub(id){ const m=MAQS[id]||{}; return [m.nome&&m.nome!==m.id_frota?m.nome:'', [m.marca,m.modelo].filter(Boolean).join(' ')].filter(Boolean).join(' · '); }
function estadoTele(t){
  const seg=(Date.now()-new Date(t.medido_em||t.atualizado_em||0).getTime())/1000;
  /* ANDOU COM A CHAVE DESLIGADA vem antes de tudo: e reboque ou furto (firmware S1.3,

  if(t.moveu_sem_chave===true && seg<VIVO_S) return {k:'alerta', txt:'movendo SEM CHAVE', cor:'#ef4444'};
  if(!(seg < (t.ignicao===false ? VIVO_DESLIGADA_S : VIVO_S))) return {k:'off', txt:'sem sinal', cor:'#8b949e'};

function haQuanto(ts){

let DIAS_HIST=31;                 // janela buscada de clima_horario (cresce no "Ajustar")
let _map=null,_heat=null,_lotesL=null,_estL=null;
let _cv=null,_anim=null,_part=[];   // partículas de vento

/* ---------- utilidades ---------- */
const num=v=>(v===null||v===undefined||v==='')?null:(isNaN(+v)?null:+v);
const f=(v,c)=>v===null||v===undefined?'—':(+v).toFixed(c===undefined?1:c);
const dirNome=g=>g===null?'':['N','NE','L','SE','S','SO','O','NO'][Math.round(g/45)%8];
const dirSeta=g=>g===null?'':['↓','↙','←','↖','↑','↗','→','↘'][Math.round(g/45)%8];

function idadeDe(d){ if(!d) return null;
  const t=new Date(d.medido_em).getTime();
  if(!isNaN(t)) return Math.max(0,Math.round((Date.now()-t)/1000));

function idade(s){ if(s===null) return '—'; if(s<90) return 'agora';

function hhmm(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—';

const PERIODOS={agora:{lbl:'Agora',h:0},'24h':{lbl:'24 h',h:24},

let HPER='24h', HDE=null, HATE=null;

const dLocal=ms=>{ const d=new Date(ms);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

/* Teto de rótulos do eixo NA TELA DO CELULAR (no desktop são 16). Fica aqui,

const ALVO_TICKS=8;

   'passo' = agregada no mesmo passo do eixo (linha da tabela = ponto do eixo)
   'hora'  = hora a hora, o dado cru, dentro da MESMA janela escolhida
   As duas cobrem o mesmo período; muda só o quanto se agrupa. */
let HTAB='passo';

/* Agrupa as linhas horárias no mesmo passo do eixo.
   Média para o que é estado (temp, umidade, vento); SOMA para chuva, que é
   acumulado — média apagaria o total; média CIRCULAR para a direção, porque

function agruparPasso(s,ticks,passo){
  if(!s.length||!ticks.length) return [];
  const anc=ticks[0], mapa=new Map();
  s.forEach(h=>{

    const b=anc+Math.floor((ms-anc)/passo)*passo;
    if(!mapa.has(b)) mapa.set(b,[]);

  });

  const md=(r,k)=>{const v=col(r,k); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const sm=(r,k)=>{const v=col(r,k); return v.length?v.reduce((a,b)=>a+b,0):null;};
  return [...mapa.entries()].sort((a,b)=>a[0]-b[0]).map(([t,r])=>({

const nomePasso=p=>{ const h=p/3600e3;

const rotuloLinha=(t,passo)=>{

/* `esc` = escala ABSOLUTA da cor. Antes a escala era o próprio valor ±1, o que
