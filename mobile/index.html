const VARS={
  temp: {lbl:'Temp',un:'°C',c:'temp',ch:'temp',dec:1,esc:[5,45],
         grad:[[59,130,246],[56,189,248],[34,197,94],[250,204,21],[249,115,22],[239,68,68]]},
  umid: {lbl:'Umidade',un:'%',c:'umidade',ch:'umidade',dec:0,esc:[0,100],
         grad:[[249,115,22],[250,204,21],[34,197,94],[56,189,248],[59,130,246]]},
  // vento é mostrado por PARTÍCULAS, não por mancha: a mesma informação em
  // duas camadas atrapalhava a leitura (mesma decisão do módulo do desktop)
  vento:{lbl:'Vento',un:'km/h',c:'vento_kmh',ch:'vento_kmh',dec:1,esc:[0,30],sopro:true,
         grad:[[56,189,248],[52,211,153],[250,204,21],[249,115,22],[239,68,68]]},
  // chuva depende da janela: 30 mm em 24 h é muito, em 30 dias é pouco
  chuva:{lbl:'Chuva',un:'mm',c:'chuva_24h',ch:'chuva_mm',dec:1,acum:true,
         escPer:{agora:30,'24h':30,'7d':80,'30d':200},
         grad:[[148,163,184],[125,211,252],[56,189,248],[59,130,246],[37,99,235]]},
  pres: {lbl:'Pressão',un:'hPa',c:'pressao',ch:'pressao',dec:1,conv:v=>v/100,esc:[905,955],
         grad:[[124,58,237],[59,130,246],[34,197,94],[250,204,21],[249,115,22]]}
};
function escalaDe(k){
  const c=VARS[k];
  if(c.escPer) return [0, c.escPer[PERIODO]||30];
  return c.esc;
}
function est(id){ return ESTACOES.find(x=>x.id===id)||{}; }

/* direção que ventou por MAIS TEMPO — média de ângulo devolveria direção que
   nunca ocorreu (4 h de NE + 3 h de NO dariam norte) */
function dirMedia(ds){ const v=ds.filter(d=>d!==null&&!isNaN(d)); if(!v.length) return null;
  const x=v.reduce((s,d)=>s+Math.cos(d*Math.PI/180),0), y=v.reduce((s,d)=>s+Math.sin(d*Math.PI/180),0);
  return (Math.atan2(y,x)*180/Math.PI+360)%360; }
function dirPredominante(rows){
  const p=new Array(8).fill(0), a=Array.from({length:8},()=>[]);
  rows.forEach(r=>{ const d=num(r.vento_dir); if(d===null) return;
    const i=Math.round(((d%360)+360)%360/45)%8; p[i]+=(num(r.amostras)||1); a[i].push(d); });
  let im=-1,mx=0; p.forEach((v,i)=>{ if(v>mx){mx=v;im=i;} });
  if(im<0) return null;
  const tot=p.reduce((s,v)=>s+v,0);
  return {dir:dirMedia(a[im]), fatia:tot?mx/tot:0};
}
function valores(k){
  const cfg=VARS[k];
  if(PERIODO==='agora')
    return ATUAL.map(x=>{ let v=num(x[cfg.c]); if(v!==null&&cfg.conv) v=cfg.conv(v);
      return {id:x.estacao_id,v,dir:num(x.vento_dir),e:est(x.estacao_id)}; })
      .filter(x=>x.v!==null&&num(x.e.lat)!==null);
  const lim=Date.now()-PERIODOS[PERIODO].h*3600e3, por={};
  HORAS.forEach(r=>{ const t=new Date(r.hora).getTime();
    if(isNaN(t)||t<lim) return; (por[r.estacao_id]=por[r.estacao_id]||[]).push(r); });
  return Object.keys(por).map(id=>{
    const rows=por[id], vs=rows.map(r=>num(r[cfg.ch])).filter(v=>v!==null);
    if(!vs.length) return null;
    let v=cfg.acum?vs.reduce((a,b)=>a+b,0):vs.reduce((a,b)=>a+b,0)/vs.length;  // chuva SOMA
    if(cfg.conv) v=cfg.conv(v);
    const pd=dirPredominante(rows);
    return {id:+id,v,dir:pd?pd.dir:null,fatia:pd?pd.fatia:null,e:est(+id)};
  }).filter(x=>x&&num(x.e.lat)!==null);
}
function media(k){ const p=valores(k);
  return p.length?{v:p.reduce((s,x)=>s+x.v,0)/p.length,dir:p[0].dir,fatia:p[0].fatia,n:p.length}:null; }

/* MÁXIMA e MÍNIMA — só para as variáveis em que a faixa faz sentido.
   Não vale para CHUVA (é acumulado: "mínima de chuva" não quer dizer nada) nem
   para VENTO (o que interessa lá é a direção predominante e a rajada).
   Em período usa as horas da janela; a temperatura aproveita temp_min/temp_max,
   que são os extremos REAIS dentro de cada hora, não a média dela. */
function extremos(k){
  const cfg=VARS[k];
  if(cfg.acum||cfg.sopro) return null;
  let vals=[];
  if(PERIODO==='agora'){
    vals=ATUAL.map(x=>{ let v=num(x[cfg.c]); return (v!==null&&cfg.conv)?cfg.conv(v):v; })
              .filter(v=>v!==null);
    if(vals.length<2) return null;          // uma estação só: não há faixa a mostrar
  }else{
    const lim=Date.now()-PERIODOS[PERIODO].h*3600e3;
    HORAS.forEach(r=>{ const t=new Date(r.hora).getTime(); if(isNaN(t)||t<lim) return;
      if(k==='temp'){ const a=num(r.temp_min), b=num(r.temp_max);
        if(a!==null) vals.push(a); if(b!==null) vals.push(b);
        if(a===null&&b===null){ const m=num(r.temp); if(m!==null) vals.push(m); } }
      else { let v=num(r[cfg.ch]); if(v!==null){ if(cfg.conv) v=cfg.conv(v); vals.push(v); } }
    });
    if(vals.length<2) return null;
  }
  return {min:Math.min(...vals), max:Math.max(...vals)};
}

/* ---------- dados ---------- */
function utm2ll(E,N){
  const a=6378137,fl=1/298.257223563,e2=fl*(2-fl),ep2=e2/(1-e2),k0=.9996;
  const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const x=E-5e5,y=N-1e7,M=y/k0,mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2**3/256));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu);
  const C1=ep2*Math.cos(p1)**2,T1=Math.tan(p1)**2,N1=a/Math.sqrt(1-e2*Math.sin(p1)**2),
        R1=a*(1-e2)/Math.pow(1-e2*Math.sin(p1)**2,1.5),D=x/(N1*k0);
  const lat=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const l0=(23*6-183)*Math.PI/180;
  const lon=l0+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(p1);
  return [lat*180/Math.PI,lon*180/Math.PI];
}
async function carregar(){
  if(DESLOGADO) return;
  try{
    /* SESSAO ANTES DA LEITURA — sem sessao o RLS devolve [] COM SUCESSO (nao e
       erro). Se seguisse em frente, a tela mostraria "sem dado" e a pessoa
       acharia que o sistema quebrou, quando na verdade ela so precisa entrar
       de novo. Mesmo espirito da regra do offline-first no CLAUDE.md: resposta
       vazia sem rede/sessao NAO e dado bom. */
    const {data:s}=await SB.auth.getSession();
    if(!s||!s.session){
      DESLOGADO=true; destruirMapa();
      return telaLogin('Sessão encerrada. Entre de novo.');
    }
    CONTA=(s.session.user&&s.session.user.email)||'';
    ADMIN=CONTA.toLowerCase()==='leydiovan@gmail.com';
    const [e,a,h,l]=await Promise.all([
      SB.from('clima_estacoes').select('*').order('id'),
      SB.from('clima_atual').select('*'),
      SB.from('clima_horario').select('*').gte('hora',new Date(Date.now()-DIAS_HIST*864e5).toISOString()).order('hora'),
      LOTES.length?Promise.resolve({data:null}):SB.from('lotes').select('nome,geom').not('referencia','is',true)
    ]);
    ESTACOES=e.data||[]; ATUAL=a.data||[]; HORAS=h.data||[];
    await carregarTelemetria();
    if(SECAO==='safra') await carregarSafra();   // só busca a safra se alguém está olhando
    if(l&&l.data) LOTES=(l.data||[]).map(x=>{ const g=x.geom;
      if(!g||!Array.isArray(g.ring)||g.ring.length<3) return null;
      return {nome:x.nome,ring:g.ring.map(p=>utm2ll(+p[0],+p[1]))}; }).filter(Boolean);
    pinta();
  }catch(err){ el('app').innerHTML=`<div class="vazio">${err.message}</div>`; }
}

/* ---------- mapa (mínimo, de toque) ---------- */
let _lf=false;
/* NAO chamar de `leaflet`: o bundle UMD do Leaflet 1.9 faz factory(global.leaflet = {})
   e SOBRESCREVE uma funcao global com esse nome assim que carrega. O sintoma era
   "leaflet is not a function" na segunda vez que se abria o mapa, com tela preta. */
function garantirLeaflet(cb){
  if(window.L) return cb();
  if(_lf){ const t=setInterval(()=>{ if(window.L){ clearInterval(t); cb(); } },120); return; }
  _lf=true;
  const c=document.createElement('link'); c.rel='stylesheet';
  c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(c);
  const j=document.createElement('script'); j.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  j.onload=()=>cb(); j.onerror=()=>{ const m=el('mapa');
    if(m) m.innerHTML='<div class="vazio">mapa indisponível (sem internet)</div>'; };
  document.head.appendChild(j);
}
function bbox(){ let a=90,b=-90,c=180,d=-180,ok=false;
  LOTES.forEach(l=>l.ring.forEach(p=>{ ok=true;a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);d=Math.max(d,p[1]); }));
  return ok?{minLat:a,maxLat:b,minLon:c,maxLon:d}:null; }
function corDe(v,mn,mx,g){ if(v===null||mx===mn) return [120,130,150];
  const t=Math.max(0,Math.min(1,(v-mn)/(mx-mn))),p=t*(g.length-1),
        i=Math.min(g.length-2,Math.floor(p)),k=p-i;
  return [0,1,2].map(c=>Math.round(g[i][c]*(1-k)+g[i+1][c]*k)); }
function idw(lat,lon,pts){ let n=0,d=0;
  for(const p of pts){ const q=(lat-+p.e.lat)**2+(lon-+p.e.lon)**2;
    if(q<1e-10) return p.v; const w=1/q; n+=w*p.v; d+=w; } return d?n/d:null; }
/* ---- vento: partículas em vez de mancha ----
   A direção medida é de ONDE o vento vem, então o deslocamento vai para o lado
   OPOSTO: u = -sin(dir) na longitude, v = -cos(dir) na latitude. */
function dentroDaFazenda(lat,lon){
  if(!LOTES.length) return true;
  for(const l of LOTES){ const r=l.ring; let d=false;
    for(let i=0,j=r.length-1;i<r.length;j=i++){
      if(((r[i][0]>lat)!==(r[j][0]>lat)) &&
         (lon<(r[j][1]-r[i][1])*(lat-r[i][0])/(r[j][0]-r[i][0])+r[i][1])) d=!d; }
    if(d) return true; }
  return false;
}
function ventoEm(lat,lon,pts){
  let u=0,v=0,w=0;
  for(const p of pts){
    if(p.dir===null||p.v===null) continue;
    const d2=(lat-+p.e.lat)**2+(lon-+p.e.lon)**2; if(d2<1e-10) continue;
    const q=1/d2, r=p.dir*Math.PI/180;
    u+=q*(-Math.sin(r))*p.v; v+=q*(-Math.cos(r))*p.v; w+=q;
  }
  return w?{u:u/w,v:v/w}:null;
}
function pararVento(){
  if(_anim){ cancelAnimationFrame(_anim); _anim=null; }
  if(_cv&&_cv.parentNode) _cv.parentNode.removeChild(_cv);
  _cv=null; _part=[];
}
function iniciarVento(){
  pararVento();
  if(!_map) return;
  const pts=valores('vento').filter(p=>p.dir!==null), bb=bbox();
  if(!pts.length||!bb) return;
  _cv=document.createElement('canvas');
  _cv.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:400';
  _map.getPanes().overlayPane.appendChild(_cv);
  // nasce SÓ dentro dos lotes: nascendo na caixa inteira sobravam traços soltos
  // fora da fazenda (a partícula desenhava 1 segmento antes de ser descartada)
  const nova=()=>{ for(let t=0;t<60;t++){
      const lat=bb.minLat+Math.random()*(bb.maxLat-bb.minLat);
      const lon=bb.minLon+Math.random()*(bb.maxLon-bb.minLon);
      if(dentroDaFazenda(lat,lon)) return {lat,lon,i:Math.floor(Math.random()*70),vida:70+Math.floor(Math.random()*70)};
    } return null; };
  _part=Array.from({length:160},nova).filter(Boolean);
  if(!_part.length){ pararVento(); return; }
  const cx=_cv.getContext('2d');
  (function passo(){
    if(!_cv||!_map) return;
    const sz=_map.getSize();
    if(_cv.width!==sz.x||_cv.height!==sz.y){ _cv.width=sz.x; _cv.height=sz.y; }
    L.DomUtil.setPosition(_cv,_map.containerPointToLayerPoint([0,0]));
    cx.globalCompositeOperation='destination-out'; cx.fillStyle='rgba(0,0,0,.11)';
    cx.fillRect(0,0,_cv.width,_cv.height);
    cx.globalCompositeOperation='source-over'; cx.lineWidth=1.7; cx.lineCap='round';
    for(let i=0;i<_part.length;i++){
      const p=_part[i]; if(!p) continue;
      const w=ventoEm(p.lat,p.lon,pts); if(!w){ _part[i]=nova(); continue; }
      // 0.00008 = graus por quadro por km/h (metade do inicial: corriam rápido
      // demais). A proporção entre as velocidades continua igual — só a escala.
      const la=p.lat+w.v*0.00008, lo=p.lon+w.u*0.00008;
      if(!dentroDaFazenda(la,lo)){ _part[i]=nova(); continue; }
      const a=_map.latLngToContainerPoint([p.lat,p.lon]), b=_map.latLngToContainerPoint([la,lo]);
      const vel=Math.hypot(w.u,w.v);
      cx.strokeStyle = vel<5?'rgba(56,189,248,.85)' : vel<10?'rgba(52,211,153,.9)'
                     : vel<15?'rgba(250,204,21,.92)' : 'rgba(249,115,22,.95)';
      cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke();
      p.lat=la; p.lon=lo; p.i++;
      if(p.i>p.vida) _part[i]=nova();
    }
    _anim=requestAnimationFrame(passo);
  })();
}
function mascara(bb,W,H){
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d');
  if(!LOTES.length){ x.fillStyle='#fff'; x.fillRect(0,0,W,H); return cv; }
  x.fillStyle='#fff';
  LOTES.forEach(l=>{ x.beginPath();
    l.ring.forEach((p,i)=>{ const px=((p[1]-bb.minLon)/(bb.maxLon-bb.minLon))*W,
                                  py=((bb.maxLat-p[0])/(bb.maxLat-bb.minLat))*H;
      i?x.lineTo(px,py):x.moveTo(px,py); }); x.closePath(); x.fill(); });
  return cv;
}
/* Destrói o mapa de verdade ao trocar de tela. Antes bastava _map=null, mas a
   instância antiga ficava viva presa a um DOM já substituído — daí o erro de
   inicialização e a tela preta ao voltar para o Clima. */
/* Busca a telemetria junto com o clima (o carregar() já roda a cada 60 s quando a
   tela está visível, e em visibilitychange/focus/online — a regra do projeto para
   página que se atualiza sozinha). O RASTRO do dia só é buscado quando o mapa da
   telemetria está aberto: são milhares de pontos por máquina, e celular paga. */
async function carregarTelemetria(){
  try{
    const ps=[SB.from('telemetria_atual').select('*'), SB.from('telemetria_vigia').select('*')];
    ps.push(Object.keys(MAQS).length ? Promise.resolve({data:null})
          : SB.from('maquinas_identificacao').select('id,id_frota,nome,marca,modelo,categoria'));
    const [t,v,m]=await Promise.all(ps);
    /* Regra do offline-first: lista vazia só substitui o que está na tela quando
       veio DA REDE com sucesso. Aqui a chamada respondeu, então vale. */
    if(t&&!t.error) TELE=t.data||[];
    if(v&&!v.error){ VIGIA=v.data||[]; ULTIMA_OK=Date.now(); }
    if(m&&m.data) m.data.forEach(x=>MAQS[x.id]=x);
    /* reservatório: o cadastro (contorno) vem uma vez; situação e série a cada ciclo.
       Mesma regra do offline-first: só substitui quando a chamada não deu erro. */
    const [rv,rc,rh]=await Promise.all([
      SB.from('reservatorio_vigia').select('*'),
      Object.keys(RESVCAD).length ? Promise.resolve({data:null})
        : SB.from('reservatorio').select('id,nome,geom,nivel_max_m,offset_fundo_m'),
      SB.from('reservatorio_horario').select('reservatorio_id,hora,nivel_m')
        .gte('hora',new Date(Date.now()-24*3600e3).toISOString()).order('hora')
    ]);
    if(rv&&!rv.error) RESV=rv.data||[];
    if(rc&&rc.data&&window.RESV_UI) rc.data.forEach(r=>{ RESVCAD[r.id]=RESV_UI.prepararCadastro(r, utm2ll); });
    if(rh&&!rh.error) RESVH=rh.data||[];
    /* usinas: mesma regra — cadastro (contorno) uma vez, situação a cada ciclo */
    const [sv,sc,si,st]=await Promise.all([
      SB.from('solar_vigia').select('*'),
      Object.keys(SOLARCAD).length ? Promise.resolve({data:null})
        : SB.from('solar_sitio').select('id,nome,tipo,geom'),
      SB.from('solar_inversor_atual').select('sitio_id,endereco,nome,estado,falha,p_ativa_kw,temp_c,e_hoje_kwh'),
        SB.from('solar_string_vigia').select('sitio_id,endereco,string_n,tensao_v,corrente_a,potencia_w,situacao,mensagem')
    ]);
    if(sv&&!sv.error&&sv.data&&sv.data.length) SOLAR=sv.data;
    if(si&&!si.error&&si.data&&si.data.length) SOLARINV=si.data;
    if(st&&!st.error&&st.data&&st.data.length) SOLARSTR=st.data;
    if(sc&&sc.data&&window.SOLAR_UI) sc.data.forEach(s=>{ SOLARCAD[s.id]=SOLAR_UI.prepararCadastro(s, utm2ll); });
    if(SECAO==='tel' && SUB==='mapa') await carregarRastro();
  }catch(e){ console.warn('[telemetria]',e.message||e); }
}
function diaLocalMob(off){ const d=new Date(); if(off) d.setDate(d.getDate()+off); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
async function carregarRastro(){
  if(TRPER==='off'){ TRAILS={}; return; }        // sem rastro nem busca — é o modo leve
  const dias=Math.max(1,+TRPER||1);
  try{
    let q=SB.from('telemetria_jornada').select('device_id,maquina_id,trajeto')
      .gte('dia',diaLocalMob(-(dias-1))).lte('dia',diaLocalMob(0));   // datas LOCAIS, nunca toISOString()
    if(TMAQS.length) q=q.in('maquina_id',TMAQS.map(Number));
    const {data,error}=await q;
    if(error||!data) return;
    const novo={};
    data.forEach(j=>{
      const t=Array.isArray(j.trajeto)?j.trajeto:[];
      const passo=Math.max(1,Math.ceil(t.length/1200));   // celular: 1.200 pontos por máquina bastam para a forma
      const linhas=[]; let atual=[], ant=null;
      for(let i=0;i<t.length;i++){
        const q=t[i]; if(!q||q[0]==null) continue;
        let quebra=false;
        if(ant){ const dx=(q[1]-ant[1])*111320*Math.cos(q[0]*Math.PI/180), dy=(q[0]-ant[0])*111320;
                 if(Math.hypot(dx,dy)>300 || ((+q[2]||0)-(+ant[2]||0))/1000>90) quebra=true; }
        ant=q;
        if(quebra){ if(atual.length>1) linhas.push(atual); atual=[]; }   // salto é buraco, não caminho
        /* [lat, lon, VELOCIDADE, TEMPO] — a velocidade separa trabalho de
           deslocamento na hora de desenhar; o tempo é o que o timelapse percorre.
           Os dois viajam junto do ponto para o desenho nunca precisar voltar ao
           banco: trocar de modo ou dar play é só redesenhar. */
        if(quebra || (i%passo)===0 || i===t.length-1) atual.push([+q[0],+q[1],(+q[3]||0),(+q[2]||0)]);
      }
      if(atual.length>1) linhas.push(atual);
      /* ACUMULA por device: com período de vários dias vem uma linha POR DIA, e
         sobrescrever deixaria só o último — o rastro de 7 dias viraria o de 1. */
      const o=novo[j.device_id]||(novo[j.device_id]={linhas:[], maquina_id:j.maquina_id});
      o.linhas=o.linhas.concat(linhas);
    });
    /* piloto do mesmo período (01/10/2026). Falha numa máquina não derruba o rastro:
       ela só volta para a regra da velocidade até a próxima carga. */
    const [ay,am,ad]=diaLocalMob(-(dias-1)).split('-').map(Number), desdeMs=new Date(ay,am-1,ad).getTime();
    await Promise.all(Object.keys(novo).map(async dev=>{
      try{ novo[dev].piloto=await carregarPilotos(dev, desdeMs); }
      catch(e){ console.warn('[piloto]',dev,e.message||e); if(TRAILS[dev]&&TRAILS[dev].piloto) novo[dev].piloto=TRAILS[dev].piloto; }
    }));
    TRAILS=novo;
  }catch(e){ console.warn('[rastro]',e.message||e); }
}
function corMaqIdx(i){ return ['#ffc107','#00c896','#38bdf8','#bc8cff','#2dd4bf','#f472b6'][i%6]; }
/* MAPA DA TELEMETRIA — os lotes em vermelho fino (igual ao do clima) + o rastro do
   dia + um pino por máquina. Desenha por cima do mesmo #mapa, para não manter dois
   Leaflet vivos no celular. */

/* RUMO E POSIÇÃO DO ÍCONE — 18/09/2026, pedido do dono:
   "o ponto atual que ele está não está na posição real... os pontos para fazer a
    direção têm que ter uma distância mínima, quando ele fica parado oscilando os
    pontos ele não bate com a realidade".

   Dois defeitos diferentes, e os dois eram de DESENHO, não de dado:

   1) POSIÇÃO ATRASADA. O ícone saía de `telemetria_atual`, que o Pi atualiza a cada
      ~1 min, enquanto o RASTRO na mesma tela já tinha pontos de 15 em 15 s. A máquina
      aparecia até um minuto atrás do próprio rastro. Agora, quando o rastro tem ponto
      mais novo que a linha do "agora", é ele que manda — as duas coisas na tela passam
      a contar a mesma história.

   2) RUMO DE RUÍDO. O rumo vinha pronto no pacote. Parada, a máquina oscila alguns
      centímetros e dois pontos vizinhos dão qualquer direção: o ícone rodopia. Agora o
      rumo só se refaz com DISTÂNCIA MÍNIMA entre os dois pontos (RUMO_MIN_M); abaixo
      disso, MANTÉM o último rumo bom — que é o que a máquina parada realmente tem, ela
      continua apontada para onde estava indo.
      Mesma ideia do firmware do Steiger, que já exige 1 m antes de recalcular o rumo
      (firmware/tecu_tra007/src/steiger.h). Aqui a barra é maior porque o ponto que
      chega ao app pode ser de outra fonte (a M8N da TECU-03 dá rumo do próprio GPS,
      que passeia parado) e porque o rastro do app vem decimado. */
const RUMO_MIN_M = 3;                    // distância entre os dois pontos que definem o rumo
const RUMO_JANELA_MS = 5 * 60 * 1000;    // não buscar rumo em ponto velho demais
const RUMO_ULT = {};                     // último rumo BOM por caixa (é o que segura o ícone parado)
function _distRumo(a, b){
  const dx = (b[1]-a[1]) * 111320 * Math.cos(a[0]*Math.PI/180), dy = (b[0]-a[0]) * 111320;
  return Math.hypot(dx, dy);
}
function _calcRumo(a, b){
  const dx = (b[1]-a[1]) * Math.cos(a[0]*Math.PI/180), dy = (b[0]-a[0]);
  const r = Math.atan2(dx, dy) * 180 / Math.PI;
  return r < 0 ? r + 360 : r;
}
/* Anda para trás no rastro até achar um ponto distante o bastante. Devolve
   {lat, lon, t, rumo} — rumo null quando não houve deslocamento que o justifique. */
function _poseDaLinha(ln, TI){
  if(!ln || ln.length < 1) return null;
  const u = ln[ln.length-1], tu = +u[TI] || 0;
  let rumo = null;
  for(let k = ln.length-2; k >= 0; k--){
    const p = ln[k];
    if(tu && (+p[TI]||0) && tu - (+p[TI]||0) > RUMO_JANELA_MS) break;
    if(_distRumo(p, u) >= RUMO_MIN_M){ rumo = _calcRumo(p, u); break; }
  }
  return { lat:+u[0], lon:+u[1], t:tu, rumo };
}
/* Junta as duas decisões: qual ponto desenhar e para onde apontar. `atual` é a linha
   de telemetria_atual; `pose` é o que saiu do rastro (pode ser null). */
function _resolvePose(dev, atual, pose){
  const tAtual = new Date(atual.medido_em || 0).getTime();
  const usaRastro = pose && pose.t > tAtual + 1000;          // rastro mais novo que o "agora"
  /* O RASTRO SÓ MANDA NO RUMO SE FOR RECENTE (18/09/2026). O dono viu o ícone "torto"
     na estrada: a 100 km/h o rastro anda 420 m entre pontos, e a montagem do rastro
     QUEBRA a linha em salto de mais de 300 m — então cada trecho vira ponto solto, é
     descartado, e sobrava como "última linha" um pedaço velho, da parte devagar do
     percurso. O ícone ficava apontado para onde a máquina ia MINUTOS antes.
     Conferido contra os dados do passeio: o rumo que a caixa manda está CERTO (andou
     372 m para 170°, mandou 170°), porque o firmware já exige deslocamento mínimo. */
  const poseFresca = pose && pose.rumo != null && Math.abs(tAtual - pose.t) <= 90000;
  if(poseFresca) RUMO_ULT[dev] = pose.rumo;
  const rumo = poseFresca ? pose.rumo
             : (Number(atual.hdg_deg) || (RUMO_ULT[dev] != null ? RUMO_ULT[dev] : 0));
  return { lat: usaRastro ? pose.lat : +atual.lat,
           lon: usaRastro ? pose.lon : +atual.lon,
           rumo, doRastro: !!usaRastro };
}

/* No celular o rastro vem quebrado em linhas (uma por dia, e por salto). A pose sai
   da linha que termina mais tarde — a mesma regra do timelapse. */
function poseRastroMob(tr){
  let alvo = null, tf = -1;
  (tr.linhas||[]).forEach(ln => { if(!ln.length) return;
    const tt = +ln[ln.length-1][3] || 0; if(tt > tf){ tf = tt; alvo = ln; } });
  return _poseDaLinha(alvo, 3);          // ponto do celular: [lat, lon, vel, t_ms]
}
/* tamanho da placa da máquina conforme o zoom: normal de perto (z>=15), média em
   13–14, pequena de longe. Pedido do dono (03/10/2026): de longe "só vê um monte de
   escrita"; na telemetria "tem coisa que não tem polígono, só tem que dar uma ajustada". */
function telPlaca(){ const z=_map?_map.getZoom():15; return z>=15?'':z>=13?' pm':' pp'; }
function desenhaTelemetria(){
  if(_telL){ try{ _map.removeLayer(_telL); }catch(e){} _telL=null; }
  /* O GRUPO JÁ ENTRA NO MAPA AQUI, antes de desenhar (18/09/2026). Quem
     desenha precisa saber o ZOOM, e o jeito de perguntar é `grupo._map` —
     que só existe depois do addTo. Com o addTo lá no fim, o solar_mapa.js
     pensava que estava sempre na vista de longe e nunca mostrava as placas,
     as strings nem as construções por mais que se aproximasse. */
  const g=L.layerGroup().addTo(_map); let i=0, pts=[], distTrab=0, areaBorda=0, faixaRef=0; const cores=[], girar=[], faixas=[], bordas=[], tracos=[], pontas=[];
  /* reservatório ANTES das máquinas: fica por baixo delas. Talude, água, rótulo
     e a janela com o corte vêm do reservatorio_corte.js (arquivo ÚNICO, o mesmo
     do módulo de telemetria). */
  if(window.RESV_UI) RESV.forEach(r=>{
    const c=RESVCAD[r.id]; if(!c||!c.anel) return;
    RESV_UI.desenhar(L, g, r, c, ()=>RESV_UI.abrirJanela(r.id, fonteResv));
    c.anel.forEach(p=>pts.push(p));
  });
  /* usinas: por baixo das máquinas, igual ao piscinão. NÃO entram no
     enquadramento (pts) — ficam ~1 km ao sul e afastariam o zoom das máquinas. */
  if(window.SOLAR_UI) SOLAR.forEach(v=>{
    const c=SOLARCAD[v.id]; if(!c||!c.anel) return;
    SOLAR_UI.desenhar(L, g, v, c, aba=>SOLAR_UI.abrirJanela(v.id, fonteSolar, aba));
  });
  TELE.filter(t=>maqVisivel(t.maquina_id)).forEach(t=>{
    const cor=corMaqIdx(i++), tr=TRAILS[t.device_id];
    cores.push([maqLbl(t.maquina_id,t.device_id), cor]);
    if(tr){
      /* OS DOIS JUNTOS, como no Alabama Agro (módulo Telemetria): a LINHA do
         rastro sempre — é o caminho que a máquina fez —, e por cima dela a
         FAIXA de trabalho nos trechos que contam como trabalho. Eu tinha feito
         um substituindo o outro, e o dono corrigiu: "tem o rastro e a faixa de
         trabalho aparece junto".
         A faixa vai como ESPESSURA da polilinha (não polígono por segmento):
         são centenas de segmentos, e no celular 500 polígonos travam. Verde
         translúcido, o mesmo `#00c896` do desktop. */
      const _imp=implementoDe(t.maquina_id);   // largura do IMPLEMENTO quando houver (17/09/2026)
      const faixaM=_imp?_imp.larguraM:(Number((MAQS[t.maquina_id]||{}).faixa_m)||3.8);
      const wpx=Math.max(2, faixaM*pxPorMetro(+t.lat||-12.65));
      if(TRMODO==='trab'){
        const _st=soTrabalho(tr.linhas, tr.piloto, faixaM);
        _st.bordas.forEach(bd=>{ if(TL.t!=null && bd.t>TL.t) return;          // timelapse: só até o instante
          bordas.push(bd.poly); areaBorda+=areaM2(bd.poly); });
        tlCortar(_st).forEach(ln=>{
          faixas.push([ln.map(p=>[p[0],p[1]]), wpx]);
          for(let k=1;k<ln.length;k++){   // distância trabalhada -> hectares na legenda
            const a=ln[k-1], b=ln[k];
            const dx=(b[1]-a[1])*111320*Math.cos(a[0]*Math.PI/180), dy=(b[0]-a[0])*111320;
            distTrab+=Math.hypot(dx,dy);
          }
        });
        faixaRef=faixaM;
      }
      tlCortar(tr.linhas).forEach(ln=>{ tracos.push([ln.map(p=>[p[0],p[1]]), cor]); });
      /* o enquadramento usa o rastro INTEIRO, mesmo durante o timelapse: se
         seguisse só o trecho já desenhado, o mapa ficaria pulando a cada quadro */
      tr.linhas.forEach(ln=>ln.forEach(p=>pts.push([p[0],p[1]])));
    }
    /* no timelapse o ícone vai para onde a máquina ESTAVA naquele instante */
    const noTempo = (TL.t!=null && tr) ? tlPosicao(tr) : null;
    if(!noTempo && (t.lat==null||t.lon==null)) return;
    /* fora do timelapse, o ícone segue o ponto mais novo do rastro e o rumo com
       distância mínima (ver _resolvePose) */
    const pose = (TL.t==null && tr) ? poseRastroMob(tr) : null;
    const pr = _resolvePose(t.device_id, t, pose);
    if(!noTempo && !(pr.lat) && !(pr.lon)) return;         // sem posição alguma: não há o que desenhar
    const e=estadoTele(t), ll=noTempo?[noTempo[0],noTempo[1]]:[pr.lat,pr.lon]; pts.push(ll);
    const faixa=Number((MAQS[t.maquina_id]||{}).faixa_m)||3.8;
    const w=iconePxMob(+t.lat), hh=w*(VB_H/VB_W);
    const mk=L.marker(ll,{icon:L.divIcon({html:(ehArticulado(t.maquina_id)?svgSteiger(e.cor,implementoDe(t.maquina_id),e.k==='desl'||e.k==='off'):ehT8(t.maquina_id)?svgT8Icone(e.cor,e.k==='desl'||e.k==='off'):ehMagnum(t.maquina_id)?svgMagnumIcone(e.cor,e.k==='desl'||e.k==='off'):ehJd7225(t.maquina_id)?svgJd7225Icone(e.cor,e.k==='desl'||e.k==='off'):ehJd8420(t.maquina_id)?svgJd8420Icone(e.cor,e.k==='desl'||e.k==='off'):ehJd7815(t.maquina_id)?svgJd7815Icone(e.cor,e.k==='desl'||e.k==='off'):ehJd6190(t.maquina_id)?svgJd6190Icone(e.cor,e.k==='desl'||e.k==='off'):ehJd6125(t.maquina_id)?svgJd6125Icone(e.cor,e.k==='desl'||e.k==='off'):ehMf4292(t.maquina_id)?svgMf4292Icone(e.cor,e.k==='desl'||e.k==='off'):ehMf6360(t.maquina_id)?svgMf6360Icone(e.cor,e.k==='desl'||e.k==='off'):ehMf296(t.maquina_id)?svgMf296Icone(e.cor,e.k==='desl'||e.k==='off'):ehValmet86(t.maquina_id)?svgValmet86Icone(e.cor,e.k==='desl'||e.k==='off'):ehColhedoraSts(t.maquina_id)?svgColhedoraStsIcone(e.cor,e.k==='desl'||e.k==='off',t.maquina_id):ehColhedoraAlgodao(t.maquina_id)?svgColhedoraAlgodaoIcone(e.cor,e.k==='desl'||e.k==='off'):ehCaseW20g(t.maquina_id)?svgCaseW20gIcone(e.cor,e.k==='desl'||e.k==='off'):ehCat924g(t.maquina_id)?svgCat924gIcone(e.cor,e.k==='desl'||e.k==='off'):ehJcb53070(t.maquina_id)?svgJcb53070Icone(e.cor,e.k==='desl'||e.k==='off'):ehUniport8030(t.maquina_id)?svgUniport8030Icone(e.cor,e.k==='desl'||e.k==='off'):ehParruda(t.maquina_id)?svgParrudaIcone(e.cor,e.k==='desl'||e.k==='off',!!loteMob(ll[0],ll[1])):ehMotoniveladora(t.maquina_id)?svgMotoniveladoraIcone(e.cor,e.k==='desl'||e.k==='off'):svgMaquina(faixa,e.cor)),className:'',iconSize:[w,hh],iconAnchor:[w/2,hh/2]}),zIndexOffset:1000}).addTo(g);
    const _im=implementoDe(t.maquina_id);
    mk.bindTooltip(maqLbl(t.maquina_id,t.device_id)+(_im?' · '+_im.id_frota+' ('+_im.origem+')':''),{permanent:true,direction:'bottom',offset:[0,hh/2],className:'placa'+telPlaca()});
    mk.on('click', ()=>painelMaquina(t.device_id));      // painel do veículo (18/09/2026)
    girar.push([mk, pr.rumo]);
    /* a ponta viva so existe quando ha rastro e ele ficou para tras (ver onde e desenhada) */
    if(!noTempo && pose && !pr.doRastro && _distRumo([pose.lat,pose.lon],[pr.lat,pr.lon]) > 5)
      pontas.push([[pose.lat,pose.lon],[pr.lat,pr.lon],cor]);
  });
  /* ORDEM IMPORTA: a faixa entra ANTES para a linha do rastro ficar por cima
     dela — é a mesma pilha do desktop (camadaFaixa embaixo, camadaTraco em
     cima). Invertido, a faixa apagaria o traço que ela deveria acompanhar. */
  /* ponta RETA (butt) e junção CHANFRADA (bevel), não redondas: a redonda passava meia faixa além do fim da passada,
     justamente na divisa (01/10/2026). Os trechos que cruzam a divisa vêm recortados em `bordas`. */
  faixas.forEach(([ln,w])=>L.polyline(ln,{color:'#00c896',weight:w,opacity:.32,lineCap:'butt',lineJoin:'bevel'}).addTo(g));
  bordas.forEach(pl=>L.polygon(pl,{color:'#00c896',weight:0,fillOpacity:.32}).addTo(g));
  tracos.forEach(([ln,c])=>L.polyline(ln,{color:c,weight:2.5,opacity:.9}).addTo(g));
  /* PONTA VIVA (18/09/2026). O rastro do dia sobe ao Supabase a cada 5 min; a posicao
     do "agora", a cada 1 min. Resultado que o dono viu: "o rastro esta sempre atrasado,
     nao anda junto". Esta linha TRACEJADA liga a ponta do rastro gravado ate onde a
     maquina esta agora. Tracejada de proposito: o caminho exato daquele trecho ainda
     nao chegou — o que se sabe e que ela saiu dali e esta aqui. Quando o trecho chega,
     o rastro cheio cobre e ela some sozinha. */
  pontas.forEach(([a,b,c])=>L.polyline([a,b],{color:c,weight:2,opacity:.55,dashArray:"5,6"}).addTo(g));
  _telL=g;
  /* A ROTAÇÃO SÓ DEPOIS DE ENTRAR NO MAPA: o elemento do divIcon não existe
     enquanto o grupo não está no mapa — chamando getElement() antes, o
     `transform` ia para lugar nenhum e a máquina ficava sempre apontando para
     o norte (foi o que o teste pegou). */
  girar.forEach(([mk,hd])=>{ const elm=mk.getElement(); const gr=elm&&elm.querySelector('.gir');
    if(gr) gr.setAttribute('transform','rotate('+hd+' '+(VB_W/2)+' '+(VB_H/2)+')'); });
  /* A legenda diz de quem é cada cor. Com rastro desligado ela vira a legenda
     dos ESTADOS, que é o que sobra para ler no mapa. */
  const lg=el('legenda');
  if(lg){
    lg.className='legenda mini';   // tira baixa, do tamanho do texto (ver CSS)
    /* SÓ O NÚMERO BÁSICO. A explicação inteira — faixa em metros, "teto sem
       descontar sobreposição", aviso de escala — foi para o `title`: quem
       precisa, segura e lê; quem não precisa, tem o mapa de volta. O dono
       pediu depois de ver o painel ocupando três linhas no celular. */
    const fx=faixaRef||0, fpx=fx*pxPorMetro(-12.65), ha=(distTrab*fx+areaBorda)/10000;
    const dica='faixa de '+String(fx).replace('.',',')+' m · teto, sem descontar sobreposição'
      +(fpx<3?' · aproxime para ver a faixa na escala':'');
    const nota=(TRMODO==='trab'&&TRPER!=='off'&&fx>0)
      ? `<span title="${dica}"><i style="background:#00c896;opacity:.5"></i><b>${ha.toFixed(1).replace('.',',')} ha</b>${fpx<3?' <span class="fraco">·fora de escala</span>':''}</span>` : '';
    lg.innerHTML = (TRPER!=='off' && cores.length)
      ? cores.map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')+nota
      : `<span><i style="background:#00c896"></i>andando</span><span><i style="background:#ffc107"></i>parada</span><span><i style="background:#8b949e"></i>sem sinal</span>`;
  }
  /* ⛔ ENQUADRA UMA VEZ SÓ, por recorte. O desenho roda de novo a cada zoom (o
     ícone tem tamanho em metros) e a cada atualização de 60 s — se ele
     reenquadrasse sempre, todo zoom que a pessoa desse voltaria sozinho para
     longe, centralizado na máquina. Foi exatamente o que o dono pegou.
     `_telEnq` só é zerado quando MUDA O QUE SE VÊ: entrar na seção, trocar
     período, modo ou máquina. Mexer no mapa nunca reenquadra. */
  if(pts.length && !_telEnq){ _telEnq=true; try{ _map.fitBounds(L.latLngBounds(pts).pad(.12),{maxZoom:16}); }catch(e){} }
  if(window.RESV_UI) RESV_UI.atualizarJanela();   // janela aberta acompanha a atualização
  if(window.SOLAR_UI) SOLAR_UI.atualizarJanela();
}
const fonteResv=id=>({ r:RESV.find(x=>x.id===id), c:RESVCAD[id],
  serie:RESVH.filter(x=>x.reservatorio_id===id) });
/* a janela das usinas se alimenta daqui: situação, inversores e strings */
const fonteSolar=id=>({ v:SOLAR.find(x=>x.id===id), inversores:SOLARINV.filter(x=>x.sitio_id===id),
  strings:SOLARSTR.filter(x=>x.sitio_id===id) });
/* POSIÇÃO VELHA (18/09/2026). A TECU do Steiger tira a posição do BARRAMENTO: com a
   máquina desligada ela segue viva e mandando, só que sem coordenada. Antes da
   migração 107 esse vazio apagava a última posição boa e o ícone SUMIA do mapa (o
   dono viu: "liga aparece, desliga some"); a colhedora não sumia só porque parou de
   mandar. Agora o banco preserva a posição e diz em `posicao_em` de quando ela é —
   aqui a tela avisa, para o último lugar conhecido não passar por posição de agora. */
function posVelha(t){
  if(!t.posicao_em) return '';
  const dif=(new Date(t.medido_em)-new Date(t.posicao_em))/1000;
  if(!(dif>90)) return '';
  return `<div style="font-size:12px;color:#c9a227;margin-top:2px">no mapa, o último lugar conhecido`
       + ` · posição de ${haQuanto(t.posicao_em)}</div>`;
}

/* ===================== PAINEL DA MÁQUINA (18/09/2026) =====================
   Pedido do dono: "quando clica na máquina tinha que abrir na tela como se fosse um
   painel do veículo com as informações".

   DE ONDE VEM CADA NÚMERO, que é o que evita mentira na tela:
     - posição, velocidade, satélites, atraso  -> 'telemetria_atual' (a cada ~1 min);
     - rotação, carga, temperatura, consumo, horímetro, combustível total, chave
       -> 'telemetria_motor', a série nova (migração 109), lida ao abrir o painel.
   Os dois chegam em cadências diferentes, então cada bloco mostra a IDADE do seu
   próprio dado. Misturar instantes diferentes num mesmo mostrador foi o defeito que
   já apareceu no ícone (17/09) — aqui não se repete.

   "—" quer dizer SEM LEITURA, e não zero. Com a máquina desligada o barramento morre
   e não há rotação nenhuma para mostrar; zero seria invenção. */
let _painelDev = null, _painelTimer = null, _painelMotor = {};

function fecharPainel(){
  _painelDev = null;
  if(_painelTimer){ clearInterval(_painelTimer); _painelTimer = null; }
  const j = el('painelMaq'); if(j) j.remove();
}
async function painelMaquina(dev){
  _painelDev = dev;
  desenharPainel();                       // pinta na hora com o que já se tem
  await carregarMotor(dev);
  desenharPainel();
  if(_painelTimer) clearInterval(_painelTimer);
  /* atualiza sozinho, mas só com a tela à frente — mesma regra do resto do app:
     timer de aba escondida é estrangulado pelo navegador e mostra número velho */
  _painelTimer = setInterval(async ()=>{
    if(document.visibilityState!=='visible' || !_painelDev) return;
    await carregarMotor(_painelDev); desenharPainel();
  }, 30000);
}
async function carregarMotor(dev){
  try{
    const {data,error} = await SB.from('telemetria_motor').select('*')
      .eq('device_id',dev).order('recebido_em',{ascending:false}).limit(1);
    if(!error && data && data.length) _painelMotor[dev] = data[0];
  }catch(e){ console.warn('[motor]',e.message||e); }
}
/* mostrador redondo de rotação: arco de 240°, agulha e o número no meio */
function gaugeRPM(rpm, max){
  const A0=150, A1=390, R=54, cx=70, cy=70;            // 240° começando embaixo à esquerda
  const pol=(a,r)=>[cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)];
  const arco=(de,ate,r,cor,w)=>{ const [x1,y1]=pol(de,r), [x2,y2]=pol(ate,r);
    return '<path d="M'+x1+','+y1+' A'+r+','+r+' 0 '+((ate-de)>180?1:0)+',1 '+x2+','+y2+
           '" fill="none" stroke="'+cor+'" stroke-width="'+w+'" stroke-linecap="round"/>'; };
  const v = rpm==null ? null : Math.max(0, Math.min(max, rpm));
  const ang = v==null ? A0 : A0 + (A1-A0)*v/max;
  let s = arco(A0,A1,R,'#1d2a3d',12);
  // faixa vermelha do fim da escala, como em painel de verdade

const VG={

function desenhaMapa(){
  const m=el('mapa'); if(!m||!window.L) return;
  if(!_map){
    // o container acabou de entrar no DOM e pode estar com altura 0; criar o
    // mapa aqui deixava os tiles sem desenhar (tela preta) até algum clique
    // disparar um invalidateSize. Espera o layout antes de montar.
    if(!m.clientHeight){ requestAnimationFrame(()=>desenhaMapa()); return; }
    _map=L.map(m,{zoomControl:false,attributionControl:false});
    L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
      {subdomains:['mt0','mt1','mt2','mt3'],maxZoom:20}).addTo(_map);
    const bb=bbox();
    if(bb) _map.fitBounds([[bb.minLat,bb.minLon],[bb.maxLat,bb.maxLon]],{padding:[16,16]});
    else _map.setView([-12.62,-44.72],11);
    _map.whenReady(()=>{ try{ _map.invalidateSize(); }catch(e){} });
  }
  if(_lotesL) _map.removeLayer(_lotesL);
  /* na Safra o contorno vira branco discreto: o vermelho brigava com o verde do plantio */
  _lotesL=L.layerGroup(LOTES.map(l=>L.polygon(l.ring,
    SECAO==='safra'?{color:'#ffffff',weight:1,opacity:.55,fill:false,interactive:false}
                   :{color:'#ff4444',weight:1.1,opacity:.8,fill:false,interactive:false}))).addTo(_map);
  if(SECAO==='safra'){
    pararVento();
    if(_heat){ _map.removeLayer(_heat); _heat=null; }
    if(_estL){ _map.removeLayer(_estL); _estL=null; }
    if(_telL){ try{ _map.removeLayer(_telL); }catch(e){} _telL=null; }
    if(SUB==='croq') desenhaCroqui(); else desenhaSafra();
    /* a escala do rótulo depende do tamanho do polígono NA TELA: refaz a cada zoom */
    if(!_map._safZoom){ _map._safZoom=1; _map.on('zoomend',()=>{ if(SECAO==='safra'){ try{ safAjustaRotulos(); }catch(e){} } }); }
    setTimeout(()=>{ try{ _map.invalidateSize(); }catch(e){} },100);
    return;
  }
  /* TELEMETRIA usa o MESMO mapa (dois Leaflet vivos num celular é desperdício),
     mas nada do clima: sem mancha interpolada, sem vento, sem legenda de escala. */
  if(SECAO==='tel'){
    pararVento();
    if(_heat){ _map.removeLayer(_heat); _heat=null; }
    if(_estL){ _map.removeLayer(_estL); _estL=null; }
    desenhaTelemetria();   // ele mesmo escreve a legenda (cores das máquinas ou dos estados)
    /* o ícone tem tamanho REAL (metros), então mudar o zoom muda o pixel — sem
       isto ele ficaria do tamanho errado depois de aproximar */
    if(!_map._telZoom){ _map._telZoom=1; _map.on('zoomend',()=>{ if(SECAO==='tel'&&SUB==='mapa'){ try{ desenhaTelemetria(); }catch(e){} } }); }
    /* entrou na seção sem passar por um carregar() — busca o rastro na hora e
       redesenha quando chegar (o mapa já está no ar com os pinos) */
    if(!Object.keys(TRAILS).length) carregarRastro().then(()=>{ try{ desenhaTelemetria(); }catch(e){} });
    setTimeout(()=>{ try{ _map.invalidateSize(); }catch(e){} },100);
    return;
  }
  if(_telL){ try{ _map.removeLayer(_telL); }catch(e){} _telL=null; }
  if(_heat){ _map.removeLayer(_heat); _heat=null; }
  const cfg=VARS[VARMAPA], pts=valores(VARMAPA), bb=bbox();
  const lg=el('legenda');

    return;
  }
  pararVento();

    const CW=180,CH=180,cv=document.createElement('canvas'); cv.width=CW; cv.height=CH;
    const cx=cv.getContext('2d'),img=cx.createImageData(CW,CH);
    for(let i=0;i<CH;i++){ const lat=bb.maxLat-(i/(CH-1))*(bb.maxLat-bb.minLat);
      for(let j=0;j<CW;j++){ const lon=bb.minLon+(j/(CW-1))*(bb.maxLon-bb.minLon),k=(i*CW+j)*4;
        const v=idw(lat,lon,pts); if(v===null){ img.data[k+3]=0; continue; }

    if(lg){

function marcadores(){

/* ============================================================
   GRÁFICO COM EIXOS — mesma ideia da versão do desktop
   ------------------------------------------------------------
   Era sparkline: sem escala, sem hora, e com os pontos espaçados
   por ÍNDICE — seis horas sem leitura ocupavam a largura de uma.
   Aqui o X é TEMPO REAL e a linha QUEBRA no buraco.
   Saiu também o preserveAspectRatio="none": com texto dentro do
   SVG ele deformaria os rótulos.
   ============================================================ */
function passoBonito(faixa,alvo){
  if(!(faixa>0)) return 1;
  const bruto=faixa/alvo,mag=Math.pow(10,Math.floor(Math.log10(bruto))),n=bruto/mag;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
}
const PASSOS_T=[1,2,3,6,12,24,48,120,168].map(h=>h*3600e3);
function ticksTempo(t0,t1,alvo){
  const passo=PASSOS_T.find(p=>(t1-t0)/p<=alvo)||PASSOS_T[PASSOS_T.length-1];
  const ph=passo/3600e3,out=[],d=new Date(t0);
  d.setMinutes(0,0,0);
  if(ph>=24) d.setHours(0,0,0,0); else d.setHours(Math.ceil(d.getHours()/ph)*ph,0,0,0);
  let t=d.getTime();
  while(t<=t1){ if(t>=t0) out.push(t);
    if(ph>=24){ const n=new Date(t); n.setDate(n.getDate()+ph/24); t=n.getTime(); } else t+=passo; }
  return {ticks:out,passo};
}
function rotuloTick(t,passo){
  const d=new Date(t);
  const dia=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
  if(passo>=24*3600e3) return [dia,''];
  return [String(d.getHours()).padStart(2,'0')+'h', d.getHours()===0?dia:''];
}

function grafico(s,campo,cor,unid){
  campo=campo||'temp'; cor=cor||'#ff7a45'; unid=unid===undefined?'°C':unid;
  const P=s.map(h=>({t:new Date(h.hora).getTime(),v:num(h[campo])}))
           .filter(p=>p.v!==null&&!isNaN(p.t)).sort((a,b)=>a.t-b.t);
  if(P.length<2) return `<div class="muted" style="text-align:center;padding:30px 0">
    ${P.length?'só 1 leitura':'sem dado no período'}</div>`;

  const [t0,t1]=janelaHist();
  /* T=28 abre faixa para a unidade ficar ACIMA da escala, sem encostar no
     rótulo do topo (os dois alinhados à direita no mesmo x). */
  const W=340,H=156,L=30,R=8,T=28,B=30,PW=W-L-R,PH=H-T-B;
  const vs=P.map(p=>p.v);
  let mn=Math.min(...vs),mx=Math.max(...vs);
  if(mn===mx){ mn-=1; mx+=1; }
  const pY=passoBonito(mx-mn,3), y0=Math.floor(mn/pY)*pY, y1=Math.ceil(mx/pY)*pY;
  const X=t=>L+((t-t0)/((t1-t0)||1))*PW, Y=v=>T+PH-((v-y0)/((y1-y0)||1))*PH;

  const segs=[]; let cur=[];
  P.forEach((p,i)=>{ if(i&&p.t-P[i-1].t>2*3600e3){ if(cur.length>1)segs.push(cur); cur=[]; } cur.push(p); });
  if(cur.length>1) segs.push(cur);
  const dp=g=>'M '+g.map(p=>X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' L ');
  const areas=segs.map(g=>`<path d="${dp(g)} L ${X(g[g.length-1].t).toFixed(1)} ${T+PH} L ${X(g[0].t).toFixed(1)} ${T+PH} Z" fill="url(#g_${campo})"/>`).join('');
  const linhas=segs.map(g=>`<path d="${dp(g)}" fill="none" stroke="${cor}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const solt=P.filter((p,i)=>(i===0||p.t-P[i-1].t>2*3600e3)&&(i===P.length-1||P[i+1].t-p.t>2*3600e3))
              .map(p=>`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.2" fill="${cor}"/>`).join('');

  let gy='';
  for(let v=y0; v<=y1+1e-9; v+=pY){
    const y=Y(v).toFixed(1);
    gy+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--border)" stroke-opacity=".7"/>
         <text x="${L-5}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="9"
               fill="var(--muted)">${f(v,pY<1?1:0)}</text>`;
  }
  const {ticks,passo}=ticksTempo(t0,t1,ALVO_TICKS);
  let gx='';
  ticks.forEach(t=>{
    const x=X(t).toFixed(1), r=rotuloTick(t,passo);
    gx+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${T+PH}" stroke="var(--border)" stroke-opacity=".45"/>
         <text x="${x}" y="${T+PH+12}" text-anchor="middle" font-size="9" fill="var(--muted)">${r[0]}</text>`;
    if(r[1]) gx+=`<text x="${x}" y="${T+PH+22}" text-anchor="middle" font-size="8" fill="var(--muted2)">${r[1]}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="g_${campo}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${cor}" stop-opacity=".38"/>
      <stop offset="100%" stop-color="${cor}" stop-opacity="0"/></linearGradient></defs>
    ${gy}${gx}${areas}${linhas}${solt}
    <line x1="${L}" y1="${T+PH}" x2="${W-R}" y2="${T+PH}" stroke="var(--border2)"/>
    <text x="${L-5}" y="${T-17}" text-anchor="end" font-size="8" fill="var(--muted2)">${unid.trim()}</text>
  </svg>
  <div class="ex" style="display:flex;justify-content:space-between;margin-top:6px">
    <span>mín ${f(Math.min(...vs),1)}${unid}</span><span>${P.length} leituras</span>
    <span>máx ${f(Math.max(...vs),1)}${unid}</span></div>`;
}
const semDado=(t)=>`<div class="vazio">${IC.clima}${t||'Nenhuma estação enviou leitura ainda.'}</div>`;

/* ===================== SAFRA (02/10/2026) =====================
   O que já foi feito em cada lote, no mapa, e como a safra evoluiu até hoje.
   FONTE ÚNICA: a view `safra_atividades` (migração 141). Ela existe porque a
   conta de CONSULTA não lê `comandas` (migração 81) — lendo a tabela, a aba
   sairia vazia para todo mundo menos o admin. A view não traz preço nem custo.
   Nada aqui é guardado: o mapa é refeito do banco a cada leitura (diretriz
   "UI = reflexo do banco"). Comanda LANÇADA = programada (ou feita e ainda não
   aprovada): aparece tracejada, e só no "hoje" — no passado não se sabia dela.
   O controle de tempo (SAFD) é só DESENHO: arrastar não vai ao banco. */
let SAFRA=[], SAFRA_OK=0, _safTentou=false, SAFD=null, SAFSEL=null, SAFCOM=null, _safL=null, _safPlay=null;
function safraAtual(){ const d=new Date(), y=d.getFullYear(); return d.getMonth()>=6?`${y}/${y+1}`:`${y-1}/${y}`; }
const safEsc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* dose vem como texto, às vezes "0,308", às vezes "2.15" (depende de quem gravou) */
const safN=v=>{ if(v==null||v==='') return null; const n=+String(v).replace(',','.'); return isNaN(n)?null:n; };
const safBR=(v,c)=>v==null||isNaN(v)?'—':(+v).toLocaleString('pt-BR',{minimumFractionDigits:c||0,maximumFractionDigits:c||0});
/* data 'AAAA-MM-DD' -> meia-noite LOCAL (new Date('AAAA-MM-DD') seria UTC e
   jogaria o dia para trás aqui no fuso -3 — armadilha do CLAUDE.md) */
const safDia=iso=>{ if(!iso) return null; const p=String(iso).slice(0,10).split('-').map(Number);
  return p.length===3?new Date(p[0],p[1]-1,p[2]).getTime():null; };
const safDM=ms=>{ const d=new Date(ms); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); };
const safFimHoje=()=>{ const d=new Date(); d.setHours(23,59,59,999); return d.getTime(); };
const safFim=()=>SAFD==null?safFimHoje():SAFD;
const SAFTIPO={'Plantio':['#2ecc71','🌱'],'Pulverização Terrestre':['#4aa3ff','💧'],'Pulverização Aérea':['#8fd3ff','✈️'],
  'Adubação':['#ff9f43','🧪'],'Tratamento de Sementes':['#c084fc','🫘'],
  'Colheita de Grãos':['#ffc107','🌾'],'Colheita de Fibras':['#ffc107','☁️']};
const safCor=t=>(SAFTIPO[t]||['#9aa9c0'])[0];
const safIco=t=>(SAFTIPO[t]||['','•'])[1];
/* verde mais escuro quanto mais tempo de plantado (dias após o plantio) */
const safCorDap=d=>d<7?'#d4f5a2':d<21?'#86dc5c':d<60?'#2ea043':'#1b7a33';
const safCurto=n=>String(n).replace(/^Pivo\s*/i,'P').replace(/^Lote\s*/i,'');
const safCentro=r=>{ let a=0,b=0; r.forEach(p=>{a+=p[0];b+=p[1];}); return [a/r.length,b/r.length]; };
const safGeo=a=>a.poli||((LOTES.find(l=>l.nome===a.lote_nome)||{}).ring)||null;
const safDap=(a,D)=>Math.floor((D-a.dia)/864e5);
function safDose(p){
  const n=safN(p.dose), un=String(p.un||'').toLowerCase();
  if(n==null) return '';
  if(un==='kg'&&n<1) return safBR(n*1000,0)+' g';
  return n.toLocaleString('pt-BR',{maximumFractionDigits:3})+' '+(un==='kg'?'kg':(p.un||''));
}
/* lançada com data ANTES de hoje = feita no campo, falta aprovar (ex.: plantio
   com telemetria esperando a Aprovação de campo); de hoje em diante = programada */
const safAprovar=a=>{ if(a.status!=='lancada'||a.dia==null) return false;
  const h=new Date(); h.setHours(0,0,0,0); return a.dia<h.getTime(); };
/* "aconteceu até D": executada, ou feita e esperando aprovação. O dono cobrou
   (02/10): o plantio de ontem estava no campo e o mapa não mostrava — a
   aprovação é burocracia do sistema, não muda o que está plantado. */
const safFeita=(a,D)=>a.dia!=null&&a.dia<=D&&(a.status==='executada'||safAprovar(a));
const safSit=a=>a.status==='executada'?safDM(a.dia):safAprovar(a)?`a aprovar · ${safDM(a.dia)}`:'programada';
/* semente do plantio em kg/ha (o nome já aparece como variedade). Semente em
   "big bag" está cadastrada por bag de 1 t (dono, 02/10/2026) -> ×1000 kg. */
const safSemKg=a=>{ const p=(a.produtos||[]).find(x=>/semente/i.test(x.tipo||'')); if(!p) return '';
  const n=safN(p.dose), un=String(p.un||'').toLowerCase(); if(n==null) return '';
  const kg=/big/.test(un)?n*1000:un==='kg'?n:null;
  return kg!=null?safBR(kg,1)+' kg/ha':safDose(p)+'/ha'; };
const safProds=a=>(a.produtos||[]).map(p=>safEsc(String(p.nome||'').replace(/®/g,''))+' '+safDose(p)).join(' · ');
/* primeiro dia da linha do tempo: a 1ª operação da safra (ou 1º de julho) */
function safT0(){
  const ds=SAFRA.filter(a=>a.dia!=null).map(a=>a.dia);
  if(ds.length) return Math.min(...ds);
  const y=+safraAtual().slice(0,4); return new Date(y,6,1).getTime();
}
async function carregarSafra(){
  _safTentou=true;
  try{
    let todos=[];
    for(let de=0;;de+=1000){     // paginar: o Supabase para em 1000 linhas SEM avisar
      const {data,error}=await SB.from('safra_atividades').select('*').eq('safra',safraAtual())
        .order('data_execucao',{ascending:true}).order('codigo').range(de,de+999);
      if(error) throw error;
      todos=todos.concat(data||[]); if(!data||data.length<1000) break;
    }
    SAFRA=todos.map(r=>Object.assign({},r,{
      dia:safDia(r.data_execucao||r.data_emissao), area:safN(r.area_ha),
      poli:Array.isArray(r.ring)&&r.ring.length>2?r.ring.map(p=>utm2ll(+p[0],+p[1])):null }));
    SAFRA_OK=Date.now();
  }catch(e){ console.warn('safra',e); }    // falha de rede NÃO apaga o que já está desenhado
  /* área PLANEJADA de plantio (view `safra_plantio_planejado`, migração 142) — o
     denominador da % do plantio. Busca à parte: se falhar, o mapa não depende dela,
     e a lista anterior fica (resposta vazia sem erro só é aceita se a de cima deu certo). */
  try{
    const {data,error}=await SB.from('safra_plantio_planejado').select('*').eq('safra',safraAtual()).range(0,999);
    if(!error && data && (data.length || SAFRA_OK)) SAFPLAN=data.map(r=>({lote:r.lote_nome,cultura:safCult(r.cultura),ciclo:r.ciclo,area:safN(r.area_ha)||0,irr:!!r.irrigado}));
  }catch(e){ console.warn('safra planejado',e); }
}

/* ---------- RÓTULO QUE CABE NO POLÍGONO (03/10/2026) ----------
   Queixa do dono: o mapa abre de longe e "só vê um monte de escrita" — rótulo de
   tamanho fixo em pixel não encolhe com o polígono, então passa por cima dos vizinhos.
   Regra combinada com ele:
     · DE LONGE o texto fica PRESO ao polígono: encolhe junto, nunca passa da área;
     · DE PERTO trava no tamanho normal: mais zoom não aumenta a letra;
     · quando encolher deixaria ilegível, o rótulo vai "em partes": some a 2ª linha,
       depois o ícone, fica só o principal, e por fim some — "desde que não fique maior
       que o polígono".
   COMO: cada rótulo é registrado (safReg) com o anel do seu polígono. O
   safAjustaRotulos() mede, NA TELA, a largura e a altura do polígono passando pelo
   ponto do rótulo (as duas "cordas" — numa meia-lua a caixa envolvente mentiria), mede
   o tamanho natural do texto e aplica `transform:scale()` = o menor entre 1 e o que
   cabe. Roda ao desenhar e a cada `zoomend`. O nome do lote não passa da escala das
   bandas dele, para não cobrir as porcentagens. */
let _safRot=[];
function safLbl(principal,segunda,icone,quebra){
  return '<div class="sfl'+(quebra?' quebra':'')+'">'+(icone?'<span class="pi">'+icone+'</span>':'')+principal
       +(segunda?'<span class="p2"><br><small>'+segunda+'</small></span>':'')+'</div>';
}
function safReg(mk,ring,lote,tipo){ _safRot.push({mk,ring,lote,tipo}); return mk; }
/* ponto para o NOME do lote quando o miolo está ocupado pelos rótulos das bandas:
   na vertical do centro de massa, a 72% do caminho até a borda norte. Se cair fora
   do anel (lote côncavo), volta para o centro. */
function safTopo(ring){
  const c=safCentroArea(ring); let norte=-1e9; ring.forEach(p=>{ if(p[0]>norte) norte=p[0]; });
  const pt=[c[0]+(norte-c[0])*.72, c[1]]; let dentro=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){ const a=ring[i],b=ring[j];
    if((a[0]>pt[0])!==(b[0]>pt[0]) && pt[1]<(b[1]-a[1])*(pt[0]-a[0])/(b[0]-a[0])+a[1]) dentro=!dentro; }
  return dentro?pt:c;
}
function _safCordas(pts,c){
  const corta=(e,o)=>{ const xs=[];
    for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const a=pts[j],b=pts[i];
      if((a[o]>c[o])!==(b[o]>c[o])) xs.push(a[e]+(c[o]-a[o])/(b[o]-a[o])*(b[e]-a[e])); }
    xs.sort((p,q)=>p-q);
    for(let k=0;k+1<xs.length;k+=2) if(xs[k]<=c[e]&&c[e]<=xs[k+1]) return xs[k+1]-xs[k];

function safAjustaRotulos(){

  const ajusta=(r,teto)=>{
    const tt=r.mk.getTooltip&&r.mk.getTooltip(), et=tt&&tt.getElement&&tt.getElement(), s=et&&et.querySelector('.sfl'); if(!s) return null;
    const base=s.dataset.b||(s.dataset.b=s.className.replace(/\b(n1|n2|n9)\b/g,'').replace(/\s+/g,' ').trim());
    const c=_map.latLngToLayerPoint(r.mk.getLatLng()), pts=r.ring.map(p=>_map.latLngToLayerPoint(p));
    let [w,h]=_safCordas(pts,c);

      let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; pts.forEach(p=>{ x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y); });

    const niveis=r.tipo==='lote'?1:NIV.length;

      if(k>=(r.tipo==='lote'?.5:MIN[i])){ s.style.transform=k<.999?'scale('+k.toFixed(3)+')':'none'; return k; }
    }

      /* previsão é DATA; os dias são o ciclo (dono, 05/10/2026) — o rótulo não mostra mais "· 115 d" */
      .bindTooltip(tem?safLbl('~'+safDM(c.dia),safBR(a.area,1)+' ha')
                 :c?safLbl('aguarda emergência',safBR(a.area,1)+' ha')
                 :safLbl('sem ciclo',safBR(a.area,1)+' ha'),
        {permanent:true,direction:'center',className:'crqplaca'}),r,a.lote_nome,'banda').addTo(g);
  });
  const semCiclo=pls.filter(x=>!x.c).length;
  return datas.map(d=>`<span><i style="background:${corDe(d)};height:9px"></i>&nbsp;${safDM(d)}<b>&nbsp;${safBR(tot[d],1)} ha</b></span>`).join('')
       + (haAg?`<span><i style="background:#6b7a90;height:9px"></i>&nbsp;aguarda emergência<b>&nbsp;${safBR(haAg,1)} ha</b></span>`:'')
       + (semCiclo?`<span class="fraco">${semCiclo} sem ciclo cadastrado</span>`:'');
}
function crqCartaoVariedades(){
  const a=SAFRA.find(x=>x.codigo===CRQSEL); if(!a) return '';
  const pl=a.plantio||{}, D=safFimHoje(), cor=crqCores()[safVarCurta(pl.variedade)]||'#9aa9c0';
  const lin=(r,v)=>`<div class="cl"><span>${r}</span><b>${v}</b></div>`;
  return `<div class="ch"><span class="dot" style="background:${cor}"></span>
      <b>${safEsc(safVarCurta(pl.variedade))} · ${safEsc(a.lote_nome)}</b>
      <button id="cfecha" aria-label="fechar">${IC.fechar}</button></div>
    <div class="sfcorpo">
    ${lin('Variedade', safEsc(safVarCurta(pl.variedade)))}
    ${safTipoSem(pl.variedade)?lin('Semente', safTipoSem(pl.variedade)+(safSemKg(a)?' · '+safSemKg(a):'')):''}
    ${lin('Plantio', safDM(a.dia)+(safAprovar(a)?' <span style="color:var(--gold);font-size:11px">a aprovar</span>':''))}
    ${lin('Emergência', safEmerg(pl))}
    ${(e=>e?lin('Estádio', '<span style="color:var(--gold)">'+safEsc(e.e)+'</span> <span class="fraco" style="font-size:11px">em '+safDM(e.dia)+(e.obs?' · '+safEsc(e.obs):'')+'</span>'):'')(safEstadio(pl))}
    ${lin('Dias após o plantio', safDap(a,D)+' DAP')}
    ${(()=>{ const c=safColheita(a);
      if(!c) return lin('Colheita prevista','<span class="fraco">sem ciclo cadastrado</span>');
      if(c.aguarda) return lin('Evolução do ciclo','0% <span class="fraco" style="font-size:11px">aguardando emergência</span>')
           + lin('Colheita prevista','<span class="fraco">sem data — aguardando emergência</span>')
           + lin('Ciclo', c.ciclo+' dias <span class="fraco" style="font-size:11px">da emergência</span>');
      const falta=Math.ceil((c.dia-D)/864e5), e=safEvol(a);
      return lin('Evolução do ciclo', safBR(e.pct,0)+'% <span class="fraco" style="font-size:11px">dia '+e.dias+' de '+e.ciclo+'</span>')
           + `<div style="height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin:0 0 6px"><div style="height:6px;border-radius:3px;width:${Math.max(2,e.pct).toFixed(0)}%;background:${safCorEvol(e.pct)}"></div></div>`
           + lin('Colheita prevista','~'+safDMA(c.dia)+(falta>0?` <span class="fraco" style="font-size:11px">faltam ${falta} d</span>`:''))
           + lin('Ciclo', c.ciclo+' dias <span class="fraco" style="font-size:11px">'+(c.base==='plantio'?'do plantio'
               :'da emergência'+(safDia(pl.emergencia_fim)!=null&&safEmerRef(pl)!==safDia(pl.emergencia_ini||pl.emergencia)?' (média '+safDM(safEmerRef(pl))+')':' ('+safDM(safEmerRef(pl))+')'))+'</span>'); })()}
    ${(()=>{ const tot=+a.area_lote||0; if(!tot) return '';
      const pl=crqPlantios().filter(x=>x.lote_nome===a.lote_nome).reduce((s,x)=>s+(x.area||0),0);
      return lin('Plantado no lote', safBR(Math.min(100,pl/tot*100),0)+'% <span class="fraco" style="font-size:11px">'+safBR(pl,1)+' de '+safBR(tot,1)+' ha</span>'); })()}
    ${lin('Área', safBR(a.area,2)+' ha'+(a.poli?' <span class="fraco" style="font-size:11px">(banda)</span>':''))}
    ${pl.populacao?lin('População', safEsc(pl.populacao)+' sem/ha'):''}
    ${pl.sementes_m?lin('Sementes por metro', safEsc(pl.sementes_m)):''}
    ${!safTipoSem(pl.variedade)&&safSemKg(a)?lin('Semente', safSemKg(a)):''}
    ${lin('Comanda', safEsc(a.codigo))}
    ${a.obs?`<div class="muted" style="font-size:12px;padding:6px 0 2px;color:var(--warn)">⚠ ${safEsc(a.obs)}</div>`:''}
    </div>`;
}
const CROQUIS=[
  {id:'var', nome:'Variedades', desenha:crqDesenhaVariedades, cartao:crqCartaoVariedades},
  {id:'evol', nome:'Evolução do ciclo', desenha:crqDesenhaEvolucao, cartao:crqCartaoVariedades},
  {id:'colh', nome:'Colheita prevista', desenha:crqDesenhaColheita, cartao:crqCartaoVariedades}
];
/* cartão do RESUMO (abre ao tocar a pílula do topo): a tabela por cultura e regime */
const CRQ_RESUMO='__resumo';
function crqCartaoResumo(){
  return `<div class="ch"><span class="dot" style="background:var(--gold)"></span><b>Safra ${safraAtual()}</b>
      <button id="cfecha" aria-label="fechar">${IC.fechar}</button></div>
    <div class="sfcorpo">${safResumoHTML()||'<div class="muted" style="padding:10px 0;font-size:13px">Sem planejamento nem plantio lançado.</div>'}</div>`;
}
/* pílula do topo dos croquis: os dois números gerais, e é o botão do resumo */
function crqPilula(){
  const g=safResumo()[0]; if(!g) return '';
  return `<button class="crqres" id="crqres" aria-label="Resumo da safra">🌱 Plantio <b>${safPct(g.pctPlant)}</b>
    <span class="fraco">${safBR(g.plant,0)} de ${safBR(g.plan,0)} ha</span> · Ciclo <b>${safPct(g.pctCiclo)}</b> <span class="fraco">▾</span></button>`;
}
const croqAtual=()=>CROQUIS.find(c=>c.id===CROQ)||CROQUIS[0];
function desenhaCroqui(){
  if(!_map) return;
  if(_safL){ _map.removeLayer(_safL); _safL=null; }
  _safRot=[];
  const g=L.layerGroup();
  // tocar fora das bandas fecha o cartão (lote sem nada fica só com o contorno)
  LOTES.forEach(l=>L.polygon(l.ring,{stroke:false,fillOpacity:0,bubblingMouseEvents:false})
    .on('click',()=>{ CRQSEL=null; desenhaCroqui(); }).addTo(g));
  const leg=croqAtual().desenha(g);
  _safL=g.addTo(_map);
  safAjustaRotulos(); setTimeout(safAjustaRotulos,180);
  const lg=el('legenda');
  if(lg){ lg.className='legenda mini'; lg.style.display='';
    lg.innerHTML=leg||'<span class="fraco">Nenhum plantio lançado nesta safra.</span>'; }
  const c=el('cartao'); if(!c) return;
  const h=CRQSEL===CRQ_RESUMO?crqCartaoResumo():CRQSEL?croqAtual().cartao():'';
  if(!h){ c.style.display='none'; c.innerHTML=''; return; }
  c.style.display=''; c.innerHTML=h;
  const b=el('cfecha'); if(b) b.onclick=()=>{ CRQSEL=null; desenhaCroqui(); };
}

/* folha "Atividades": resumo + tudo o que foi feito, do mais novo para o mais velho */
function folhaSafra(){
  if(!SAFRA_OK) return _safTentou?`<div class="vazio">${IC.safra}Não deu para ler as atividades agora.<br>
    <span style="font-size:13px">Tenta de novo em instantes.</span></div>`:'<div class="vazio">Carregando…</div>';
  if(!SAFRA.length) return `<div class="vazio">${IC.safra}Nenhuma atividade lançada na safra ${safraAtual()}.</div>`;
  const ex=SAFRA.filter(a=>a.status==='executada'), pr=SAFRA.filter(a=>a.status==='lancada');
  const hap=pr.filter(a=>a.tipo_ativ==='Plantio'&&safAprovar(a)).reduce((s,a)=>s+(a.area||0),0);
  const ha=ex.filter(a=>a.tipo_ativ==='Plantio').reduce((s,a)=>s+(a.area||0),0)+hap;
  const nl=new Set(ex.map(a=>a.lote_nome)).size;
  const item=a=>{ const pl=a.plantio||{};
    const det=a.tipo_ativ==='Plantio'
      ?[pl.variedade?safEsc(pl.variedade):'', pl.sementes_m?safEsc(pl.sementes_m)+' sem/m':''].filter(Boolean).join(' · ')
      :safProds(a);
    return `<div class="item" data-sfir="${safEsc(a.codigo)}" style="cursor:pointer;align-items:flex-start">
      <span class="dot" style="background:${safCor(a.tipo_ativ)};margin-top:5px"></span>
      <div style="min-width:0"><div class="nm">${safIco(a.tipo_ativ)} ${safEsc(a.tipo_ativ)} · ${safEsc(a.lote_nome)}</div>
        <div class="sb">${a.status==='lancada'?`<b style="color:var(--gold)">${safSit(a)}</b>`:safDM(a.dia)} · ${safBR(a.area,1)} ha${a.poli?' (parte)':''}${det?'<br>'+det:''}</div></div></div>`; };
  const porMes={}; ex.slice().sort((a,b)=>(b.dia||0)-(a.dia||0)).forEach(a=>{
    const k=new Date(a.dia).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); (porMes[k]=porMes[k]||[]).push(a); });
  return `<div class="sec">Safra ${safraAtual()}</div>
    <div class="grid">
      <div class="card"><div class="lb">Plantado</div><div class="vl">${safBR(ha,1)}<span class="u">ha</span></div>${hap?`<div class="ex">${safBR(hap,1)} ha a aprovar</div>`:''}</div>
      <div class="card"><div class="lb">Operações feitas</div><div class="vl">${ex.length}</div><div class="ex">em ${nl} lote${nl===1?'':'s'}</div></div>
    </div>
    ${safResumoHTML()?`<div class="sec">Evolução da safra</div><div class="card w">${safResumoHTML()}</div>`:''}
    ${pr.length?`<div class="sec">Programado / a aprovar (${pr.length})</div>${pr.map(item).join('')}`:''}
    ${Object.keys(porMes).map(k=>`<div class="sec">${k}</div>${porMes[k].map(item).join('')}`).join('')}
    <div class="muted" style="font-size:12px;text-align:center;margin:18px 0 6px">Toque numa atividade para vê-la no mapa.</div>`;
}

/* ---------- render ---------- */
/* No topo à direita vai a DATA E HORA da última leitura — não o período.
   Repetir "Agora" ali não dizia nada (e continuava "Agora" mesmo com 7 dias
   selecionado). O que interessa saber de relance é quão fresco é o dado. */
function selo(){
  // a hora da ultima leitura so faz sentido no 'Agora'; em 24h/7d/30d o que
  // esta na tela e um agregado da janela, nao um instante
  if(PERIODO!=='agora') return '';
  const v=ATUAL.filter(x=>x.temp!==null);
  if(!v.length) return '<span class="tag wait">sem leitura</span>';
  const n=Math.min(...v.map(x=>{ const i=idadeDe(x); return i===null?9e9:i; }));
  let ms=null; v.forEach(x=>{ const t=new Date(x.medido_em).getTime();
    if(!isNaN(t)&&(ms===null||t>ms)) ms=t; });
  const d=ms?new Date(ms):null;
  const hoje=d&&d.toDateString()===new Date().toDateString();
  const txt=d?(hoje?d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
                   :d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}))
            :'—';
  return `<span class="tag ${n<600?'ok':'old'}">${n<600?'●':'⚠'} ${txt}</span>`;
}
/* O aviso do vigia fica no TOPO, em qualquer seção — inclusive no Clima, que é
   onde o app abre. Se ele só existisse dentro da aba Vigia, quem não entrasse
   lá não veria: seria repetir exatamente a falha de agosto, em que o dado
   estava no banco e ninguém olhou. Clicar leva direto para a aba. */
function avisoVigia(){
  const n=vgAlertas().length;
  if(!n) return '';
  return `<span class="tag err" id="avvigia" style="cursor:pointer">⚠ ${n} caixa${n>1?'s':''}</span>`;
}
let _modo=null;   // 'mapa' | 'folha' — só remonta a estrutura quando o modo muda

  const noMapa = ((SECAO==='clima' || SECAO==='tel' || SECAO==='safra') && SUB==='mapa')
              || (SECAO==='safra' && SUB==='croq');

  let corpo='';

  else if(SECAO==='safra') corpo = (SUB==='ativ') ? folhaSafra() : '';
  else if(SECAO!=='clima') corpo=emObra(SECOES.find(s=>s[0]===SECAO)[1]);
  else if(SUB==='agora') corpo=folhaAgora();
  else if(SUB==='hist') corpo=folhaHist();

  if(_modo!==modo || !el('palco')){

  }
  const faixaHist = !noMapa && SUB==='hist';

    el('folha').innerHTML=corpo;
    // a faixa flutua sobre o conteúdo; sem folga extra ela taparia o 1º título

  }

  el('chrome').innerHTML=`
    <div class="topo"><div class="marca"><span class="l">🌿</span> Alabama</div>${avisoVigia()}${selo()}</div>
    ${faixaHist?`
      <div class="faixa p1">

      </div>
      ${SELETOR==='hper'?`<div class="gaveta">
        ${Object.keys(HPERIODOS).map(k=>`<button data-hper="${k}" class="${HPER===k?'on':''}"
            >${HPERIODOS[k].lbl}</button>`).join('')}
        <button data-hper="custom" class="${HPER==='custom'?'on':''}">📅 Ajustar…</button>
        ${HPER==='custom'?(()=>{ const j=janelaHist(); return `
          <div style="display:flex;flex-direction:column;gap:5px;padding:6px 4px 2px">
            <input type="date" id="hde"  value="${dLocal(j[0])}" max="${dLocal(Date.now())}"
                   style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;
                          color:var(--text);padding:6px;font-size:13px">
            <input type="date" id="hate" value="${dLocal(j[1])}" max="${dLocal(Date.now())}"
                   style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;
                          color:var(--text);padding:6px;font-size:13px">
          </div>`; })():''}
      </div>`:''}
    `:''}
    ${mapaClima?`
      <div class="faixa p1">
        <button class="chip sel ${SELETOR==='var'?'on':''}" data-abrir="var">${VARS[VARMAPA].lbl} ▾</button>
        <button class="chip sel ${SELETOR==='per'?'on':''}" data-abrir="per">${PERIODOS[PERIODO].lbl} ▾</button>
      </div>
      ${SELETOR?`<div class="gaveta">${
        (SELETOR==='var'
          ? Object.keys(VARS).map(k=>[k,VARS[k].lbl,VARMAPA===k,'vm'])
          : Object.keys(PERIODOS).map(k=>[k,PERIODOS[k].lbl,PERIODO===k,'per'])
        ).map(([k,n,on,tipo])=>`<button data-${tipo}="${k}" class="${on?'on':''}">${n}</button>`).join('')
      }</div>`:''}`:''}
    ${SECAO==='tel'&&SUB==='mapa'?`
      <div class="faixa p1">
        <button class="chip sel ${SELETOR==='trp'?'on':''}" data-abrir="trp">${TRPERS[TRPER]}${TRPER!=='off'?(TRMODO==='trab'?' · trabalho':' · tudo'):''} ▾</button>
        <button class="chip sel ${SELETOR==='tmq'?'on':''}" data-abrir="tmq">${rotuloTMaqs()} ▾</button>
        <button class="chip ico ${MED.on?'on':''}" id="medbtn" title="Medir área ou distância" aria-label="Medir">${IC.esquadro}</button>
        ${TRPER!=='off'?`<button class="chip ico ${TL.ativo?'on':''}" id="tlbtn" title="${TL.ativo?'Sair do timelapse':'Ver o rastro acontecendo (hora do GPS)'}" aria-label="Timelapse">${IC.play}</button>`:''}
      </div>
      <div class="medpill" id="medcx" style="display:${MED.on?'inline-flex':'none'}"></div>
      ${TL.ativo?`<div class="tlpill"><b id="tlhora">${TL.t!=null?tlHora(TL.t):''}</b>
        <span class="tltrilho" id="tltrilho"><span class="tlfeito" id="tlbar"></span><span class="tlpega" id="tlpega"></span></span>
        <button id="tlvel" title="Velocidade — 1× é uma hora de rastro por segundo">${TL.vel}×</button>

      ${SELETOR==='trp'?`<div class="gaveta">${Object.keys(TRPERS).map(k=>
        `<button data-trp="${k}" class="${TRPER===k?'on':''}">${TRPERS[k]}</button>`).join('')}
        ${TRPER!=='off'?`<div style="display:flex;gap:6px;padding-top:6px;margin-top:4px;border-top:1px solid var(--border)">
          <button data-trmodo="trab" class="${TRMODO==='trab'?'on':''}" style="flex:1">Só trabalho</button>

      </div>
      ${SELETOR==='croq'?`<div class="gaveta">${CROQUIS.map(c=>
        `<button data-croq="${c.id}" class="${CROQ===c.id?'on':''}">${c.nome}</button>`).join('')}
        <div class="muted" style="font-size:11px;padding:6px 4px 2px">Novos croquis entram nesta lista ao longo da safra.</div>

    ${noMapa?`
      <div class="legenda" id="legenda" style="margin-top:0"></div>
      <div class="cartao" id="cartao" style="display:none"></div>`:''}`;

  el('flutua').innerHTML=`
    ${MENU?'<div class="veu" id="veu"></div>':''}

    ${MENU==='dir'?`<div class="menu dir">${(SUBS[SECAO]||[]).length
      ?SUBS[SECAO].map(([k,n,i])=>`<button data-sub="${k}" class="${SUB===k?'on':''}">${i}<span>${n}</span></button>`).join('')

    <button class="fab dir ${MENU==='dir'?'aberto':''}" id="fdir">${MENU==='dir'?IC.fechar:iconeSub()}</button>`;

  el('fesq').onclick=()=>{ MENU=MENU==='esq'?null:'esq'; pinta(); };
  el('fdir').onclick=()=>{ MENU=MENU==='dir'?null:'dir'; pinta(); };
  if(el('veu')) el('veu').onclick=()=>{ MENU=null; pinta(); };
  document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{
    SECAO=b.dataset.sec; SUB=(SUBS[SECAO]||[['mapa']])[0][0]; MENU=null; SELETOR=null; ESTSEL=null; SAFSEL=null; SAFCOM=null; SAFD=null; CRQSEL=null; if(window.RESV_UI) RESV_UI.fecharJanela(); _telEnq=false; medDesligar(); tlParar(); TL.ativo=false; TL.t=null; trocarTela(pinta); });   /* entrou noutra seção: enquadra de novo, e a medição não vai junto */
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{
    SUB=b.dataset.sub; MENU=null; SELETOR=null; ESTSEL=null; if(window.RESV_UI) RESV_UI.fecharJanela(); _telEnq=false; medDesligar(); tlParar(); TL.ativo=false; TL.t=null; trocarTela(pinta); });
  if(el('avvigia')) el('avvigia').onclick=()=>{
    SECAO='tel'; SUB='vigia'; MENU=null; SELETOR=null; medDesligar(); tlParar();
    TL.ativo=false; TL.t=null; trocarTela(pinta); };
  document.querySelectorAll('[data-vgsil]').forEach(b=>b.onclick=()=>
    vgSilenciar(b.dataset.vgsil, b.dataset.dias));
  document.querySelectorAll('[data-vgvolta]').forEach(b=>b.onclick=()=>
    vgVoltar(b.dataset.vgvolta));
  document.querySelectorAll('[data-htab]').forEach(b=>b.onclick=()=>{ HTAB=b.dataset.htab; pinta(); });
  document.querySelectorAll('[data-hper]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.hper;
    if(k==='custom'){                       // ao entrar, parte da janela que já está na tela
      if(HPER!=='custom'){ const j=janelaHist(); HDE=j[0]; HATE=j[1]; }
      HPER='custom'; pinta(); return;       // gaveta FICA aberta: as datas estão dentro dela
    }
    HPER=k; SELETOR=null; pinta();
  });
  ['hde','hate'].forEach(id=>{ const c=document.getElementById(id); if(!c) return;
    c.onchange=()=>{
      const a=new Date(document.getElementById('hde').value+'T00:00:00'),
            b2=new Date(document.getElementById('hate').value+'T23:59:59');
      if(isNaN(a)||isNaN(b2)||a>=b2) return;
      HDE=a.getTime(); HATE=b2.getTime();
      // faixa mais antiga que a carregada não adianta filtrar — tem que buscar
      if(HDE < Date.now()-DIAS_HIST*864e5){
        DIAS_HIST=Math.ceil((Date.now()-HDE)/864e5)+1;
        carregar().then(()=>pinta()); return;
      }
      pinta();
    };
  });
  document.querySelectorAll('[data-sair]').forEach(b=>b.onclick=async()=>{
    MENU=null; DESLOGADO=true; destruirMapa();
    /* signOut local: derruba a sessao deste aparelho. Nao depende de rede dar
       certo -- se falhar, a tela de login aparece do mesmo jeito. */
    try{ await SB.auth.signOut(); }catch(_){}
    CONTA='';
    telaLogin('Você saiu.');
  });
  document.querySelectorAll('[data-abrir]').forEach(b=>b.onclick=()=>{
    SELETOR = SELETOR===b.dataset.abrir ? null : b.dataset.abrir; pinta(); });
  document.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{
    PERIODO=b.dataset.per; SELETOR=null; pinta(); });
  /* rastro: trocar o período REBUSCA (é outro recorte no banco); desligar não
     busca nada. Em ambos os casos redesenha sem recriar o mapa. */
  document.querySelectorAll('[data-trp]').forEach(b=>b.onclick=async()=>{
    TRPER=b.dataset.trp; salvarTelFiltro(); SELETOR=null; _telEnq=false; pinta();   // outro período = outro recorte: reenquadra
    await carregarRastro(); try{ desenhaTelemetria(); }catch(e){} });
  const bmed=el('medbtn'); if(bmed) bmed.onclick=()=>medToggle();
  const btl=el('tlbtn'); if(btl) btl.onclick=()=>tlFerramenta();
  const bpp=el('tlpp'); if(bpp) bpp.onclick=()=>tlPlayPause();
  const bv=el('tlvel'); if(bv) bv.onclick=()=>tlVelocidade();
  if(TL.ativo){ tlBarra(); tlLigarArraste(); }
  if(MED.on) medDesenhar();   // a repintura refaz a caixa: redesenha para religar os botões ↶ e ✕
  /* trabalho × tudo: é só DESENHO — não volta ao banco */
  document.querySelectorAll('[data-trmodo]').forEach(b=>b.onclick=()=>{
    TRMODO=b.dataset.trmodo; salvarTelFiltro(); SELETOR=null; pinta();
    try{ desenhaTelemetria(); }catch(e){} });
  /* máquina: seleção MÚLTIPLA (o botão "Todas" limpa) */
  document.querySelectorAll('[data-tmq]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.tmq;
    if(!id) TMAQS=[];
    else { const i=TMAQS.map(String).indexOf(String(id)); if(i>=0) TMAQS.splice(i,1); else TMAQS.push(id); }
    salvarTelFiltro(); _telEnq=false; pinta();   // outra máquina costuma estar em outro lugar: reenquadra
    await carregarRastro(); try{ desenhaTelemetria(); }catch(e){} });
  document.querySelectorAll('[data-vm]').forEach(b=>b.onclick=()=>{
    VARMAPA=b.dataset.vm; SELETOR=null; pinta(); });

  if(el('crqres')) el('crqres').onclick=()=>{ CRQSEL=CRQSEL===CRQ_RESUMO?null:CRQ_RESUMO; desenhaCroqui(); };
  document.querySelectorAll('[data-croq]').forEach(b=>b.onclick=()=>{
    CROQ=b.dataset.croq; CRQSEL=null; SELETOR=null; pinta(); });
  if(SECAO==='safra'){
    safLigar();
    /* entrou na seção sem passar por um carregar(): busca uma vez e repinta.
       `_safTentou` impede o laço se a leitura falhar (a folha diz que falhou). */
    if(!SAFRA_OK && !_safTentou) carregarSafra().then(()=>{ if(SECAO==='safra') pinta(); });
  }

  /* o `ATUAL.some(...)` é condição do CLIMA (não desenhar mancha sem leitura).
     O mapa da telemetria e o da safra não dependem de estação nenhuma. */
  if(noMapa && (SECAO==='tel' || SECAO==='safra' || ATUAL.some(x=>x.temp!==null))) garantirLeaflet(desenhaMapa);
}
/* trocar de seção/submenu muda o modo -> aí sim o mapa é destruído de verdade */
function trocarTela(fn){ destruirMapa(); _modo=null; fn(); }

/* ---------- login ---------- */
function telaLogin(msg){
  el('app').innerHTML=`<div class="login">
    <h1><span style="color:var(--gold)">🌿</span> Alabama Agro</h1>
    <p>Consulta — escritório e proprietários</p>
    <label>E-mail</label><input id="em" type="email" autocomplete="username" inputmode="email">
    <label>Senha</label><input id="pw" type="password" autocomplete="current-password">
    <button id="btn">Entrar</button><div class="msg">${msg||''}</div></div>`;
  const entrar=async()=>{
    const e=el('em').value.trim(), s=el('pw').value;
    if(!e||!s) return telaLogin('Preencha e-mail e senha.');
    el('btn').textContent='Entrando…'; el('btn').disabled=true;
    const {error}=await SB.auth.signInWithPassword({email:e,password:s});
    if(error) return telaLogin(error.message);
    DESLOGADO=false;
    iniciar();
  };
  el('btn').onclick=entrar;
  el('pw').onkeydown=ev=>{ if(ev.key==='Enter') entrar(); };
}
async function iniciar(){
  el('app').innerHTML='<div class="vazio" style="padding-top:140px">Carregando…</div>';
  await carregar();

  /* ATUALIZAÇÃO — por que só o setInterval não bastava:
     o navegador do celular CONGELA temporizadores quando o app vai para 2º
     plano (e ao bloquear a tela). Voltando, o intervalo podia não disparar por
     minutos — ou nunca — e a tela ficava com dado velho até recarregar a página
     na mão, que foi exatamente o sintoma relatado.
     A correção é não depender do relógio: recarregar quando o app VOLTA a ficar
     visível. O intervalo continua, mas como reforço, não como único caminho. */
  /* _TIMERS: instalar UMA vez so. Com o botao Sair, iniciar() passou a poder
     rodar de novo no mesmo carregamento da pagina -- sem esta trava, cada
     login empilhava mais um setInterval e mais um listener, e a tela passava
     a recarregar N vezes por minuto. */
  if(_TIMERS) return;
  _TIMERS=true;
  setInterval(()=>{ if(document.visibilityState==='visible') carregar(); },60000);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible') carregar();
  });
  window.addEventListener('focus',()=>carregar());
  window.addEventListener('online',()=>carregar());
}
(async function(){
  if(!window.supabase){ el('app').innerHTML='<div class="vazio">Sem internet</div>'; return; }
  SB=window.supabase.createClient(SB_URL,SB_KEY);
  const {data}=await SB.auth.getSession();
  if(data&&data.session) iniciar(); else telaLogin();
})();
</script>
